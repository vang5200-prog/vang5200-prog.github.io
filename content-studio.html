<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>每日文案工作台 · 關係眼</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日文案">
<meta name="theme-color" content="#FAF3EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --shadow-sm:0 1px 3px rgba(55,53,47,0.06), 0 1px 2px rgba(55,53,47,0.04);
  --shadow-md:0 4px 16px rgba(55,53,47,0.08);
  --shadow-lg:0 12px 32px rgba(55,53,47,0.12);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:'Noto Sans TC',sans-serif; background:var(--bg); color:var(--dark); -webkit-font-smoothing:antialiased; overscroll-behavior:none;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
::selection{background:var(--soft-pink); color:var(--dark);}
.icon{width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; display:block;}

.app{display:flex; min-height:100vh;}
.sidebar{width:224px; flex-shrink:0; background:#fff; border-right:1px solid #EEEAE4; display:flex; flex-direction:column; padding:26px 14px; gap:3px; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:10px; padding:0 10px 22px;}
.brand-mark{width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--soft-pink),var(--soft-blue)); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}
.brand-text{line-height:1.25;}
.brand-text b{font-weight:900; font-size:14.5px; display:block;}
.brand-text span{font-size:10.5px; color:var(--gray); letter-spacing:.03em;}
.nav-group-label{font-size:10.5px; color:var(--gray); font-weight:700; letter-spacing:.06em; padding:14px 12px 6px;}
.nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--medium); background:none; border:none; text-align:left; width:100%; font-weight:500; font-size:13.8px; transition:background .15s,color .15s;}
.nav-item .icon{width:16px; height:16px; color:var(--gray); transition:color .15s;}
.nav-item:hover{background:var(--light-pink);}
.nav-item.active{background:var(--light-pink); color:var(--pink); font-weight:700;}
.nav-item.active .icon{color:var(--pink);}
.sidebar-foot{margin-top:auto; padding-top:14px; display:flex; flex-direction:column; gap:8px;}
.foot-btn{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--radius-sm); background:var(--cream); border:1px solid #EFE4DC; color:var(--medium); font-size:12.5px; font-weight:500;}
.foot-btn .icon{width:14px; height:14px; color:var(--pink);}
.foot-btn:hover{background:var(--light-pink);}

.main{flex:1; min-width:0; padding:28px 32px 100px;}
.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-title{font-size:21px; font-weight:900;}
.page-sub{font-size:12.5px; color:var(--gray); margin-top:4px;}
.add-btn{display:flex; align-items:center; gap:8px; background:var(--pink); color:#fff; border:none; padding:11px 20px; border-radius:999px; font-weight:700; font-size:13.5px; box-shadow:var(--shadow-sm); transition:transform .15s,box-shadow .15s;}
.add-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-md);}
.add-btn.ghost{background:#fff; color:var(--pink); border:1.5px solid var(--soft-pink);}
.add-btn .icon{width:15px; height:15px;}

/* reminder banner */
.reminder{display:flex; align-items:center; gap:12px; background:var(--light-pink); border:1px solid var(--soft-pink); border-radius:var(--radius-md); padding:13px 16px; margin-bottom:18px; font-size:13px; color:#8A5B50; font-weight:600;}
.reminder .icon{width:17px; height:17px; flex-shrink:0;}

/* dashboard progress cards */
.progress-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px;}
.progress-card{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:10px;}
.progress-top{display:flex; align-items:center; justify-content:space-between;}
.progress-icon{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
.progress-icon .icon{width:17px; height:17px;}
.progress-status{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;}
.progress-status.done{background:var(--light-sage); color:#5F7560;}
.progress-status.pending{background:var(--light-pink); color:var(--pink);}
.progress-num{font-size:24px; font-weight:900;}
.progress-label{font-size:12.5px; color:var(--gray); font-weight:500;}
.progress-bar-track{height:6px; background:var(--cream); border-radius:99px; overflow:hidden;}
.progress-bar-fill{height:100%; border-radius:99px; transition:width .4s ease;}

.section-head{display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px;}
.section-head h2{font-size:14.5px; font-weight:900;}
.section-head a{font-size:12px; color:var(--pink); font-weight:700; background:none; border:none;}

.todo-list{display:flex; flex-direction:column; gap:9px;}
.todo-row{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:13px 15px; box-shadow:var(--shadow-sm);}
.todo-tag{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.todo-tag .icon{width:15px; height:15px;}
.todo-info{flex:1; min-width:0;}
.todo-info .name{font-size:13.5px; font-weight:700;}
.todo-info .meta{font-size:11.5px; color:var(--gray); margin-top:2px;}
.mini-btn{font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid #EFE9E2; background:#fff; color:var(--medium);}
.mini-btn:hover{background:var(--light-sage); color:#5F7560; border-color:#D3E4D3;}
.empty-hint{padding:30px 16px; text-align:center; color:var(--gray); font-size:13px; line-height:1.8;}

/* inspiration page */
.insp-card{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm); margin-bottom:20px;}
.insp-label{font-size:12.5px; font-weight:700; color:var(--medium); margin-bottom:8px; display:block;}
.insp-input{width:100%; border:1px solid #E7E0D8; border-radius:var(--radius-sm); padding:13px 15px; font-size:14.5px; background:var(--bg); outline:none; min-height:64px; resize:vertical; line-height:1.6;}
.insp-input:focus{border-color:var(--soft-pink); background:#fff;}
.insp-row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
.insp-select{background:#fff; border:1px solid #EAE3DB; border-radius:999px; padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--medium);}
.insp-gen-btn{margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--pink); color:#fff; border:none; padding:11px 22px; border-radius:999px; font-weight:700; font-size:13.5px;}
.insp-gen-btn .icon{width:15px; height:15px;}
.insp-warn{display:flex; align-items:center; gap:8px; font-size:12px; color:#B65C4F; background:#F7E4E1; border-radius:var(--radius-sm); padding:9px 12px; margin-top:12px;}
.insp-warn .icon{width:14px; height:14px; flex-shrink:0;}

.variant-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:900px){.variant-grid{grid-template-columns:1fr;}}
.variant-card{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:10px;}
.variant-head{display:flex; align-items:center; justify-content:space-between;}
.variant-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
.variant-title .icon{width:15px; height:15px; color:var(--pink);}
.copy-btn{display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid #EFE9E2; background:#fff; color:var(--medium);}
.copy-btn:hover{background:var(--light-pink); color:var(--pink); border-color:var(--soft-pink);}
.copy-btn .icon{width:13px; height:13px;}
.variant-text{white-space:pre-wrap; font-size:12.8px; line-height:1.75; color:var(--medium); background:var(--bg); border-radius:var(--radius-sm); padding:12px 13px; max-height:260px; overflow-y:auto;}
.insp-save-row{display:flex; justify-content:flex-end; margin-top:16px;}

/* list / filter */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.search-box{flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #EAE3DB; border-radius:999px; padding:10px 16px;}
.search-box .icon{width:15px; height:15px; color:var(--gray);}
.search-box input{border:none; outline:none; background:none; flex:1; font-size:13.5px;}
.select-pill{background:#fff; border:1px solid #EAE3DB; border-radius:999px; padding:10px 14px; font-size:13px; font-weight:500; color:var(--medium); outline:none;}

.data-list{display:flex; flex-direction:column; gap:10px;}
.data-card{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm);}
.data-top{display:flex; align-items:center; gap:12px;}
.data-tag{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.data-tag .icon{width:17px; height:17px;}
.data-body{flex:1; min-width:0; cursor:pointer;}
.data-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.data-name{font-size:13.8px; font-weight:700;}
.data-cat{font-size:10.5px; color:var(--gray); background:var(--cream); padding:2px 8px; border-radius:999px;}
.data-meta{font-size:11.5px; color:var(--gray); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;}
.status-chip{font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; flex-shrink:0;}
.status-draft{background:var(--light-pink); color:var(--pink);}
.status-posted{background:var(--light-sage); color:#5F7560;}
.data-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.icon-btn{width:32px; height:32px; border-radius:9px; border:1px solid #EFE9E2; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--medium);}
.icon-btn:hover{background:var(--light-pink); color:var(--pink); border-color:var(--soft-pink);}
.icon-btn.danger:hover{background:#F7E4E1; color:#B65C4F; border-color:#EFC7C0;}
.icon-btn .icon{width:14px; height:14px;}
.data-copies{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

/* weekly rhythm */
.week-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;}
@media(max-width:860px){.week-grid{grid-template-columns:repeat(1,1fr);}}
.week-day{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow-sm); min-height:150px; display:flex; flex-direction:column; gap:8px;}
.week-day.is-today{border-color:var(--soft-pink); background:var(--light-pink);}
.week-day-head{font-size:12.5px; font-weight:800; color:var(--medium);}
.week-day-date{font-size:10.5px; color:var(--gray); margin-bottom:4px;}
.week-item{display:flex; align-items:center; gap:6px; font-size:11px; padding:6px 8px; border-radius:8px; background:var(--bg);}
.week-item .icon{width:12px; height:12px;}

/* formula page */
.formula-steps{display:flex; flex-direction:column; gap:10px;}
.formula-step{display:flex; gap:14px; background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:15px 17px; box-shadow:var(--shadow-sm);}
.formula-num{width:30px; height:30px; border-radius:9px; background:var(--light-pink); color:var(--pink); font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.formula-step b{font-size:13.5px; display:block; margin-bottom:3px;}
.formula-step span{font-size:12px; color:var(--gray); line-height:1.6;}
.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.tag-pill{background:var(--light-pink); color:var(--pink); font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; display:flex; align-items:center; gap:6px;}
.tag-pill button{background:none; border:none; color:var(--pink); display:flex;}
.tag-pill button .icon{width:11px; height:11px;}
.add-tag-row{display:flex; gap:8px; margin-top:10px;}
.add-tag-row input{flex:1; border:1px solid #E7E0D8; border-radius:var(--radius-sm); padding:9px 12px; font-size:12.5px; background:var(--bg);}
.add-tag-row button{background:var(--pink); color:#fff; border:none; padding:9px 16px; border-radius:var(--radius-sm); font-size:12.5px; font-weight:700;}
.persona-edit{width:100%; border:1px solid #E7E0D8; border-radius:var(--radius-sm); padding:11px 13px; font-size:12.8px; background:var(--bg); margin-bottom:8px; line-height:1.6;}
.card-block{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); margin-bottom:16px;}
.card-block h3{font-size:13.5px; font-weight:900; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.card-block h3 .icon{width:15px; height:15px; color:var(--pink);}
.settings-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #F5F1EC;}
.settings-row:last-child{border-bottom:none;}
.settings-row span{font-size:13px; color:var(--medium);}
.settings-row input[type=number]{width:64px; border:1px solid #E7E0D8; border-radius:8px; padding:7px 10px; font-size:13px; text-align:center; background:var(--bg);}

/* product page */
.product-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media(max-width:768px){.product-grid{grid-template-columns:1fr;}}
.product-card{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:8px;}
.product-tier{font-size:11px; font-weight:700; color:var(--pink); background:var(--light-pink); padding:3px 10px; border-radius:999px; width:fit-content;}
.product-name{font-size:15px; font-weight:900;}
.product-price{font-size:19px; font-weight:900; color:var(--blue);}
.product-desc{font-size:12px; color:var(--gray); line-height:1.6;}

/* funnel page */
.funnel-flow{display:flex; flex-direction:column; gap:0;}
.funnel-step{display:flex; gap:14px; align-items:flex-start;}
.funnel-marker{display:flex; flex-direction:column; align-items:center; flex-shrink:0;}
.funnel-dot{width:36px; height:36px; border-radius:50%; background:var(--light-blue); color:var(--blue); display:flex; align-items:center; justify-content:center;}
.funnel-dot .icon{width:16px; height:16px;}
.funnel-line{width:2px; flex:1; background:#EAE3DB; min-height:26px;}
.funnel-body{background:#fff; border:1px solid #F1ECE6; border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm); margin-bottom:18px; flex:1;}
.funnel-body b{font-size:13.5px; display:block; margin-bottom:3px;}
.funnel-body span{font-size:12px; color:var(--gray); line-height:1.6;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(55,53,47,0.42); display:none; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(2px);}
.overlay.open{display:flex;}
.modal{background:#fff; width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:22px 22px 28px; max-height:92vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:slideUp .22s ease;}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
@media(min-width:640px){.overlay{align-items:center;} .modal{border-radius:var(--radius-lg); margin:20px;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-size:16px; font-weight:900;}
.modal-close{width:30px; height:30px; border-radius:9px; border:none; background:var(--cream); display:flex; align-items:center; justify-content:center; color:var(--medium);}
.modal-close .icon{width:15px; height:15px;}
.field{margin-bottom:15px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--medium); margin-bottom:7px;}
.field-hint{font-size:11px; color:var(--gray); margin-top:6px; line-height:1.5;}
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{width:100%; border:1px solid #E7E0D8; border-radius:var(--radius-sm); padding:11px 13px; font-size:13.5px; outline:none; background:var(--bg);}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--soft-pink); background:#fff;}
.field textarea{resize:vertical; min-height:64px; line-height:1.6;}
.type-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.type-pick{display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; border-radius:var(--radius-sm); border:1.5px solid #EFE9E2; background:#fff; font-size:12px; font-weight:700; color:var(--medium);}
.type-pick .icon{width:17px; height:17px;}
.type-pick.active{border-color:var(--pink); background:var(--light-pink); color:var(--pink);}
.status-toggle{display:flex; gap:8px;}
.status-opt{flex:1; padding:11px; border-radius:var(--radius-sm); border:1.5px solid #EFE9E2; background:#fff; font-size:13px; font-weight:700; color:var(--medium); display:flex; align-items:center; justify-content:center; gap:6px;}
.status-opt.active.draft{border-color:var(--pink); background:var(--light-pink); color:var(--pink);}
.status-opt.active.posted{border-color:var(--sage); background:var(--light-sage); color:#5F7560;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.btn-primary{flex:1; background:var(--pink); color:#fff; border:none; padding:13px; border-radius:999px; font-weight:700; font-size:14px;}
.btn-ghost{padding:13px 18px; background:var(--cream); color:var(--medium); border:none; border-radius:999px; font-weight:700; font-size:14px;}
.btn-ghost.delete{color:#B65C4F;}
.cta-inline{display:flex; gap:8px;}
.cta-inline select{flex:1;}
.cta-inline button{background:var(--cream); border:none; border-radius:var(--radius-sm); padding:0 14px; font-size:12px; font-weight:700; color:var(--pink); white-space:nowrap;}

.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--dark); color:#fff; padding:12px 22px; border-radius:999px; font-size:13px; font-weight:600; z-index:80; transition:all .25s ease; pointer-events:none; box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.bottom-nav{display:none;}
@media(max-width:860px){.progress-grid{grid-template-columns:repeat(1,1fr);} .product-grid{grid-template-columns:1fr;}}
@media(max-width:768px){
  .sidebar{display:none;}
  .main{padding:18px 15px 96px;}
  .bottom-nav{display:flex; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #EEEAE4; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:40; box-shadow:0 -4px 16px rgba(55,53,47,0.05);}
  .bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--gray); font-size:10px; font-weight:600; padding:6px 2px; border-radius:12px;}
  .bn-item.active{color:var(--pink);}
  .bn-item .icon{width:18px; height:18px;}
  .variant-grid{grid-template-columns:1fr;}
}
.more-sheet-list{display:flex; flex-direction:column; gap:8px;}
.more-sheet-item{display:flex; align-items:center; gap:12px; background:var(--bg); border:1px solid #F1ECE6; border-radius:var(--radius-sm); padding:13px 15px; font-size:13.5px; font-weight:700; color:var(--medium);}
.more-sheet-item .icon{width:16px; height:16px; color:var(--pink);}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandIcon"></div>
      <div class="brand-text"><b>每日文案工作台</b><span>@lovetalker_tw</span></div>
    </div>
    <div class="nav-group-label">每日</div>
    <button class="nav-item" data-view="today"><span class="icon" data-icon="sun"></span>今日文案</button>
    <button class="nav-item" data-view="inspire"><span class="icon" data-icon="zap"></span>丟一句靈感</button>

function loadJSON(key, fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback(); }catch(e){ return fallback(); } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function iso(d){ return d.toISOString().slice(0,10); }

/* ===================== Helpers ===================== */
function todayISO(){ return iso(new Date()); }
function fmtDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return `${m}/${day}`; }
function startOfWeek(){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-dow); return d; }
function isThisWeek(dstr){ if(!dstr) return false; const d=new Date(dstr+'T00:00:00'); const s=startOfWeek(); const e=new Date(s); e.setDate(e.getDate()+6); return d>=s && d<=e; }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function copyText(text){
  navigator.clipboard?.writeText(text).then(()=>showToast('已複製')).catch(()=>fallbackCopy(text));
  if(!navigator.clipboard) fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('已複製'); }catch(e){} document.body.removeChild(ta);
}

/* ===================== Generator (rule-based skeleton) ===================== */
function checkBanned(text){
  return settings.bannedWords.filter(w=> text.includes(w));
}
function pickPersona(){
  const lines = settings.personaLines.filter(Boolean);
  if(!lines.length) return '';
  return lines[Math.floor(Math.random()*lines.length)];
}
function generateDrafts(inspiration, cta){
  const persona = pickPersona();
  const ctaLine = cta ? `留言「${cta}」，我幫妳看懂這件事。` : `留言關鍵字，我幫妳看懂這件事。`;
  const long =
`【衝突開頭】
${inspiration}

【畫面感細節】
〔補上當下的場景、對話、感受——越具體越好〕

【爆點】
〔這件事最讓妳意外或扎心的轉折點〕

【轉折領悟】
〔從這件事看懂的關係眼真相〕

${persona}

${ctaLine}
—妳的情感讀心師，笑笑`;

  const short =
`${inspiration}
〔一句最扎心的領悟〕
${ctaLine}`;

  const reel =
`[0-5秒 Hook] ${inspiration}
[5-25秒 畫面鋪陳] 〔描述場景、對話，前置高潮〕
[25-45秒 爆點] 〔關鍵轉折〕
[45-65秒 領悟] 〔關係眼判斷〕
[65-75秒 收尾＋CTA] ${ctaLine}
（自然收尾時才講「—妳的情感讀心師，笑笑」）
B-roll checklist：〔畫面1〕〔畫面2〕〔畫面3〕`;
  const story =
`${inspiration}
${cta ? `留言／點擊「${cta}」告訴我 👀` : '留言告訴我 👀'}`;

  return {long, short, reel, story};
}

function buildSystemPrompt(){
  return `你是「@lovetalker_tw 情感讀心師」的專屬文案寫手，品牌系統叫「關係眼」。

【公式A六段結構，依序寫】衝突開頭、畫面感細節鋪陳、爆點、轉折領悟、收尾笑點、CTA。通則：前置高潮——最有張力的畫面往前放。

【語氣規則，務必遵守】
- Hook（開頭第一句）要在10個字以內，直接點出對象的痛點，不要用「妳有沒有…」這種句型
- 全文絕對不要出現這些字詞：${settings.bannedWords.join('、')||'（無）'}
- 「—妳的情感讀心師，笑笑」這句簽名只能在自然收尾處出現一次，不要每段都放
- 口播 Reels 逐字稿要抓 75-80 秒的字數（講出來大約 60-65 秒），並在最後附上 B-roll 畫面清單
- 可以自然帶入以下其中一句人設句（挑最適合的一句，不必照抄全部）：${settings.personaLines.join(' ／ ')||'（無）'}
- 語氣：溫柔但直接，像一個看穿真相但不說教的朋友，避免長句分析、避免說教感

【輸出格式，非常重要】
只回傳一個 JSON 物件，不要加任何說明文字、不要用 markdown code block 包起來。格式必須是：
{"long":"輪播貼文長文全文","short":"短文／限動短文全文","reel":"口播Reels逐字稿全文（含時間標記與B-roll清單）","story":"限時動態文字全文"}
四個欄位都要是完整可以直接發佈的繁體中文文案，不要留空白佔位符或〔〕之類的提示語。`;
}
async function callClaudeAPI(inspiration, cta){
  const userMsg = `靈感句：${inspiration}\nCTA關鍵字：${cta ? `「${cta}」` : '（未指定，請用通用的留言引導語）'}\n請依照系統規則，生成這篇內容的四個版本，只回傳 JSON。`;
  let resp;
  try{
    resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': aiConfig.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model: aiConfig.model || 'claude-sonnet-5',
        max_tokens: 3500,
        system: buildSystemPrompt(),
        messages: [{role:'user', content: userMsg}]
      })
    });
  }catch(networkErr){
    throw new Error('連不上 API（網路問題或瀏覽器安全限制擋下了這個請求）。請確認：1) 電腦有連網 2) 這個檔案是用瀏覽器「開啟檔案」方式打開，不是從壓縮檔或某些雲端硬碟預覽模式直接開的。原始錯誤：'+networkErr.message);
  }
  if(!resp.ok){
    const errBody = await resp.text().catch(()=> '');
    let hint = '';
    if(/credit balance/i.test(errBody)) hint = '帳號額度不足，去 platform.claude.com 的 Plans & Billing 加值。';
    else if(/model/i.test(errBody) && resp.status===400) hint = '模型名稱有問題，去「文案公式」檢查模型名稱欄位。';
    else if(resp.status===401) hint = '金鑰不對或已過期，去 platform.claude.com 確認／重新建立一把。';
    else if(resp.status===400) hint = '請求格式有問題，請重試一次；若持續發生請回報這則錯誤訊息。';
    else if(resp.status===429) hint = '這把金鑰的用量額度用完了或超過速率限制，去 platform.claude.com 檢查額度。';
    else if(resp.status===403) hint = '這把金鑰沒有權限呼叫這個模型，或帳號還沒設定付款方式。';
    throw new Error(`API 錯誤 (${resp.status})${hint?'：'+hint:''} ${errBody.slice(0,300)}`);
  }
  const data = await resp.json();
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('API 沒有回傳文字內容');
  const wasTruncated = data.stop_reason === 'max_tokens';
  let clean = textBlock.text.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e1){
    // fall back: try to pull out the outermost {...} block in case there's stray text around it
    const match = clean.match(/\{[\s\S]*\}/);
    if(match){
      try{ parsed = JSON.parse(match[0]); }catch(e2){ parsed = null; }
    }
  }
  if(!parsed){
    const preview = clean.slice(0, 220);
    const truncNote = wasTruncated ? '（AI 的回覆被長度上限截斷了，已經調高上限，請重試一次）' : '';
    throw new Error(`AI 回傳的內容不是有效的 JSON，請重試一次。${truncNote}原始內容片段：${preview}`);
  }
  return {
    long: parsed.long||'', short: parsed.short||'', reel: parsed.reel||'', story: parsed.story||''
  };
}
async function generateSmart(inspiration, cta){
  if(aiConfig.useAI && aiConfig.apiKey){
    try{
      const drafts = await callClaudeAPI(inspiration, cta);
      return { drafts, mode:'ai' };
    }catch(err){
      showToast('AI 生成失敗，已改用骨架版');
      return { drafts: generateDrafts(inspiration, cta), mode:'fallback', error: err.message };
    }
  }
  return { drafts: generateDrafts(inspiration, cta), mode:'skeleton' };
}

function renderToday(){
  const today = todayISO();
  const storyPosted = records.filter(r=>r.type==='story' && r.date===today && r.status==='posted').length;
  const reelPosted = records.filter(r=>r.type==='reel' && isThisWeek(r.date) && r.status==='posted').length;
  const carouselPosted = records.filter(r=>r.type==='carousel' && isThisWeek(r.date) && r.status==='posted').length;

  const cards = [
    {key:'story', label:'本日限時動態', done:storyPosted, target:settings.storyTarget, tone:'pink', icon:'sun'},
    {key:'reel', label:'本週影片', done:reelPosted, target:settings.reelTarget, tone:'blue', icon:'film'},
    {key:'carousel', label:'本週輪播貼文', done:carouselPosted, target:settings.carouselTarget, tone:'sage', icon:'layers'},
  ];

  const behind = cards.filter(c=>c.done < c.target);
  const reminder = behind.length
    ? `${behind.map(c=>`${c.label}還差 ${c.target-c.done} 則`).join('、')} — 別忘了安排時間拍／寫`
    : null;

  return `
    <div class="topbar">

    <div class="progress-grid">
      ${cards.map(c=>{
        const pct = c.target ? Math.min(100, Math.round((c.done/c.target)*100)) : 0;
        const done = c.done >= c.target;
        return `
        <div class="progress-card">
          <div class="progress-top">
            <div class="progress-icon" style="${tagStyle(c.tone)}">${svg(c.icon)}</div>
            <div class="progress-status ${done?'done':'pending'}">${done?'已完成':'未完成'}</div>
          </div>
          <div class="progress-num">${c.done} / ${c.target}</div>
          <div class="progress-label">${c.label}</div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%; background:${TONE[c.tone].fg};"></div></div>
        </div>`;
      }).join('')}
    </div>

    <div class="section-head"><h2>待完成清單</h2><a data-goto="list">查看全部素材 →</a></div>
    <div class="todo-list">
      ${todo.length ? todo.map(r=>{
        const t = typeInfo(r.type);
        return `
        <div class="todo-row">
          <div class="todo-tag" style="${tagStyle(t.tone)}">${svg(t.icon)}</div>
          <div class="todo-info" data-edit="${r.id}"><div class="name">${escapeHtml(r.name)}</div><div class="meta">${t.label} · ${fmtDate(r.date)} ${r.cta?`· CTA #${r.cta}`:''}</div></div>
          <button class="mini-btn" data-toggle="${r.id}">標記已發佈</button>
        </div>`;
      }).join('') : `<div class="empty-hint">這週待完成的草稿都清空了，去「丟一句靈感」補幾篇新素材吧</div>`}
    </div>
  `;
}

/* ---------- Weekly rhythm ---------- */
function renderWeek(){
  const s = startOfWeek();
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(d.getDate()+i); days.push(d); }
  const labels = ['一','二','三','四','五','六','日'];
  const today = todayISO();

  const reelCount = records.filter(r=>r.type==='reel' && isThisWeek(r.date) && r.status==='posted').length;
  const carouselCount = records.filter(r=>r.type==='carousel' && isThisWeek(r.date) && r.status==='posted').length;

  return `
    <div class="topbar">
      <div><div class="page-title">每週節奏</div><div class="page-sub">本週影片 ${reelCount}/${settings.reelTarget} · 本週輪播 ${carouselCount}/${settings.carouselTarget}</div></div>
      <button class="add-btn ghost" data-goto="formula">${svg('settings')}調整目標</button>
    </div>
    <div class="week-grid">
      ${days.map(d=>{
        const dstr = iso(d);
        const items = records.filter(r=>r.date===dstr).sort((a,b)=>a.createdAt-b.createdAt);
        const isToday = dstr===today;
        return `
        <div class="week-day ${isToday?'is-today':''}">
          <div class="week-day-head">週${labels[(d.getDay()+6)%7]}</div>
          <div class="week-day-date">${dstr.slice(5).replace('-','/')}</div>
          ${items.length ? items.map(r=>{
            const t=typeInfo(r.type);
            return `<div class="week-item" data-edit="${r.id}" style="${tagStyle(t.tone)}">${svg(t.icon)}${escapeHtml(r.name)}</div>`;
          }).join('') : `<div style="font-size:11px; color:var(--gray);">尚無安排</div>`}
        </div>`;
      }).join('')}
    </div>
  `;
}

/* ===================== Dynamic events ===================== */
function bindDynamicEvents(){
  const main = document.getElementById('mainView');

  main.querySelectorAll('[data-goto]').forEach(el=> el.addEventListener('click', ()=> setView(el.dataset.goto)));

  const openAdd = main.querySelector('#openAddTop');
  if(openAdd) openAdd.addEventListener('click', ()=> openForm());

  main.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-toggle]')) return;
      openForm(el.dataset.edit);
    });
  });
  main.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const r = records.find(x=>x.id===el.dataset.toggle);
      if(!r) return;
      r.status='posted'; save(K_RECORDS, records); showToast('已標記為已發佈'); render();
    });
  });
  main.querySelectorAll('[data-delete]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm('確定要刪除這筆素材嗎？')){ records = records.filter(x=>x.id!==el.dataset.delete); save(K_RECORDS, records); showToast('已刪除'); render(); }
    });
  });
  main.querySelectorAll('[data-copy-field]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [id,field] = el.dataset.copyField.split(':');
      const r = records.find(x=>x.id===id);
      if(r) copyText(r[field]||'');
    });
  });

  // list filters
  const searchInput = main.querySelector('#searchInput');
  if(searchInput) searchInput.addEventListener('input', ()=>{ state.search=searchInput.value; renderKeepFocus('searchInput'); });
  const filterType = main.querySelector('#filterType');
  if(filterType) filterType.addEventListener('change', ()=>{ state.filterType=filterType.value; render(); });
  const filterStatus = main.querySelector('#filterStatus');
  if(filterStatus) filterStatus.addEventListener('change', ()=>{ state.filterStatus=filterStatus.value; render(); });

  // inspire page
  const inspInput = main.querySelector('#inspInput');
  if(inspInput) inspInput.addEventListener('input', ()=>{ state.inspDraft = inspInput.value; });
  const inspGenerate = main.querySelector('#inspGenerate');
  if(inspGenerate) inspGenerate.addEventListener('click', async ()=>{
    const text = (main.querySelector('#inspInput').value||'').trim();
    if(!text){ showToast('先輸入一句靈感'); return; }
    const cta = main.querySelector('#inspCta').value;
    inspGenerate.disabled = true;
    inspGenerate.textContent = '生成中…';
    try{
      const result = await generateSmart(text, cta);
      const combined = [result.drafts.long, result.drafts.short, result.drafts.reel, result.drafts.story].join('\n');
      const banned = checkBanned(combined);
      state.lastGen = {inspiration:text, cta, drafts:result.drafts, banned, mode:result.mode, error:result.error};
      render();
    } finally {
      // render() rebuilds the button; nothing else to reset here
    }
  });
  const quickSaveKey = main.querySelector('#quickSaveKey');
  if(quickSaveKey) quickSaveKey.addEventListener('click', ()=>{
    const key = (main.querySelector('#quickApiKey').value||'').trim();
    if(!key){ showToast('請貼上 API 金鑰'); return; }
    aiConfig.apiKey = key; aiConfig.useAI = true;
    save(K_APIKEY, aiConfig);
    showToast('已開啟 AI 生成');
    render();
  });
  const inspUseNext = main.querySelector('#inspUseNext');
  if(inspUseNext) inspUseNext.addEventListener('click', ()=>{
    const w = nextUnusedCtaWord();
    const sel = main.querySelector('#inspCta');
    if(sel && w) sel.value = w;
  });
  main.querySelectorAll('[data-copy-variant]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.copyVariant;
      if(state.lastGen) copyText(state.lastGen.drafts[key]||'');
    });
  });
  const copyErrorBtn = main.querySelector('[data-copy-error]');
  if(copyErrorBtn) copyErrorBtn.addEventListener('click', ()=>{
    if(state.lastGen && state.lastGen.error) copyText(state.lastGen.error);
  });
  const btnSaveGen = main.querySelector('#btnSaveGen');
  if(btnSaveGen) btnSaveGen.addEventListener('click', ()=>{
    const g = state.lastGen; if(!g) return;
    records.push({
      id:uid(), type:'carousel', name:g.inspiration.slice(0,16), date:todayISO(), cta:g.cta,
      inspiration:g.inspiration, long:g.drafts.long, short:g.drafts.short, reel:g.drafts.reel, story:g.drafts.story,
      status:'draft', note:'', createdAt:Date.now()
    });
    save(K_RECORDS, records);
    showToast('已存成一筆素材，可以到「全部素材」編輯類型與名稱');
  });

  // weekly rhythm goto formula settings already handled by data-goto

  // formula page
  renderCtaTags(main);
  renderBannedTags(main);
  const btnAddCta = main.querySelector('#btnAddCta');
  if(btnAddCta) btnAddCta.addEventListener('click', ()=>{
    const input = main.querySelector('#newCtaWord');
    const word = input.value.trim();
    if(!word){ showToast('請輸入關鍵字'); return; }
    settings.ctaList.push({num:settings.nextCta, word});
    settings.nextCta += 1;
    save(K_SETTINGS, settings);
    input.value='';
    render();
    showToast('已新增 CTA 關鍵字');
  });
  const btnAddBanned = main.querySelector('#btnAddBanned');
  if(btnAddBanned) btnAddBanned.addEventListener('click', ()=>{
    const input = main.querySelector('#newBannedWord');
    const word = input.value.trim();
    if(!word) return;
    if(!settings.bannedWords.includes(word)) settings.bannedWords.push(word);
    save(K_SETTINGS, settings); input.value=''; render();
  });
  const btnSavePersona = main.querySelector('#btnSavePersona');
  if(btnSavePersona) btnSavePersona.addEventListener('click', ()=>{
    const areas = main.querySelectorAll('[data-persona-idx]');
    settings.personaLines = Array.from(areas).map(a=>a.value.trim()).filter(Boolean);
    save(K_SETTINGS, settings); showToast('已儲存人設句');
  });
  const btnSaveTargets = main.querySelector('#btnSaveTargets');
  if(btnSaveTargets) btnSaveTargets.addEventListener('click', ()=>{
    settings.storyTarget = Number(main.querySelector('#setStoryTarget').value)||0;
    settings.reelTarget = Number(main.querySelector('#setReelTarget').value)||0;
    settings.carouselTarget = Number(main.querySelector('#setCarouselTarget').value)||0;
    save(K_SETTINGS, settings); showToast('已儲存目標');
  });
  const btnSaveAiConfig = main.querySelector('#btnSaveAiConfig');
  if(btnSaveAiConfig) btnSaveAiConfig.addEventListener('click', ()=>{
    aiConfig.apiKey = main.querySelector('#setApiKey').value.trim();
    aiConfig.model = main.querySelector('#setApiModel').value.trim() || 'claude-sonnet-5';
    aiConfig.useAI = main.querySelector('#setUseAI').checked;
    save(K_APIKEY, aiConfig);
    showToast('已儲存 AI 設定');
    render();
  });

  // product
  main.querySelectorAll('[data-edit-product]').forEach(el=>{
    el.addEventListener('click', ()=> openProductForm(el.dataset.editProduct));
  });

  // consult
  const openConsultAdd = main.querySelector('#openConsultAdd');
  if(openConsultAdd) openConsultAdd.addEventListener('click', ()=> openConsultForm());
  main.querySelectorAll('[data-edit-consult]').forEach(el=>{
    el.addEventListener('click', ()=> openConsultForm(el.dataset.editConsult));
  });
}
function renderKeepFocus(id){ render(); const el=document.getElementById(id); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } }

function nextUnusedCtaWord(){
  const used = new Set(records.map(r=>r.cta).filter(Boolean));
  const found = settings.ctaList.find(c=>!used.has(c.word));
  return found ? found.word : (settings.ctaList[0]?.word || '');
}
function renderCtaTags(main){
  const el = main.querySelector('#ctaTagList'); if(!el) return;
  el.innerHTML = settings.ctaList.map((c,i)=>`<span class="tag-pill">#${c.num} ${escapeHtml(c.word)}<button data-remove-cta="${i}">${svg('x')}</button></span>`).join('') || '<span style="font-size:12px; color:var(--gray);">還沒有 CTA 關鍵字</span>';
  el.querySelectorAll('[data-remove-cta]').forEach(b=>{
    b.addEventListener('click', ()=>{ settings.ctaList.splice(Number(b.dataset.removeCta),1); save(K_SETTINGS, settings); render(); });
  });
}
function renderBannedTags(main){
  const el = main.querySelector('#bannedTagList'); if(!el) return;
  el.innerHTML = settings.bannedWords.map((w,i)=>`<span class="tag-pill">${escapeHtml(w)}<button data-remove-banned="${i}">${svg('x')}</button></span>`).join('');
  el.querySelectorAll('[data-remove-banned]').forEach(b=>{
    b.addEventListener('click', ()=>{ settings.bannedWords.splice(Number(b.dataset.removeBanned),1); save(K_SETTINGS, settings); render(); });
  });
}

function exportBackup(){
  const payload = {exportedAt:new Date().toISOString(), records, settings, consults, products};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `文案工作台備份_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('已匯出備份檔');
}
document.getElementById('btnExport').addEventListener('click', exportBackup);
document.getElementById('btnExport2').addEventListener('click', exportBackup);
const importInput = document.getElementById('importFile');
function triggerImport(){ importInput.click(); }
document.getElementById('btnImport').addEventListener('click', triggerImport);
document.getElementById('btnImport2').addEventListener('click', triggerImport);
importInput.addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const replace = confirm('要用備份檔「取代」目前所有資料嗎？\n按「取消」則改為合併。');
      if(replace){
        records = data.records || records;
        settings = data.settings || settings;
        consults = data.consults || consults;
        products = data.products || products;
      } else {
        if(Array.isArray(data.records)){ const ids=new Set(records.map(r=>r.id)); data.records.forEach(r=>{ if(!ids.has(r.id)) records.push(r); }); }
        if(Array.isArray(data.consults)){ const ids=new Set(consults.map(r=>r.id)); data.consults.forEach(r=>{ if(!ids.has(r.id)) consults.push(r); }); }
      }
      save(K_RECORDS, records); save(K_SETTINGS, settings); save(K_CONSULT, consults); save(K_PRODUCT, products);
      showToast('匯入完成'); render();
    }catch(err){ alert('匯入失敗，請確認這是本工具匯出的備份檔（JSON 格式）。'); }
    importInput.value='';
  };
  reader.readAsText(file);
});

/* ===================== More sheet (mobile) ===================== */
const moreOverlay = document.getElementById('moreOverlay');
document.getElementById('bnMore').addEventListener('click', ()=> moreOverlay.classList.add('open'));
document.getElementById('closeMore').addEventListener('click', ()=> moreOverlay.classList.remove('open'));
moreOverlay.addEventListener('click', (e)=>{ if(e.target===moreOverlay) moreOverlay.classList.remove('open'); });
moreOverlay.querySelectorAll('[data-goto]').forEach(el=>{
  el.addEventListener('click', ()=>{ moreOverlay.classList.remove('open'); setView(el.dataset.goto); });
});

/* ===================== Init ===================== */
save(K_RECORDS, records); save(K_SETTINGS, settings); save(K_CONSULT, consults); save(K_PRODUCT, products);
setView('today');
</script>
</body>
