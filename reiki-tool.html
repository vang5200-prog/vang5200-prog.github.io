<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<title>靈氣法工具</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --white:#fff; --line:#E8E4DF; --danger:#A65D59; --shadow:0 8px 28px rgba(55,53,47,.07);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{line-height:1.7}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.app{width:min(100%,960px);margin:auto;padding:18px 16px 44px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:18px;letter-spacing:.04em}
.brand-sub{font-size:12px;color:var(--gray)}
.icon-btn,.ghost-btn,.primary-btn,.danger-btn{border:0;border-radius:12px;padding:10px 14px;transition:.18s ease}
.icon-btn,.ghost-btn{background:var(--white);border:1px solid var(--line);color:var(--medium)}
.primary-btn{background:var(--pink);color:#fff;font-weight:700}
.primary-btn:hover{filter:brightness(.97)}
.ghost-btn:hover,.icon-btn:hover{background:var(--cream)}
.danger-btn{background:#F7E8E7;color:var(--danger);border:1px solid #EBC8C5}
.search-wrap{position:relative;margin:4px 0 24px}
.search-wrap input{width:100%;height:56px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:0 18px 0 50px;outline:none;box-shadow:var(--shadow);font-size:16px}
.search-wrap input:focus{border-color:var(--soft-pink);box-shadow:0 0 0 4px var(--light-pink)}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:20px}
.page-title{margin:0 0 5px;font-size:26px;line-height:1.35}
.page-desc{margin:0 0 22px;color:var(--gray);font-size:14px}
.dashboard-actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}
.section-title{font-size:16px;font-weight:700;margin:0}
.count{font-size:12px;color:var(--gray)}
.reiki-list{display:grid;gap:10px}
.reiki-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 17px;text-align:left;width:100%;box-shadow:0 3px 12px rgba(55,53,47,.035)}
.reiki-card:hover{border-color:var(--soft-pink);transform:translateY(-1px)}
.reiki-name{font-weight:700;font-size:16px;word-break:break-word}
.reiki-meta{font-size:12px;color:var(--gray);margin-top:2px}
.chevron{color:var(--gray);font-size:22px}
.empty{padding:40px 18px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:18px;color:var(--gray)}
.empty strong{display:block;color:var(--medium);margin-bottom:6px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--medium);padding:8px 0;font-weight:700}
.detail-title{text-align:center;margin:12px 0 28px}
.detail-title .eyebrow{font-size:13px;color:var(--gray);margin-bottom:4px}
.detail-title h1{margin:0;font-size:28px;line-height:1.35}
.read-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px 18px;margin:12px 0;box-shadow:0 4px 16px rgba(55,53,47,.04)}
.step-label{font-size:13px;font-weight:700;color:var(--pink);margin-bottom:7px}
.step-content{white-space:pre-wrap;word-break:break-word}
.step-content.empty-text{color:var(--gray)}
.symbol-row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.symbol-item{min-width:112px;text-align:center}
.symbol-image{width:112px;height:112px;border-radius:12px;object-fit:contain;background:var(--cream);border:1px solid var(--line);display:block}
.symbol-name{font-size:13px;font-weight:700;margin-top:6px;word-break:break-word}
.repeat{margin-top:10px;font-weight:700;color:var(--medium);text-align:right}
.notes{background:var(--light-sage)}
.editor-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
label{display:block;font-size:13px;font-weight:700;color:var(--medium);margin:0 0 7px}
.field{margin-bottom:16px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;outline:none;color:var(--dark)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--soft-pink);box-shadow:0 0 0 3px var(--light-pink)}
.fixed-label{font-size:12px;color:var(--gray);margin-bottom:6px}
.steps-editor{display:grid;gap:10px}
.step-editor{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.step-editor.dragging{opacity:.45;box-shadow:0 10px 30px rgba(55,53,47,.12)}
.step-editor-head{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#FCFAF8;border-bottom:1px solid var(--line)}
.drag-handle{touch-action:none;user-select:none;color:var(--gray);font-size:18px;padding:5px 4px;cursor:grab}
.step-editor-title{font-weight:700;flex:1}
.small-danger{border:0;background:transparent;color:var(--danger);padding:6px 4px}
.step-editor-body{padding:14px}
.symbol-edit-list{display:grid;gap:10px}
.symbol-edit{border:1px solid var(--line);border-radius:12px;padding:11px;background:#FCFAF8}
.symbol-edit-top{display:flex;gap:8px;align-items:center}
.symbol-preview{width:68px;height:68px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:0 0 68px}
.symbol-edit .symbol-name-input{flex:1}
.file-label{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:500;margin-top:8px}
.file-label input{display:none}
.symbol-actions{display:flex;justify-content:flex-end}
.step-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.step-add button{border:1px solid var(--line);background:#fff;color:var(--medium);border-radius:10px;padding:9px 12px;font-size:13px}
.step-add button:hover{background:var(--cream)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#D9D5D0;border-radius:99px;transition:.2s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.switch input:checked + .slider{background:var(--sage)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.editor-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.editor-footer button{min-width:110px}
.modal{position:fixed;inset:0;background:rgba(55,53,47,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.open{display:flex}
.modal-box{max-width:760px;max-height:90vh;background:#fff;border-radius:18px;padding:14px;position:relative}
.modal-box img{display:block;max-width:100%;max-height:80vh;object-fit:contain}
.modal-close{position:absolute;right:10px;top:10px;border:0;background:#fff;border-radius:50%;width:36px;height:36px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--dark);color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;z-index:80;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(min-width:700px){
  .app{padding:28px 28px 60px}
  .reiki-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-title h1{font-size:32px}
}
@media(max-width:480px){
  .app{padding:14px 12px 34px}
  .topbar{margin-bottom:12px}
  .page-title{font-size:23px}
  .editor-footer{position:sticky;bottom:0;background:rgba(250,250,248,.96);padding:12px 0 2px}
  .editor-footer button{flex:1}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="關閉">×</button>
    <img id="modalImg" alt="符號放大檢視">
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'reikiMethodTool.v1';
  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  let data = loadData();
  let currentView = 'dashboard';
  let currentId = null;
  let editorDraft = null;
  let searchQuery = '';
  let dragState = null;

  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
  const now = () => new Date().toISOString();

  function blankStep(type) {
    const base = { id: uid(), type };
    if (type === 'chant' || type === 'handTechnique') return {...base, content:{text:''}};
    if (type === 'symbol') return {...base, content:{symbols:[], repeatCount:1}};
    if (type === 'purification') return {...base, content:{enabled:true, method:''}};
    return base;
  }

  function blankRecord(name='') {
    return {
      id: uid(), name,
      openingDeclaration:'我現在使用靈氣來為***做靈氣療癒',
      handsRaised:'我就是光、光就是我',
      steps:[],
      closing:'感恩宇宙能量',
      notes:'',
      createdAt:now(), updatedAt:now()
    };
  }

  function normalizeData(raw) {
    const records = Array.isArray(raw?.records) ? raw.records : [];
    return {
      version:1,
      records: records.map(r => {
        const steps = Array.isArray(r.steps) ? r.steps : [];
        return {
          id: String(r.id || uid()),
          name: String(r.name || ''),
          openingDeclaration: String(r.openingDeclaration ?? ''),
          handsRaised: String(r.handsRaised ?? ''),
          steps: steps.map(s => {
            const type = ['chant','symbol','purification','handTechnique'].includes(s?.type) ? s.type : 'chant';
            const out = {id:String(s?.id || uid()), type, content:{}};
            if (type === 'chant' || type === 'handTechnique') out.content.text=String(s?.content?.text ?? '');
            if (type === 'purification') out.content={enabled:s?.content?.enabled !== false, method:String(s?.content?.method ?? '')};
            if (type === 'symbol') out.content={
              symbols:Array.isArray(s?.content?.symbols) ? s.content.symbols.map(x=>({name:String(x?.name??''),imageData:typeof x?.imageData==='string'?x.imageData:''})) : [],
              repeatCount:Math.max(1, Number(s?.content?.repeatCount)||1)
            };
            return out;
          }),
          closing:String(r.closing ?? ''),
          notes:String(r.notes ?? ''),
          createdAt:r.createdAt || now(),
          updatedAt:r.updatedAt || now()
        };
      }).filter(r => r.id)
    };
  }

  function loadData() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"version":1,"records":[]}');
      return normalizeData(raw);
    } catch (e) {
      return {version:1,records:[]};
    }
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      showToast('資料儲存失敗，可能是瀏覽器儲存空間不足。');
      return false;
    }
  }

  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showToast(msg) {
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t=setTimeout(()=>toastEl.classList.remove('show'),2400);
  }

  function render() {
    if (currentView==='dashboard') renderDashboard();
    else if (currentView==='detail') renderDetail(currentId);
    else renderEditor();
  }

  function header(back=false) {
    return `<div class="topbar">
      <div><div class="brand">靈氣法工具</div><div class="brand-sub">快速查找・清楚執行</div></div>
      ${back ? '<button class="ghost-btn" id="headerBack">← 返回</button>' : ''}
    </div>`;
  }

  function renderDashboard() {
    currentView='dashboard';
    const filtered = data.records.filter(r => r.name.toLocaleLowerCase().includes(searchQuery.toLocaleLowerCase()));
    app.innerHTML = `
      ${header()}
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="快速搜尋靈氣法名稱" value="${esc(searchQuery)}" autocomplete="off">
      </div>
      <h1 class="page-title">我的靈氣法</h1>
      <p class="page-desc">點選名稱即可直接查看完整使用步驟。</p>
      <div class="dashboard-actions">
        <button class="primary-btn" id="addReiki">＋ 新增靈氣法</button>
        <button class="ghost-btn" id="exportBtn">↥ 匯出備份</button>
        <label class="ghost-btn" style="display:inline-flex;align-items:center;cursor:pointer;margin:0">
          ↧ 匯入備份<input id="importInput" type="file" accept=".json,application/json" hidden>
        </label>
      </div>
      <div class="section-head"><h2 class="section-title">所有靈氣法</h2><span class="count">${filtered.length} 個</span></div>
      <div class="reiki-list">
        ${filtered.length ? filtered.map(r=>`
          <button class="reiki-card" data-open="${esc(r.id)}">
            <div><div class="reiki-name">${esc(r.name)}</div><div class="reiki-meta">${r.steps.length} 個可排序步驟</div></div>
            <div class="chevron">›</div>
          </button>`).join('') :
          `<div class="empty"><strong>${data.records.length ? '找不到符合的靈氣法' : '還沒有靈氣法'}</strong>${data.records.length ? '換個關鍵字試試看。' : '先新增第一個靈氣法，之後就能快速查找。'}</div>`}
      </div>`;
    document.getElementById('search').addEventListener('input',e=>{searchQuery=e.target.value;renderDashboard(); const el=document.getElementById('search');el.focus();el.setSelectionRange(el.value.length,el.value.length)});
    document.getElementById('addReiki').addEventListener('click',()=>{editorDraft=blankRecord();currentView='editor';render()});
    document.getElementById('exportBtn').addEventListener('click',exportBackup);
    document.getElementById('importInput').addEventListener('change',e=>{if(e.target.files[0]) importBackup(e.target.files[0]);e.target.value=''});
    app.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{currentId=b.dataset.open;currentView='detail';render()}));
  }

  function renderDetail(id) {
    const r=data.records.find(x=>x.id===id);
    if(!r){currentView='dashboard';render();return}
    app.innerHTML=`${header(true)}
      <div class="toolbar">
        <button class="back" id="backBtn">← 回到靈氣法清單</button>
        <button class="ghost-btn" id="editBtn">編輯</button>
      </div>
      <div class="detail-title"><div class="eyebrow">使用的靈氣法為</div><h1>${esc(r.name)}</h1></div>
      <div class="read-card"><div class="step-label">① 合掌 → 宣告</div><div class="step-content">${esc(r.openingDeclaration)||'<span class="empty-text">尚未填寫</span>'}</div></div>
      <div class="read-card"><div class="step-label">② 高舉雙手</div><div class="step-content">${esc(r.handsRaised)||'<span class="empty-text">尚未填寫</span>'}</div></div>
      <div id="stepsRead">${r.steps.map((s,i)=>renderReadStep(s,i+3)).join('')}</div>
      <div class="read-card"><div class="step-label">合掌結束</div><div class="step-content">${esc(r.closing)||'<span class="empty-text">尚未填寫</span>'}</div></div>
      ${r.notes.trim()?`<div class="read-card notes"><div class="step-label">備注</div><div class="step-content">${esc(r.notes)}</div></div>`:''}
      <div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="danger-btn" id="deleteBtn">刪除這個靈氣法</button></div>`;
    document.getElementById('headerBack').onclick=()=>{currentView='dashboard';render()};
    document.getElementById('backBtn').onclick=()=>{currentView='dashboard';render()};
    document.getElementById('editBtn').onclick=()=>{editorDraft=deepCopy(r);currentView='editor';render()};
    document.getElementById('deleteBtn').onclick=()=>deleteRecord(id);
    app.querySelectorAll('[data-zoom]').forEach(img=>img.addEventListener('click',()=>openImage(img.dataset.zoom)));
  }

  function renderReadStep(s,n) {
    const title={chant:'念達法',symbol:'符號',purification:'淨化',handTechnique:'手法'}[s.type];
    let body='';
    if(s.type==='chant'||s.type==='handTechnique') body=`<div class="step-content">${esc(s.content.text)||'<span class="empty-text">尚未填寫</span>'}</div>`;
    if(s.type==='purification') {
      if(!s.content.enabled) return '';
      body=`<div class="step-content">${esc(s.content.method)||'<span class="empty-text">尚未填寫淨化方式</span>'}</div>`;
    }
    if(s.type==='symbol') {
      body=`<div class="symbol-row">${s.content.symbols.length?s.content.symbols.map(x=>`
        <div class="symbol-item">
          ${x.imageData?`<img class="symbol-image" src="${esc(x.imageData)}" data-zoom="${esc(x.imageData)}" alt="${esc(x.name||'符號')}">`:`<div class="symbol-image" style="display:flex;align-items:center;justify-content:center;color:var(--gray)">無圖片</div>`}
          <div class="symbol-name">${esc(x.name)||'未命名符號'}</div>
        </div>`).join(''):'<span class="empty-text">尚未加入符號</span>'}</div>
        <div class="repeat">${esc(s.content.repeatCount)} 次</div>`;
    }
    return `<div class="read-card"><div class="step-label">${n}　${title}</div>${body}</div>`;
  }

  function renderEditor() {
    const r=editorDraft;
    app.innerHTML=`${header(true)}
      <div class="toolbar">
        <button class="back" id="cancelEdit">← 返回</button>
        <span style="font-weight:700">${r.id && data.records.some(x=>x.id===r.id)?'編輯靈氣法':'新增靈氣法'}</span>
        <span style="width:58px"></span>
      </div>
      <div class="editor-card">
        <div class="field"><label for="name">靈氣法名稱 *</label><input id="name" type="text" value="${esc(r.name)}" placeholder="例如：情緒淨化法"></div>
        <div class="field"><label for="opening">合掌 → 宣告</label><textarea id="opening">${esc(r.openingDeclaration)}</textarea></div>
        <div class="field"><label for="hands">高舉雙手</label><textarea id="hands">${esc(r.handsRaised)}</textarea></div>
      </div>
      <div class="section-head"><h2 class="section-title">可排序步驟</h2><span class="count">拖曳左側 ⋮⋮ 調整順序</span></div>
      <div id="stepsEditor" class="steps-editor">${r.steps.map((s,i)=>stepEditorHtml(s,i)).join('')}</div>
      <div class="step-add">
        <button data-add-type="chant">＋ 念達法</button>
        <button data-add-type="symbol">＋ 符號</button>
        <button data-add-type="purification">＋ 淨化</button>
        <button data-add-type="handTechnique">＋ 手法</button>
      </div>
      <div class="editor-card" style="margin-top:18px">
        <div class="field"><label for="closing">合掌結束</label><textarea id="closing">${esc(r.closing)}</textarea></div>
        <div class="field" style="margin-bottom:0"><label for="notes">備注</label><textarea id="notes" placeholder="記錄這套靈氣法的補充說明、注意事項或使用心得">${esc(r.notes)}</textarea></div>
      </div>
      <div class="editor-footer"><button class="ghost-btn" id="cancelEdit2">取消</button><button class="primary-btn" id="saveEdit">儲存靈氣法</button></div>`;
    document.getElementById('headerBack').onclick=cancelEdit;
    document.getElementById('cancelEdit').onclick=cancelEdit;
    document.getElementById('cancelEdit2').onclick=cancelEdit;
    document.getElementById('saveEdit').onclick=saveEditor;
    app.querySelectorAll('[data-add-type]').forEach(b=>b.onclick=()=>{readFormToDraft();editorDraft.steps.push(blankStep(b.dataset.addType));renderEditor();focusNewStep()});
    bindEditorEvents();
  }

  function stepEditorHtml(s,i) {
    const titles={chant:'念達法',symbol:'符號',purification:'淨化',handTechnique:'手法'};
    let body='';
    if(s.type==='chant'||s.type==='handTechnique') body=`<textarea data-step-text="${esc(s.id)}" placeholder="${s.type==='chant'?'輸入念達法內容':'輸入手法內容'}">${esc(s.content.text)}</textarea>`;
    if(s.type==='purification') body=`<div class="switch-row"><span style="font-weight:500">需要淨化</span><label class="switch"><input type="checkbox" data-purify="${esc(s.id)}" ${s.content.enabled?'checked':''}><span class="slider"></span></label></div>
      <div class="field ${s.content.enabled?'':'hidden'}" data-purify-method="${esc(s.id)}" style="margin:14px 0 0"><label>淨化方式</label><textarea data-purify-text="${esc(s.id)}">${esc(s.content.method)}</textarea></div>`;
    if(s.type==='symbol') body=`<div class="field"><label>共同次數</label><input type="number" min="1" step="1" data-repeat="${esc(s.id)}" value="${esc(s.content.repeatCount)}"></div>
      <div class="symbol-edit-list">${s.content.symbols.map((x,j)=>symbolEditorHtml(s.id,j,x)).join('')}</div>
      <button class="ghost-btn" data-add-symbol="${esc(s.id)}" style="margin-top:10px">＋ 新增符號</button>`;
    return `<div class="step-editor" draggable="false" data-step-id="${esc(s.id)}">
      <div class="step-editor-head"><span class="drag-handle" data-drag-handle="${esc(s.id)}" title="拖曳排序">⋮⋮</span><span class="step-editor-title">${i+1}. ${titles[s.type]}</span><button class="small-danger" data-delete-step="${esc(s.id)}">刪除</button></div>
      <div class="step-editor-body">${body}</div>
    </div>`;
  }

  function symbolEditorHtml(stepId,j,x) {
    return `<div class="symbol-edit" data-symbol-wrap="${esc(stepId)}" data-symbol-index="${j}">
      <div class="symbol-edit-top">
        ${x.imageData?`<img class="symbol-preview" src="${esc(x.imageData)}" alt="符號預覽">`:`<div class="symbol-preview" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gray)">無圖片</div>`}
        <input class="symbol-name-input" data-symbol-name="${esc(stepId)}" data-symbol-index="${j}" type="text" value="${esc(x.name)}" placeholder="符號名稱">
      </div>
      <label class="file-label">📷 ${x.imageData?'更換圖片':'上傳符號圖片'}<input type="file" accept="image/*" data-symbol-file="${esc(stepId)}" data-symbol-index="${j}"></label>
      <div class="symbol-actions">${x.imageData?`<button class="small-danger" data-remove-symbol-image="${esc(stepId)}" data-symbol-index="${j}">移除圖片</button>`:''}<button class="small-danger" data-delete-symbol="${esc(stepId)}" data-symbol-index="${j}">刪除符號</button></div>
    </div>`;
  }

  function readFormToDraft() {
    if(!editorDraft)return;
    const q=id=>document.getElementById(id);
    if(q('name')) editorDraft.name=q('name').value.trim();
    if(q('opening')) editorDraft.openingDeclaration=q('opening').value;
    if(q('hands')) editorDraft.handsRaised=q('hands').value;
    if(q('closing')) editorDraft.closing=q('closing').value;
    if(q('notes')) editorDraft.notes=q('notes').value;
    document.querySelectorAll('[data-step-text]').forEach(el=>{
      const s=editorDraft.steps.find(x=>x.id===el.dataset.stepText); if(s)s.content.text=el.value;
    });
    document.querySelectorAll('[data-repeat]').forEach(el=>{
      const s=editorDraft.steps.find(x=>x.id===el.dataset.repeat); if(s)s.content.repeatCount=Math.max(1,Number(el.value)||1);
    });
    document.querySelectorAll('[data-purify]').forEach(el=>{
      const s=editorDraft.steps.find(x=>x.id===el.dataset.purify); if(s)s.content.enabled=el.checked;
    });
    document.querySelectorAll('[data-purify-text]').forEach(el=>{
      const s=editorDraft.steps.find(x=>x.id===el.dataset.purifyText); if(s)s.content.method=el.value;
    });
    document.querySelectorAll('[data-symbol-name]').forEach(el=>{
      const s=editorDraft.steps.find(x=>x.id===el.dataset.symbolName); const idx=Number(el.dataset.symbolIndex); if(s?.content.symbols[idx])s.content.symbols[idx].name=el.value;
    });
  }

  function bindEditorEvents() {
    document.querySelectorAll('[data-delete-step]').forEach(b=>b.onclick=()=>{readFormToDraft();editorDraft.steps=editorDraft.steps.filter(s=>s.id!==b.dataset.deleteStep);renderEditor()});
    document.querySelectorAll('[data-add-symbol]').forEach(b=>b.onclick=()=>{readFormToDraft();const s=editorDraft.steps.find(x=>x.id===b.dataset.addSymbol);if(s){s.content.symbols.push({name:'',imageData:''});renderEditor()}});
    document.querySelectorAll('[data-delete-symbol]').forEach(b=>b.onclick=()=>{readFormToDraft();const s=editorDraft.steps.find(x=>x.id===b.dataset.deleteSymbol);const idx=Number(b.dataset.symbolIndex);if(s)s.content.symbols.splice(idx,1);renderEditor()});
    document.querySelectorAll('[data-remove-symbol-image]').forEach(b=>b.onclick=()=>{readFormToDraft();const s=editorDraft.steps.find(x=>x.id===b.dataset.removeSymbolImage);const idx=Number(b.dataset.symbolIndex);if(s?.content.symbols[idx])s.content.symbols[idx].imageData='';renderEditor()});
    document.querySelectorAll('[data-purify]').forEach(el=>el.onchange=()=>{readFormToDraft();const s=editorDraft.steps.find(x=>x.id===el.dataset.purify);if(s)s.content.enabled=el.checked;renderEditor()});
    document.querySelectorAll('[data-symbol-file]').forEach(el=>el.onchange=async()=>{
      const file=el.files?.[0]; if(!file)return;
      if(!file.type.startsWith('image/')){showToast('請選擇圖片檔案。');return}
      try{
        const dataUrl=await resizeImage(file,900);
        readFormToDraft();
        const s=editorDraft.steps.find(x=>x.id===el.dataset.symbolFile);const idx=Number(el.dataset.symbolIndex);
        if(s?.content.symbols[idx])s.content.symbols[idx].imageData=dataUrl;
        renderEditor();
      }catch(e){showToast('圖片讀取失敗，請重新選擇。')}
    });
    enableStepDragSort();
  }

  function resizeImage(file,maxSize){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onerror=reject;
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
          const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
          const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
          resolve(c.toDataURL('image/jpeg',.86));
        };
        img.onerror=reject;img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function enableStepDragSort(){
    document.querySelectorAll('[data-drag-handle]').forEach(handle=>{
      handle.addEventListener('pointerdown',startDrag);
    });
  }

  function startDrag(e){
    e.preventDefault();
    const id=e.currentTarget.dataset.dragHandle;
    const card=e.currentTarget.closest('.step-editor');
    dragState={id,card,pointerId:e.pointerId};
    card.classList.add('dragging');
    e.currentTarget.setPointerCapture?.(e.pointerId);
    document.addEventListener('pointermove',onDragMove);
    document.addEventListener('pointerup',endDrag,{once:true});
  }

  function onDragMove(e){
    if(!dragState)return;
    const container=document.getElementById('stepsEditor');
    const cards=[...container.querySelectorAll('.step-editor:not(.dragging)')];
    let before=null;
    for(const card of cards){
      const rect=card.getBoundingClientRect();
      if(e.clientY < rect.top+rect.height/2){before=card;break}
    }
    if(before)container.insertBefore(dragState.card,before);
    else container.appendChild(dragState.card);
  }

  function endDrag(){
    if(!dragState)return;
    const container=document.getElementById('stepsEditor');
    readFormToDraft();
    const ids=[...container.querySelectorAll('.step-editor')].map(x=>x.dataset.stepId);
    editorDraft.steps.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));
    dragState.card.classList.remove('dragging');
    dragState=null;
    document.removeEventListener('pointermove',onDragMove);
    renderEditor();
    showToast('步驟順序已更新');
  }

  function focusNewStep(){
    setTimeout(()=>document.querySelector('#stepsEditor .step-editor:last-child')?.scrollIntoView({behavior:'smooth',block:'center'}),30);
  }

  function saveEditor(){
    readFormToDraft();
    if(!editorDraft.name){showToast('請先輸入靈氣法名稱。');document.getElementById('name')?.focus();return}
    editorDraft.updatedAt=now();
    const idx=data.records.findIndex(x=>x.id===editorDraft.id);
    if(idx>=0){data.records[idx]=deepCopy(editorDraft)}else{editorDraft.createdAt=now();data.records.push(deepCopy(editorDraft))}
    if(saveData()){currentId=editorDraft.id;currentView='detail';render();showToast('已儲存靈氣法')}
  }

  function cancelEdit(){
    if(editorDraft?.name && !confirm('尚未儲存的修改會被捨棄，確定返回嗎？'))return;
    currentView=currentId?'detail':'dashboard';render();
  }

  function deleteRecord(id){
    const r=data.records.find(x=>x.id===id);if(!r)return;
    if(!confirm(`確定要刪除「${r.name}」嗎？此操作無法復原。`))return;
    data.records=data.records.filter(x=>x.id!==id);saveData();currentView='dashboard';currentId=null;render();showToast('已刪除');
  }

  function exportBackup(){
    const payload={...data,exportedAt:now(),app:'reiki-method-tool',version:1};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`靈氣法備份-${new Date().toISOString().slice(0,10)}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('備份檔已匯出');
  }

  async function importBackup(file){
    if(!confirm('匯入備份會以備份內容取代目前的靈氣法資料，確定要繼續嗎？'))return;
    try{
      const text=await file.text();const raw=JSON.parse(text);
      const imported=normalizeData(raw);
      if(!Array.isArray(imported.records))throw new Error('invalid');
      if(!validateImportedData(imported))throw new Error('invalid');
      data=imported;
      if(!saveData())throw new Error('storage');
      currentView='dashboard';currentId=null;render();showToast(`已匯入 ${data.records.length} 個靈氣法`);
    }catch(e){showToast('匯入失敗：檔案格式不正確，原資料未被覆蓋。')}
  }

  function validateImportedData(d){
    return d && Array.isArray(d.records) && d.records.every(r =>
      r && typeof r.id==='string' && typeof r.name==='string' && Array.isArray(r.steps) &&
      r.steps.every(s=>s && typeof s.id==='string' && ['chant','symbol','purification','handTechnique'].includes(s.type))
    );
  }

  function openImage(src){modalImg.src=src;modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
  function closeImage(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');modalImg.removeAttribute('src')}
  document.getElementById('modalClose').onclick=closeImage;
  modal.addEventListener('click',e=>{if(e.target===modal)closeImage()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImage()});

  function deepCopy(x){return JSON.parse(JSON.stringify(x))}
  render();
})();
</script>
</body>
</html>
