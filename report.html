<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>讀心報告工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  /* ================= Design tokens ================= */
  :root{
    --pink:#C9938A; --soft-pink:#E8C4BC;
    --blue:#7A9BAD; --soft-blue:#B8CFDA;
    --sage:#9AAE9B;
    --gold:#C6A664;
    --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
    --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#FAF3EE; --border:#EAE4DC;
    --text:var(--dark); --text-2:var(--medium); --text-3:var(--gray);
    --shadow-sm: 0 1px 2px rgba(55,53,47,.06);
    --shadow-md: 0 10px 30px -14px rgba(55,53,47,.28);
    --radius-s:10px; --radius-m:16px; --radius-l:22px;
    --tint-pink: color-mix(in srgb, var(--pink) 14%, var(--surface));
    --tint-blue: color-mix(in srgb, var(--blue) 14%, var(--surface));
    --tint-sage: color-mix(in srgb, var(--sage) 16%, var(--surface));
    --tint-gold: color-mix(in srgb, var(--gold) 16%, var(--surface));
    --tint-pink-strong: color-mix(in srgb, var(--pink) 30%, var(--surface));
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --pink:#D9A99D; --soft-pink:#C48F84;
      --blue:#8FB0C1; --soft-blue:#729AAC;
      --sage:#A9BCA9; --gold:#D4B87C;
      --dark:#F1EAE3; --medium:#C6BCB1; --gray:#8F887E;
      --bg:#201D1A; --surface:#292521; --surface-2:#302A24; --border:#3D362E;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 14px 32px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --pink:#D9A99D; --soft-pink:#C48F84;
    --blue:#8FB0C1; --soft-blue:#729AAC;
    --sage:#A9BCA9; --gold:#D4B87C;
    --dark:#F1EAE3; --medium:#C6BCB1; --gray:#8F887E;
    --bg:#201D1A; --surface:#292521; --surface-2:#302A24; --border:#3D362E;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 14px 32px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3{margin:0; text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:1rem; color:var(--text);}
  .tnum{font-variant-numeric:tabular-nums;}
  [hidden]{display:none!important;}
  ::selection{background:var(--tint-pink-strong);}

  .icon{width:19px;height:19px;flex:none;display:block;}

  /* ================= Shell ================= */
  .app{max-width:840px; margin:0 auto; padding:0 18px 96px;}
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .top-inner{
    max-width:840px; margin:0 auto; padding:16px 18px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .name{font-size:1.15rem; font-weight:900; letter-spacing:.01em;}
  .brand .sub{font-size:.72rem; color:var(--text-3); letter-spacing:.08em; text-transform:uppercase;}
  .top-actions{display:flex; gap:8px;}
  .icon-btn{
    width:38px; height:38px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-2);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s, transform .1s;
  }
  .icon-btn:hover{background:var(--tint-pink); color:var(--pink);}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn.sync-warn{color:#B5564A; border-color:#B5564A;}

  nav.tabs{
    max-width:840px; margin:0 auto; padding:12px 18px 0;
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none; display:flex; align-items:center; gap:7px;
    padding:9px 16px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-2); font-size:.9rem; font-weight:500;
    white-space:nowrap; transition:all .15s;
  }
  .tab-btn .icon{width:16px;height:16px;}
  .tab-btn[aria-selected="true"]{
    background:var(--dark); color:var(--bg); border-color:var(--dark);
    font-weight:700;
  }
  :root[data-theme="dark"] .tab-btn[aria-selected="true"], @media (prefers-color-scheme:dark){}

  main{padding-top:22px;}
  .view{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ================= Section headings ================= */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin:28px 0 12px;}
  .section-head:first-child{margin-top:0;}
  .section-head h2{font-size:1rem; font-weight:700;}
  .section-head .count{font-size:.8rem; color:var(--text-3);}

  /* ================= Banner ================= */
  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--tint-gold); border:1px solid color-mix(in srgb, var(--gold) 40%, var(--border));
    border-radius:var(--radius-m); padding:13px 16px; margin-bottom:20px; font-size:.85rem; color:var(--text-2);
  }
  .banner b{color:var(--text); font-weight:700;}
  .banner button{
    flex:none; background:var(--dark); color:var(--bg); border:none; border-radius:999px;
    padding:7px 14px; font-size:.78rem; font-weight:700;
  }

  /* ================= Stat cards ================= */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:16px 16px 14px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  }
  .stat-card::before{content:''; position:absolute; left:0; top:0; right:0; height:3px;}
  .stat-card.c-pink::before{background:var(--pink);}
  .stat-card.c-blue::before{background:var(--blue);}
  .stat-card.c-sage::before{background:var(--sage);}
  .stat-card.c-gold::before{background:var(--gold);}
  .stat-card .label{font-size:.72rem; color:var(--text-3); letter-spacing:.06em; text-transform:uppercase; font-weight:700;}
  .stat-card .value{font-size:2rem; font-weight:900; margin-top:6px; line-height:1;}
  .stat-card .value small{font-size:.9rem; font-weight:700; color:var(--text-3); margin-left:2px;}

  /* ================= Record rows ================= */
  .record-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:13px 14px; margin-bottom:10px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .record-row:hover{border-color:var(--pink);}
  .record-row:active{transform:scale(.995);}
  .chakra-dot{width:13px; height:13px; border-radius:50%; flex:none; box-shadow:0 0 0 3px var(--surface-2);}
  .dot-root{background:var(--pink);}
  .dot-sacral{background:var(--soft-pink);}
  .dot-solar{background:var(--gold);}
  .dot-heart{background:var(--sage);}
  .dot-throat{background:var(--blue);}
  .dot-thirdeye{background:var(--soft-blue);}
  .dot-crown{background:var(--surface); border:2px solid var(--gold);}
  .record-main{flex:1; min-width:0;}
  .record-main .name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .record-main .rname{font-weight:700; font-size:.97rem;}
  .example-flag{font-size:.66rem; color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:1px 7px; font-weight:700;}
  .tag{font-size:.72rem; color:var(--pink); background:var(--tint-pink); border-radius:999px; padding:2px 9px; font-weight:500;}
  .record-main .meta{font-size:.78rem; color:var(--text-3); margin-top:3px;}
  .record-side{display:flex; align-items:center; gap:6px; flex:none;}
  .row-icon-btn{
    width:32px; height:32px; border-radius:999px; border:1px solid transparent; background:transparent;
    color:var(--text-3); display:flex; align-items:center; justify-content:center;
  }
  .row-icon-btn:hover{background:var(--surface-2); color:var(--pink);}
  .row-icon-btn .icon{width:16px; height:16px;}

  .empty-state{
    text-align:center; padding:42px 18px; color:var(--text-3); font-size:.88rem;
    background:var(--surface); border:1px dashed var(--border); border-radius:var(--radius-m);
  }

  /* ================= List controls ================= */
  .list-controls{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:10px 14px;
  }
  .search-box .icon{color:var(--text-3);}
  .search-box input{flex:1; border:none; outline:none; background:transparent; font-size:.92rem; color:var(--text);}
  .filter-row{display:flex; gap:8px; flex-wrap:wrap;}
  .filter-row select, .filter-row .sort-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-s);
    padding:8px 10px; font-size:.82rem; color:var(--text-2);
  }
  .filter-row .sort-btn{display:flex; align-items:center; gap:6px;}
  .filter-row .sort-btn .icon{width:14px;height:14px;}

  /* ================= Form ================= */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l);
    padding:22px; box-shadow:var(--shadow-sm);
  }
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:.82rem; font-weight:700; color:var(--text-2); margin-bottom:7px;}
  .field .hint{font-size:.74rem; color:var(--text-3); margin-top:5px;}
  .field-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px; flex-wrap:wrap;}
  .field-head label{margin-bottom:0;}
  .ai-btn{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    border:1px solid color-mix(in srgb, var(--gold) 45%, var(--border));
    background:var(--tint-gold); color:color-mix(in srgb, var(--gold) 70%, var(--text));
    border-radius:999px; padding:6px 13px; font-size:.78rem; font-weight:700;
    transition:opacity .15s, transform .1s;
  }
  .ai-btn:active{transform:scale(.96);}
  .ai-btn:disabled{opacity:.6; cursor:default;}
  .ai-btn .icon{width:14px; height:14px;}
  .ai-btn .spin{animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .field.ai-fresh textarea{border-color:var(--gold); background:var(--tint-gold);}
  .ai-flag{
    display:none; align-items:center; gap:5px; font-size:.72rem; font-weight:700;
    color:color-mix(in srgb, var(--gold) 70%, var(--text)); margin-top:6px;
  }
  .field.ai-fresh .ai-flag{display:flex;}
  .ai-flag .icon{width:12px; height:12px;}
  .apikey-row{display:flex; gap:8px;}
  .apikey-row input{flex:1;}
  .apikey-row .icon-btn{flex:none;}
  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .chip{display:inline-flex; align-items:center; gap:5px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 6px 5px 13px; font-size:.8rem; color:var(--text-2);}
  .chip button{display:flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; border:none; background:transparent; color:var(--text-3); padding:0;}
  .chip button:hover{background:var(--border); color:#B5564A;}
  .chip button .icon{width:11px; height:11px;}
  .add-row{display:flex; gap:8px;}
  .add-row input{flex:1;}
  .add-row .icon-btn{flex:none;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:var(--radius-s);
    padding:10px 12px; background:var(--bg); color:var(--text); outline:none;
    transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--pink);}
  .field textarea{resize:vertical; min-height:88px; line-height:1.6;}
  .field.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .chakra-select-row{display:flex; align-items:center; gap:10px;}
  .chakra-select-row select{flex:1;}
  .program-select-row{display:flex; align-items:center; gap:8px;}
  .program-select-row select{flex:1;}
  .program-select-row .icon-btn{width:38px; height:38px; flex:none;}
  .chakra-preview{
    display:flex; align-items:center; gap:8px; margin-top:9px; font-size:.8rem; color:var(--text-2);
    background:var(--surface-2); border-radius:var(--radius-s); padding:8px 11px;
  }
  .form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap;}
  .btn{
    border:none; border-radius:999px; padding:11px 22px; font-size:.9rem; font-weight:700;
    display:inline-flex; align-items:center; gap:7px; transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--pink); color:#fff;}
  .btn-primary .icon{stroke:#fff;}
  .btn-secondary{background:var(--surface-2); color:var(--text-2); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:#B5564A; border:1px solid #B5564A55;}
  .btn-ghost{background:transparent; color:var(--text-2);}
  .btn-sm{padding:8px 14px; font-size:.8rem;}
  .btn .icon{width:16px; height:16px;}

  /* ================= Report ================= */
  .report-toolbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .report-toolbar .left{display:flex; align-items:center; gap:10px;}
  .report-toolbar .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .back-link{display:flex; align-items:center; gap:6px; color:var(--text-2); font-size:.88rem; font-weight:500;}
  .back-link .icon{width:16px;height:16px;}

  .report-wrap{display:flex; justify-content:center;}
  #reportCard{
    width:100%; max-width:640px; background:var(--surface); border-radius:var(--radius-l);
    box-shadow:var(--shadow-md); padding:38px 34px 30px; border:1px solid var(--border);
  }
  .r-eyebrow{
    display:flex; align-items:center; gap:10px;
    font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); font-weight:700;
  }
  .r-eyebrow .label{flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .r-eyebrow .no{flex:none;}
  .r-rule{height:1px; background:linear-gradient(to right, var(--gold), transparent); margin:9px 0 20px;}
  .r-meta{display:flex; justify-content:space-between; font-size:.76rem; color:var(--text-3); margin-bottom:18px;}
  .r-client{display:flex; align-items:stretch; gap:12px; margin-bottom:16px;}
  .r-client .bar{width:4px; border-radius:4px; background:var(--pink);}
  .r-client .who{display:flex; flex-direction:column; gap:6px; justify-content:center;}
  .r-client .who .n{font-size:1.5rem; font-weight:900;}
  .r-chakra{
    display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:var(--radius-m);
    background:var(--surface-2); margin-bottom:22px;
  }
  .r-chakra .dot{width:22px; height:22px;}
  .r-chakra .info b{font-size:.92rem;}
  .r-chakra .info span{display:block; font-size:.76rem; color:var(--text-3); margin-top:1px;}
  .r-section{margin-bottom:20px;}
  .r-section h3{
    display:flex; align-items:center; gap:8px; font-size:.86rem; font-weight:700; margin-bottom:9px; color:var(--text);
  }
  .r-section h3::before{content:''; width:8px; height:8px; background:var(--gold); border-radius:2px; flex:none;}
  .r-section .body{font-size:.92rem; line-height:1.85; color:var(--text-2); white-space:pre-wrap; word-break:break-word;}
  .r-callout{
    background:var(--tint-gold); border-left:3px solid var(--gold); border-radius:0 var(--radius-s) var(--radius-s) 0;
    padding:12px 14px;
  }
  .r-transcript{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px;
  }
  .r-transcript .body{font-size:.85rem; color:var(--text-2);}
  .r-footer{text-align:center; margin-top:8px;}
  .r-footer .r-rule2{height:1px; background:linear-gradient(to right, transparent, var(--gold), transparent); margin-bottom:14px;}
  .r-footer .closing{font-size:.84rem; color:var(--text-2); line-height:1.7; margin-bottom:8px;}
  .r-footer .who2{font-size:.78rem; color:var(--text-3); letter-spacing:.04em;}
  .r-footer .who2 b{color:var(--gold); font-weight:700;}

  /* ================= Modals ================= */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,16,.44); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;
  }
  @media (min-width:640px){ .overlay{align-items:center; padding:20px;} }
  .modal{
    background:var(--surface); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:22px 22px 0 0; padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow-md);
  }
  @media (min-width:640px){ .modal{border-radius:var(--radius-l);} }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:-24px; z-index:5;
    background:var(--surface); margin:-24px -22px 16px; padding:24px 22px 12px;
  }
  .modal-head h2{font-size:1.05rem; font-weight:900;}
  .modal .field:last-of-type{margin-bottom:12px;}
  .modal hr{border:none; border-top:1px solid var(--border); margin:18px 0;}
  .modal .subhead{display:flex; align-items:center; gap:6px; font-size:.82rem; font-weight:700; color:var(--text-2); margin-bottom:10px;}
  .modal .subhead .icon{width:14px; height:14px; color:var(--gold);}
  .backup-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .file-btn{position:relative; overflow:hidden;}
  .file-btn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .danger-zone{margin-top:6px; padding-top:14px; border-top:1px dashed var(--border);}

  .confirm-modal{max-width:340px; text-align:center; padding:26px 22px;}
  .confirm-modal p{font-size:.9rem; color:var(--text-2); margin:10px 0 20px; line-height:1.6;}
  .confirm-modal .actions{display:flex; gap:10px;}
  .confirm-modal .actions .btn{flex:1; justify-content:center;}

  .image-modal{max-width:560px; text-align:center;}
  .image-modal img{width:100%; border-radius:var(--radius-m); border:1px solid var(--border); margin:14px 0;}
  .image-modal .tip{font-size:.8rem; color:var(--text-3); line-height:1.6;}

  .backup-text{
    width:100%; min-height:130px; border:1px solid var(--border); border-radius:var(--radius-s);
    background:var(--surface-2); padding:10px; font-size:.74rem; font-family:ui-monospace,monospace; color:var(--text-2);
    margin-top:8px;
  }
  .text-toggle-btn{
    display:inline; border:none; background:none; padding:0; margin-left:4px;
    color:var(--pink); font-size:inherit; font-weight:600; text-decoration:underline; cursor:pointer;
  }

  /* ================= Toast ================= */
  #toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px);
    background:var(--dark); color:var(--bg); padding:11px 20px; border-radius:999px; font-size:.84rem; font-weight:500;
    box-shadow:var(--shadow-md); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:200;
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  /* ================= FAB ================= */
  .fab{
    position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:40;
    width:56px; height:56px; border-radius:50%; background:var(--pink); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md);
  }
  .fab .icon{width:24px;height:24px; stroke:#fff;}

  @media (min-width:560px){
    .field.grid2-desktop{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="name">讀心報告工作室</span>
      <span class="sub">Consultation Report Studio</span>

const PROGRAMS_KEY = 'ltrs_programs_v1';
const PROGRAMS_META_KEY = 'ltrs_programs_meta_v1';
const DEFAULT_PROGRAMS = ['一對一諮詢','單一脈輪能量課程','全七脈輪能量課程','關係眼認證私塾','追蹤諮詢'];
function loadPrograms(){
  try{
    const raw = localStorage.getItem(PROGRAMS_KEY);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) return arr; }
  }catch(e){ console.warn('loadPrograms failed', e); }
  return DEFAULT_PROGRAMS.slice();
}
function loadProgramsUpdatedAt(){
  try{ return Number(localStorage.getItem(PROGRAMS_META_KEY))||0; }catch(e){ return 0; }
}
function savePrograms(list, opts){
  opts = opts || {};
  state.programs = list;
  try{ localStorage.setItem(PROGRAMS_KEY, JSON.stringify(list)); }catch(e){ console.warn(e); }
  const ts = opts.updatedAt || Date.now();
  try{ localStorage.setItem(PROGRAMS_META_KEY, String(ts)); }catch(e){ console.warn(e); }
  if(!opts.skipPush) pushProgramsToCloud(list, ts);
}
function pushProgramsToCloud(list, ts){
  if(!state.settings || !state.settings.cloudSyncUrl) return;
  cloudRequest({type:'savePrograms', programs:list, updatedAt: ts}).catch(err=>{
    console.warn('push programs failed', err);
  });
}
function syncPrograms(){
  if(!state.settings.cloudSyncUrl) return Promise.resolve();
  return cloudRequest({type:'listPrograms'}).then(res=>{
    const cloudTs = (res && res.updatedAt) || 0;
    const localTs = loadProgramsUpdatedAt();
    const cloudList = res && Array.isArray(res.programs) ? res.programs : null;
    if(cloudList && cloudTs > localTs){
      savePrograms(cloudList, {updatedAt:cloudTs, skipPush:true});
      renderProgramChipsIfOpen();
      if(state.view==='list' || state.view==='form') render();
    }else if(cloudTs <= localTs){
      const same = cloudList && JSON.stringify(cloudList)===JSON.stringify(state.programs);
      if(!same) pushProgramsToCloud(state.programs, localTs || Date.now());
    }
  }).catch(err=>{ console.warn('syncPrograms failed', err); });
}

const DEFAULT_SETTINGS = {
  brandName:'情感讀心師',

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(s){
  if(!s) return '';
  const [y,m,d] = String(s).split('-');
  if(!y || !m || !d) return '';
  return y+'年'+parseInt(m)+'月'+parseInt(d)+'日';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function loadSettings(){
  try{

const SETTINGS_META_KEY = 'ltrs_settings_meta_v1';
function loadSettingsUpdatedAt(){
  try{ return Number(localStorage.getItem(SETTINGS_META_KEY))||0; }catch(e){ return 0; }
}
function saveSettings(s, opts){
  opts = opts || {};
  state.settings = s;
  try{ localStorage.setItem(SET_KEY, JSON.stringify(s)); }catch(e){ console.warn(e); }
  let ts = loadSettingsUpdatedAt();
  if(!opts.keepTimestamp){
    ts = opts.updatedAt || Date.now();
    try{ localStorage.setItem(SETTINGS_META_KEY, String(ts)); }catch(e){ console.warn(e); }
  }
  if(!opts.skipPush) pushSettingsToCloud(s, ts);
}
// 這幾項是「連到哪個雲端後台」本身需要的資訊，只能留在裝置本機手動填寫，不會被同步蓋掉
const SETTINGS_LOCAL_ONLY_KEYS = ['cloudSyncUrl','cloudSyncPassword'];
function syncableSettings(s){
  const out = Object.assign({}, s);
  SETTINGS_LOCAL_ONLY_KEYS.forEach(k=>delete out[k]);
  return out;
}
function pushSettingsToCloud(s, ts){
  if(!s.cloudSyncUrl) return;
  cloudRequest({type:'saveSettings', settings: syncableSettings(s), updatedAt: ts}).catch(err=>{
    console.warn('push settings failed', err);
  });
}
function syncSettings(){
  if(!state.settings.cloudSyncUrl) return Promise.resolve();
  return cloudRequest({type:'listSettings'}).then(res=>{
    const cloudTs = (res && res.updatedAt) || 0;
    const localTs = loadSettingsUpdatedAt();
    const cloudSettings = res && res.settings && typeof res.settings==='object' ? res.settings : null;
    if(cloudSettings && cloudTs > localTs){
      const merged = Object.assign({}, DEFAULT_SETTINGS, syncableSettings(cloudSettings), {
        cloudSyncUrl: state.settings.cloudSyncUrl,
        cloudSyncPassword: state.settings.cloudSyncPassword
      });
      saveSettings(merged, {updatedAt:cloudTs, skipPush:true});
    }else if(cloudTs <= localTs){
      const same = cloudSettings && JSON.stringify(syncableSettings(cloudSettings))===JSON.stringify(syncableSettings(state.settings));
      if(!same) pushSettingsToCloud(state.settings, localTs || Date.now());
    }
  }).catch(err=>{ console.warn('syncSettings failed', err); });
}

/* ============ 雲端同步（電腦手機共用資料） ============ */
const PEND_KEY = 'ltrs_pending_ops_v1';
function loadPending(){
  try{ const raw = localStorage.getItem(PEND_KEY); if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) return arr; } }
  catch(e){ console.warn('loadPending failed', e); }
  return [];
}
function savePending(list){
  try{ localStorage.setItem(PEND_KEY, JSON.stringify(list)); }catch(e){ console.warn(e); }
}
function queueOp(op){
  const list = loadPending().filter(o => o.id !== op.id);
  list.push(op);
  savePending(list);
}
function cloudRequest(payload){
  const url = (state.settings.cloudSyncUrl||'').trim();
  if(!url) return Promise.reject(new Error('not_configured'));
  const body = Object.assign({password: state.settings.cloudSyncPassword||''}, payload);
  return fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  }).then(r=>r.json()).then(data=>{
    if(!data || data.ok===false){
      const err = new Error((data && data.error) || 'cloud_error');
      if(data && data.detail) err.detail = data.detail;
      throw err;
    }
    return data;
  });
}
function pushPendingOps(){
  const list = loadPending();
  if(list.length===0) return Promise.resolve();
  const remaining = list.slice();
  let chain = Promise.resolve();
  list.forEach(op=>{
    chain = chain.then(()=>{
      const payload = op.type==='delete' ? {type:'delete', id:op.id} : {type:'save', record:op.record};
      return cloudRequest(payload).then(()=>{
        const idx = remaining.indexOf(op);
        if(idx>-1) remaining.splice(idx,1);
      }).catch(err=>{ console.warn('pushPendingOps op failed', op, err); });
    });
  });
  return chain.then(()=>savePending(remaining));
}
function queueAndPush(op){
  queueOp(op);
  pushPendingOps().catch(err=>console.warn('background push failed', err));
}
function cloudStatusText(){
  if(!state.settings.cloudSyncUrl) return '尚未設定雲端同步網址';
  if(state.syncStatus==='syncing') return '同步中…';
  if(state.syncStatus==='unauthorized') return '⚠️ 密碼不正確，請確認「同步密碼」跟 Apps Script 裡的 ADMIN_PASSWORD 完全一致';
  if(state.syncStatus==='error') return '⚠️ 連線失敗，請確認網址是否正確';
  if(state.lastSyncAt) return '✅ 最後同步時間：'+new Date(state.lastSyncAt).toLocaleString('zh-TW');
  return '尚未同步過，按下方「立即同步」試試看';
}
function syncNow(opts){
  opts = opts || {};
  const url = (state.settings.cloudSyncUrl||'').trim();
  if(!url){
    if(opts.manual) toast('尚未設定雲端同步網址，請先到設定填寫');
    return Promise.resolve();
  }
  state.syncStatus = 'syncing';
  updateSyncBtn();
  return pushPendingOps().then(()=>syncPrograms()).then(()=>syncSettings()).then(()=>cloudRequest({type:'list'})).then(data=>{
    const cloudRecords = Array.isArray(data.records) ? data.records : [];
    const pendingIds = new Set(loadPending().map(o=>o.id));
    const localMap = new Map(state.records.filter(r=>!r.isExample).map(r=>[r.id, r]));
    const examples = state.records.filter(r=>r.isExample);
    const merged = new Map();
    cloudRecords.forEach(r=>merged.set(r.id, Object.assign({isExample:false}, r)));
    localMap.forEach((rec, id)=>{
      if(pendingIds.has(id) || !merged.has(id)) merged.set(id, rec);
    });
    saveRecords(examples.concat(Array.from(merged.values())));
    state.syncStatus = 'ok';
    state.lastSyncAt = Date.now();
    updateSyncBtn();
    if(state.view==='dashboard' || state.view==='list' || state.view==='report') render();
    if(opts.manual) toast('已同步最新資料');
  }).catch(err=>{
    console.warn('syncNow failed', err);
    state.syncStatus = (err && err.message==='unauthorized') ? 'unauthorized' : 'error';
    updateSyncBtn();
    if(opts.manual) toast(syncErrorMessage(err));
  });
}
function updateSyncBtn(){
  const btn = document.getElementById('syncBtn');
  if(!btn) return;
  btn.innerHTML = state.syncStatus === 'syncing' ? ICON.spinner : ICON.sync;
  btn.title = cloudStatusText();
  btn.classList.toggle('sync-warn', state.syncStatus==='error' || state.syncStatus==='unauthorized');
}
function syncErrorMessage(err){
  const msg = err && err.message;
  if(msg === 'unauthorized') return '密碼不正確，請確認「同步密碼」跟 Apps Script 指令碼屬性裡的 ADMIN_PASSWORD 完全一致（含大小寫、不能有多餘空格）';
  if(msg === 'not_configured') return '尚未設定雲端同步網址';
  return '連線失敗，請確認網址是否正確，或稍後再試';
}

/* ============ Computations ============ */
function isSameWeek(dateStr, ref){
  if(!dateStr) return false;
  const d = new Date(String(dateStr)+'T00:00:00');
  const r = new Date(String(ref)+'T00:00:00');
  const day = (r.getDay()+6)%7; // Mon=0
  const monday = new Date(r); monday.setDate(r.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return d>=monday && d<=sunday;
}
function isSameMonth(dateStr, ref){
  if(!dateStr) return false;
  return String(dateStr).slice(0,7) === String(ref).slice(0,7);
}
function computeStats(){
  const today = todayStr();
  const recs = state.records;
  const todayCount = recs.filter(r=>r.date===today).length;
  const weekCount = recs.filter(r=>isSameWeek(r.date, today)).length;
  const monthCount = recs.filter(r=>isSameMonth(r.date, today)).length;
  const clients = new Set(recs.map(r=>String(r.name||'').trim()));
  return {todayCount, weekCount, monthCount, clientCount:clients.size, total:recs.length};
}
function reportNumber(rec){
  const sameDay = state.records
    .filter(r=>r.date===rec.date)
    .sort((a,b)=>a.createdAt-b.createdAt);
  const idx = sameDay.findIndex(r=>r.id===rec.id);
  return 'NO. '+String(rec.date||'').replace(/-/g,'')+'-'+String(idx+1).padStart(2,'0');
}

function buildAiPrompt(text){
  return `你是一位身心靈療癒／情感諮詢師的專業助理，請閱讀以下諮詢對話紀錄，整理成報告書用的兩個段落。

要求：
1. advice（諮詢問題與建議）：用溫柔、專業、第二人稱「妳／你」對客戶說話的語氣，整理出客戶這次提出的核心問題，以及可以給客戶的具體建議，約3到6句，適合直接放進正式報告書給客戶看。
2. notes（注意事項）：需要提醒客戶留意或練習的事情，約1到4句。
3. 只根據對話紀錄裡實際出現的內容整理，不要編造對話中沒有的事實或細節。
4. 全部使用繁體中文。
5. 嚴格只輸出以下 JSON 格式的純文字，不要加任何說明文字、不要加 markdown code fence：
{"advice":"...","notes":"..."}

對話紀錄：
"""
${text}
"""`;
}
function extractJson(raw){
  try{ return JSON.parse(raw); }catch(e){}
  const m = raw.match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
async function runAiSummarize(){
  const key = (state.settings.apiKey||'').trim();
  if(!key){
    toast('請先在設定中貼上 Claude API Key');
    openSettings();
    return;
  }
  const transcriptEl = document.getElementById('f_transcript');
  const text = transcriptEl.value.trim();
  if(!text){
    toast('請先在下方貼上這次的對話紀錄');
    transcriptEl.focus();
    return;
  }
  const btn = document.getElementById('aiBtn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = ICON.spinner + '<span>AI 整理中...</span>';
  try{
    const model = state.settings.aiModel || DEFAULT_SETTINGS.aiModel;
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model,
        max_tokens: 800,
        messages:[{role:'user', content: buildAiPrompt(text)}]
      })
    });
    if(!resp.ok){
      let msg = 'AI 整理失敗（狀態碼 '+resp.status+'）';
      if(resp.status===401) msg = 'API Key 無效，請到設定確認';
      else if(resp.status===429) msg = 'API 額度或流量限制，請稍後再試';
      else{
        try{ const j = await resp.json(); if(j.error && j.error.message) msg = j.error.message; }catch(e){}
      }
      throw new Error(msg);
    }
    const data = await resp.json();
    const raw = (data.content && data.content[0] && data.content[0].text) || '';
    const parsed = extractJson(raw);
    if(!parsed || (!parsed.advice && !parsed.notes)) throw new Error('AI 回覆格式無法解析，請再試一次');
    if(parsed.advice) document.getElementById('f_advice').value = parsed.advice;
    if(parsed.notes) document.getElementById('f_notes').value = parsed.notes;
    markAiFresh();
    toast('已產生 AI 草稿，記得確認後再儲存');
  }catch(err){
    console.warn('AI summarize failed', err);
    toast(err.message || 'AI 整理失敗，請稍後再試');
  }finally{
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}
function collectFormPayload(requireDate){
  const name = document.getElementById('f_name').value.trim();
  const date = document.getElementById('f_date').value;
  if(!name){ toast('請至少填寫客戶姓名'); return null; }
  if(requireDate && !date){ toast('請填寫諮詢日期'); return null; }
  return {
    name,
    email: document.getElementById('f_email').value.trim(),
    date: date || todayStr(),
    program: document.getElementById('f_program').value.trim(),
    chakra: document.getElementById('f_chakra').value,
    advice: document.getElementById('f_advice').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    transcript: document.getElementById('f_transcript').value.trim()
  };
}
function persistFormRecord(payload, opts){
  opts = opts || {};
  if(state._importedBookingCode) payload.sourceBookingCode = state._importedBookingCode;
  let list = state.records.slice();
  let id;
  if(state.editingId){
    const idx = list.findIndex(r=>r.id===state.editingId);
    list[idx] = Object.assign({}, list[idx], payload, {isExample:false, isDraft:!!opts.asDraft});
    id = state.editingId;
  }else{
    id = uid();
    list.push(Object.assign({id, createdAt:Date.now(), isExample:false, isDraft:!!opts.asDraft}, payload));
  }
  saveRecords(list);
  const savedRec = list.find(r=>r.id===id);
  if(savedRec && !savedRec.isExample) queueAndPush({type:'save', id, record: savedRec});
  state.editingId = null;
  state._importedBookingCode = null;
  return id;
}
function submitForm(e){
  e.preventDefault();
  const payload = collectFormPayload(true);
  if(!payload) return false;
  const wasEditing = !!state.editingId;
  const id = persistFormRecord(payload, {asDraft:false});
  toast(wasEditing ? '已儲存變更' : '已建立報告書');
  viewReport(id);
  return false;
}
function saveDraft(){
  const payload = collectFormPayload(false);
  if(!payload) return;
  persistFormRecord(payload, {asDraft:true});
  toast('已暫存草稿，之後可以回來補完整');
  go('list');
}

function deleteRecord(id){

function copyReportText(id){
  const r = state.records.find(x=>x.id===id);
  const text = reportTextOf(r);
  const done = ()=>toast('已複製報告文字，可直接貼到 LINE');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('複製失敗，請手動選取文字'); }
  document.body.removeChild(ta);
}

function exportImage(id){
  const r = state.records.find(x=>x.id===id);
  const card = document.getElementById('reportCard');
  if(!card || !window.html2canvas){ toast('圖片功能載入失敗，請改用複製文字'); return; }
  const btn = document.getElementById('imgBtn');
  const originalHtml = btn.innerHTML;
  btn.innerHTML = '<span>產生中...</span>';
  const bg = getComputedStyle(card).backgroundColor;
  window.html2canvas(card, {scale:2, backgroundColor:bg, useCORS:true}).then(canvas=>{
    btn.innerHTML = originalHtml;
    canvas.toBlob(blob=>{
      if(!blob){ toast('圖片產生失敗，請改用複製文字'); return; }
      const url = URL.createObjectURL(blob);
      openImageModal(url, r);
    });
  }).catch(err=>{
    console.warn('html2canvas failed', err);
    btn.innerHTML = originalHtml;
    toast('圖片產生失敗，請改用複製文字');
  });

/* ============ Booking system import ============ */
let _bookingRecordsCache = null;
function openBookingImport(){
  const url = (state.settings.bookingApiUrl||'').trim();
  const pw = state.settings.bookingPassword || '';
  if(!url || !pw){
    toast('請先在設定中填寫預約系統網址與密碼');
    openSettings();
    return;
  }
  _bookingRecordsCache = null;
  const holder = document.createElement('div');
  holder.id = 'bookingImportHolder';
  holder.innerHTML = `<div class="overlay" onclick="if(event.target===this) app.closeBookingImport()">
    <div class="modal" style="max-width:480px; text-align:left;">
      <div class="modal-head"><h2>從預約系統匯入</h2><button type="button" class="icon-btn" id="bi_close">${ICON.x}</button></div>
      <div class="list-controls" style="margin-bottom:12px;">
        <div class="search-box">${ICON.search}<input type="text" id="bi_search" placeholder="搜尋客戶姓名..."></div>
        <div class="filter-row">
          <select id="bi_status">
            <option value="已完成">已完成</option>
            <option value="已確認">已確認</option>
            <option value="">全部狀態</option>
          </select>
        </div>
      </div>
      <div id="bi_list"><div class="empty-state">讀取中...</div></div>
    </div>
  </div>`;
  document.getElementById('modalRoot').appendChild(holder);
  holder.querySelector('#bi_close').onclick = closeBookingImport;
  holder.querySelector('#bi_search').addEventListener('input', filterBookingImport);
  holder.querySelector('#bi_status').addEventListener('change', filterBookingImport);
  fetchBookingRecords();
}
function closeBookingImport(){
  const holder = document.getElementById('bookingImportHolder');
  if(holder && holder.parentNode) holder.parentNode.removeChild(holder);
}
function fetchBookingRecords(){
  const url = state.settings.bookingApiUrl.trim();
  const pw = state.settings.bookingPassword;
  if(!url){
    renderBookingImportMessage('尚未設定預約系統網址，請到設定 → 預約系統整合 填入網址');
    return;
  }
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){
    renderBookingImportMessage('網址格式看起來不正確，請確認貼上的是 Apps Script 部署後的 .../exec 網址（開頭應為 https://script.google.com/）');
    return;
  }
  fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({type:'getRecords', password: pw})
  }).then(r=>r.json()).then(data=>{
    if(!data || data.ok===false){
      renderBookingImportMessage(data && data.error==='unauthorized' ? '密碼錯誤，請到設定確認後台密碼' : '讀取失敗，請確認預約系統網址是否正確');
      return;
    }
    _bookingRecordsCache = Array.isArray(data.records) ? data.records : [];
    filterBookingImport();
  }).catch(err=>{
    console.warn('fetchBookingRecords failed', err);
    // 進一步判斷：用 no-cors 模式探測網路是否真的不通，藉此區分「網址/網路不通」與「CORS 或部署權限問題」
    fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({type:'getRecords', password: pw}) })
      .then(()=>{
        renderBookingImportMessage('連線被瀏覽器擋下（可能是 CORS 或部署權限問題）。請確認 Apps Script 部署設定為「執行身份：我」「具有存取權的使用者：任何人」，並重新部署為「新版本」後，複製最新的 .../exec 網址到設定中。');
      })
      .catch(()=>{
        renderBookingImportMessage('連線失敗：無法連到這個網址，請確認網路連線正常，且此頁面是用瀏覽器直接開啟（不是在預覽視窗中），再確認網址是否為 Apps Script 部署後的 .../exec 網址');
      });
  });
}
function renderBookingImportMessage(msg){
  const list = document.getElementById('bi_list');
  if(list) list.innerHTML = `<div class="empty-state">${escapeHtml(msg)}</div>`;
}
function usedBookingCodes(){
  return new Set(state.records.map(r=>r.sourceBookingCode).filter(Boolean));
}
function filterBookingImport(){
  const listEl = document.getElementById('bi_list');
  if(!listEl) return;
  if(_bookingRecordsCache === null){ listEl.innerHTML = '<div class="empty-state">讀取中...</div>'; return; }
  const q = (document.getElementById('bi_search').value||'').trim().toLowerCase();
  const status = document.getElementById('bi_status').value;
  const used = usedBookingCodes();
  const list = _bookingRecordsCache.filter(b=>{
    if(status && b.status !== status) return false;
    if(q && !String(b.name||'').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> String(b.datetime||'').localeCompare(String(a.datetime||'')));

  if(!list.length){ listEl.innerHTML = '<div class="empty-state">沒有符合條件的預約資料</div>'; return; }

  listEl.innerHTML = list.map(b=>{
    const already = used.has(b.code);
    const dt = String(b.datetime||'').replace('T',' ');
    return `<div class="record-row" style="${already?'opacity:.55;':''}" data-code="${escapeHtml(b.code)}">
      <span class="chakra-dot" style="background:var(--pink);"></span>
      <div class="record-main">
        <div class="name-row">
          <span class="rname">${escapeHtml(b.name||'（無姓名）')}</span>
          ${already ? '<span class="example-flag">已建立過報告</span>' : ''}
          <span class="tag">${escapeHtml(b.serviceName||'未分類')}</span>
        </div>
        <div class="meta tnum">${escapeHtml(dt)} · ${escapeHtml(b.status||'')}</div>
      </div>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.record-row').forEach(row=>{
    row.addEventListener('click', ()=> applyBookingImport(row.dataset.code));
  });
}
function applyBookingImport(code){
  if(!_bookingRecordsCache) return;
  const b = _bookingRecordsCache.find(x=>String(x.code)===String(code));
  if(!b) return;
  const nameEl = document.getElementById('f_name');
  if(nameEl) nameEl.value = b.name || '';
  const emailEl = document.getElementById('f_email');
  if(emailEl && b.email) emailEl.value = b.email;
  if(b.datetime){
    const datePart = String(b.datetime).substring(0,10);
    const dateEl = document.getElementById('f_date');
    if(dateEl && datePart) dateEl.value = datePart;
  }
  if(b.serviceName){
    if(!state.programs.includes(b.serviceName)) savePrograms([...state.programs, b.serviceName]);
    const sel = document.getElementById('f_program');
    if(sel){
      if(![...sel.options].some(o=>o.value===b.serviceName)){
        const opt = document.createElement('option');
        opt.value = b.serviceName; opt.textContent = b.serviceName;
        sel.appendChild(opt);
      }
      sel.value = b.serviceName;
    }
  }
  state._importedBookingCode = b.code;
  closeBookingImport();
  toast('已帶入「'+(b.name||'')+'」的預約資料');
}

      <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="app.saveSettingsForm()"><span>儲存 AI 設定</span></button>

      <hr>
      <div class="subhead">${ICON.sync} 雲端同步（電腦手機共用資料）</div>
      <div class="field">
        <label>同步網址（Apps Script /exec 網址）</label>
        <input type="text" id="s_cloudUrl" value="${escapeHtml(s.cloudSyncUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="field">
        <label>同步密碼</label>
        <div class="apikey-row">
          <input type="password" id="s_cloudPassword" value="${escapeHtml(s.cloudSyncPassword)}" placeholder="自己設定的同步密碼">
          <button type="button" class="icon-btn" id="cloudPwToggle" onclick="app.toggleCloudPwVisible()">${ICON.eye}</button>
        </div>
      </div>
      <div class="hint">${cloudStatusText()}</div>
      <div class="backup-row">
        <button class="btn btn-primary btn-sm" style="flex:1;" onclick="app.saveSettingsForm()">${ICON.sync}<span>儲存並立即同步</span></button>
        <button class="btn btn-secondary btn-sm" onclick="app.syncNow({manual:true})">${ICON.sync}<span>立即同步</span></button>
      </div>
      <div class="hint">電腦跟手機都填一樣的網址跟密碼，之後新增、修改、刪除紀錄都會自動同步到雲端，兩邊打開都會抓到最新資料，不用再手動匯出匯入備份。密碼只會存在這台裝置。</div>

      <hr>
      <div class="subhead">${ICON.sync} 串接預約系統</div>
      <div class="field">
        <label>預約系統網址（Apps Script /exec 網址）</label>
        <input type="text" id="s_bookingUrl" value="${escapeHtml(s.bookingApiUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="field">
        <label>後台密碼</label>
        <div class="apikey-row">
          <input type="password" id="s_bookingPassword" value="${escapeHtml(s.bookingPassword)}" placeholder="跟預約系統後台登入密碼相同">
          <button type="button" class="icon-btn" id="bookingPwToggle" onclick="app.toggleBookingPwVisible()">${ICON.eye}</button>
        </div>
        <div class="hint">填好後，新增諮詢時可以按「從預約系統匯入客戶資料」，直接把 Google 表單裡狀態為「已完成」的預約資料帶進來，不用手動重打一次。密碼只會存在這台裝置。</div>
      </div>
      <button class="btn btn-secondary" style="width:100%; justify-content:center;" onclick="app.saveSettingsForm()"><span>儲存串接設定</span></button>

      <hr>
      <div class="subhead">諮詢方案管理</div>
      <div class="chip-wrap" id="programChips">${programChipsHtml()}</div>
      <div class="add-row">
        <input type="text" id="s_newProgram" placeholder="新增方案名稱，例如：能量地基七日課" onkeydown="if(event.key==='Enter'){event.preventDefault(); app.addProgramFromSettings();}">
        <button type="button" class="icon-btn" title="新增" onclick="app.addProgramFromSettings()">${ICON.plus}</button>
      </div>
      <div class="hint">這裡的方案會出現在新增諮詢表單的下拉選單裡，可依照妳前台實際的方案項目調整。</div>

      <hr>
      <div class="subhead">資料備份</div>
      <div class="backup-row">
        <button class="btn btn-secondary btn-sm" onclick="app.exportBackup()">${ICON.download}<span>匯出備份檔</span></button>
        <button class="btn btn-secondary btn-sm file-btn"><input type="file" accept="application/json" onchange="app.importBackup(this.files[0])">${ICON.upload}<span>匯入備份檔</span></button>
      </div>
      <div class="hint">若下載按鈕沒反應，可以改用文字複製備份，需要時再貼回匯入欄位。<button type="button" class="text-toggle-btn" id="backupTextToggle" onclick="app.toggleBackupText()">顯示文字備份</button></div>
      <textarea class="backup-text" id="backupTextArea" readonly onclick="this.select()" style="display:none;">${escapeHtml(JSON.stringify({records:state.records, settings:backupSafeSettings()}))}</textarea>
      <div class="hint">為了安全，備份不會包含 Claude API Key 跟預約系統密碼，換裝置後這兩個要重新到設定裡貼一次。</div>

      <div class="danger-zone">
        <div class="subhead" style="color:#B5564A;">危險區域</div>
        <button class="btn btn-danger btn-sm" onclick="app.wipeAll()">${ICON.trash}<span>清除全部資料</span></button>
      </div>
    </div>
  </div>`;
}
function saveSettingsForm(){
  const s = {
    brandName: document.getElementById('s_brand').value.trim() || DEFAULT_SETTINGS.brandName,
    igHandle: document.getElementById('s_ig').value.trim(),
    closing: document.getElementById('s_closing').value.trim() || DEFAULT_SETTINGS.closing,
    apiKey: document.getElementById('s_apikey').value.trim(),
    aiModel: document.getElementById('s_model').value || DEFAULT_SETTINGS.aiModel,
    bookingApiUrl: document.getElementById('s_bookingUrl').value.trim(),
    bookingPassword: document.getElementById('s_bookingPassword').value,
    cloudSyncUrl: document.getElementById('s_cloudUrl').value.trim(),
    cloudSyncPassword: document.getElementById('s_cloudPassword').value
  };
  const cloudChanged = s.cloudSyncUrl !== state.settings.cloudSyncUrl || s.cloudSyncPassword !== state.settings.cloudSyncPassword;
  // 剛填/改雲端網址或密碼時，先不要把這台裝置目前的設定推上雲端，避免蓋掉雲端上已經有的真正資料，
  // 交給接下來的 syncNow() 先拉一次雲端資料，用比較新的那份為準
  saveSettings(s, {skipPush: cloudChanged, keepTimestamp: cloudChanged});
  toast('設定已儲存');
  closeModal();
  if(s.cloudSyncUrl && cloudChanged) syncNow({manual:true});
}
function toggleApiKeyVisible(){
  const input = document.getElementById('s_apikey');
  const btn = document.getElementById('apikeyToggle');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? ICON.eye : ICON.eyeOff;
}
function toggleBookingPwVisible(){
  const input = document.getElementById('s_bookingPassword');
  const btn = document.getElementById('bookingPwToggle');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? ICON.eye : ICON.eyeOff;
}
function toggleCloudPwVisible(){
  const input = document.getElementById('s_cloudPassword');
  const btn = document.getElementById('cloudPwToggle');
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? ICON.eye : ICON.eyeOff;
}
function backupSafeSettings(){
  const s = Object.assign({}, state.settings);
  delete s.apiKey;
  delete s.bookingPassword;
  delete s.cloudSyncPassword;
  return s;
}
function toggleBackupText(){
  const ta = document.getElementById('backupTextArea');
  const btn = document.getElementById('backupTextToggle');
  if(!ta) return;
  const showing = ta.style.display !== 'none';
  ta.style.display = showing ? 'none' : 'block';
  if(btn) btn.textContent = showing ? '顯示文字備份' : '隱藏文字備份';
}
function exportBackup(){
  const payload = JSON.stringify({records:state.records, settings:backupSafeSettings(), exportedAt:new Date().toISOString()}, null, 2);
  try{
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lovetalker-reports-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('已匯出備份檔');
  }catch(e){
    console.warn(e);
    toast('自動下載失敗，請用下方文字框手動複製備份');
  }
}
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const recs = Array.isArray(data.records) ? data.records : (Array.isArray(data) ? data : null);
      if(!recs) throw new Error('格式錯誤');
      confirmDialog('匯入將會「合併」備份資料與目前資料（相同 ID 以備份為準）。確定要匯入嗎？', ()=>{
        const map = new Map(state.records.map(r=>[r.id, r]));
        recs.forEach(r=>{ if(r && r.id) map.set(r.id, r); });
        saveRecords(Array.from(map.values()));
        if(data.settings){
          // 備份不包含 API Key／後台密碼（安全考量），合併時保留這台裝置目前已存的值，不會被清空
          saveSettings(Object.assign({}, DEFAULT_SETTINGS, data.settings, {
            apiKey: state.settings.apiKey,
            bookingPassword: state.settings.bookingPassword,
            cloudSyncPassword: state.settings.cloudSyncPassword
          }));
        }
        toast('已匯入備份資料');
        closeModal();
        render();
      });
    }catch(e){
      toast('匯入失敗，檔案格式不正確');
    }
  };
  reader.readAsText(file);
}
function wipeAll(){
  const cloudNote = state.settings.cloudSyncUrl ? '（已開啟雲端同步：這裡只會清除這台裝置的暫存，雲端上的資料不會被刪除，清除後會自動重新同步回來）' : '';
  confirmDialog(`這會刪除所有客戶報告資料，且無法復原。建議先匯出備份。確定要清除嗎？${cloudNote}`, ()=>{
    savePending([]);
    saveRecords([]);
    toast('資料已清除');
    closeModal();
    go('dashboard');
    if(state.settings.cloudSyncUrl) syncNow();
  });
}

/* ============ Confirm modal ============ */
function confirmDialog(message, onConfirm){
  const root = document.getElementById('modalRoot');
  const holder = document.createElement('div');
  holder.innerHTML = `<div class="overlay">
    <div class="modal confirm-modal">
      <p>${message}</p>
      <div class="actions">
        <button class="btn btn-secondary" id="cd_cancel">取消</button>
        <button class="btn btn-primary" id="cd_ok" style="background:#B5564A;">確定</button>
      </div>
    </div>
  </div>`;
  root.appendChild(holder);
  holder.querySelector('#cd_cancel').onclick = ()=>root.removeChild(holder);
  holder.querySelector('#cd_ok').onclick = ()=>{ root.removeChild(holder); onConfirm(); };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ============ Render dispatch ============ */
function render(){
  renderTabs();
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='list') renderList();
  else if(state.view==='form') renderForm();
  else if(state.view==='report') renderReport();
  document.getElementById('fab').style.display = state.view==='form' ? 'none' : 'flex';
}

/* ============ Init ============ */
document.getElementById('settingsBtn').innerHTML = ICON.gear;
updateSyncBtn();
applyTheme();
render();
if(state.settings.cloudSyncUrl) syncNow();

/* ============ Public API ============ */
window.app = {
  go, showForm, editRecord, deleteRecord, clearExamples, viewReport,
  copyReportText, exportImage, submitForm, saveDraft, updateChakraPreview,
  setSearch, setFilterProgram, setFilterChakra, toggleSort,
  openSettings, saveSettingsForm, exportBackup, importBackup, wipeAll, toggleBackupText,
  closeModal, cycleTheme, runAiSummarize, clearAiFresh, toggleApiKeyVisible,
  addProgramInline, addProgramFromSettings, removeProgram,
  openBookingImport, closeBookingImport, applyBookingImport, toggleBookingPwVisible,
  syncNow, toggleCloudPwVisible
};

})();
</script>
