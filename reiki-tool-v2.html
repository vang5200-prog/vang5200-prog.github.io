lumns:66px 1fr;gap:8px}.preview{width:66px;height:66px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}.mini{display:grid;grid-template-columns:1fr 90px;gap:7px;margin-top:7px}.switchrow{display:flex;justify-content:space-between;align-items:center}.switch{width:48px;height:27px;position:relative}.switch input{opacity:0}.slider{position:absolute;inset:0;border-radius:20px;background:#d9d5d0}.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}.switch input:checked+.slider{background:var(--sage)}.switch input:checked+.slider:before{transform:translateX(21px)}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.result{margin-top:14px;padding:18px;text-align:center;border-radius:16px;background:var(--light-blue);border:1px solid var(--soft-blue)}.result .big{font-size:31px;font-weight:700;color:var(--blue)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left}.customrow{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fcfaf8;margin:8px 0}.customhead{display:flex;gap:7px}.customhead input{flex:1}.modal{display:none;position:fixed;inset:0;background:#37352f99;z-index:50;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.modalbox{background:#fff;padding:12px;border-radius:15px;position:relative;max-width:850px;max-height:90vh}.modalbox img{max-width:100%;max-height:80vh}.close{position:absolute;right:8px;top:8px;border:0;border-radius:50%;background:#fff;width:35px;height:35px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--dark);color:#fff;border-radius:10px;padding:9px 14px;z-index:60;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}.list.twocol{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.app{padding:13px 11px 45px}.detail-name{font-size:25px}.mini{grid-template-columns:1fr}.footer{position:sticky;bottom:0;background:#fafaf8f5;padding:9px 0}}

(()=>{const K='reikiMethodTool.v2',OLD='reikiMethodTool.v1';let S=load(),V='home',sel=null,draft=null,q='';const A=document.getElementById('app');const uid=()=>crypto.randomUUID?crypto.randomUUID():'i'+Date.now()+Math.random().toString(36).slice(2),now=()=>new Date().toISOString(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cp=x=>JSON.parse(JSON.stringify(x));function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}async function image(file){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),m=Math.min(1,1000/Math.max(im.width,im.height));c.width=im.width*m;c.height=im.height*m;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.86))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}function step(t){let c=t==='symbol'?{symbols:[]}:(t==='purification'?{enabled:true,method:''}:{text:''});return{id:uid(),type:t,content:c}}function reiki(){return{id:uid(),name:'',openingDeclaration:'我現在使用靈氣來為***做靈氣療癒',openingRepeat:3,handsRaised:'我就是光、光就是我',handsRepeat:3,steps:[],closing:'感恩宇宙能量',notes:'',noteImages:[]}}function normR(r){return{...reiki(),...r,id:r.id||uid(),openingRepeat:+r.openingRepeat||3,handsRepeat:+r.handsRepeat||3,noteImages:Array.isArray(r.noteImages)?r.noteImages:[],steps:(r.steps||[]).map(s=>{let t=['chant','symbol','purification','handTechnique','other'].includes(s.type)?s.type:'chant';if(t==='symbol')return{id:s.id||uid(),type:t,content:{symbols:(s.content?.symbols||[]).map(x=>({name:x.name||'',imageData:x.imageData||'',activation:x.activation||'',repeatCount:+x.repeatCount||(+s.content?.repeatCount||1)}))}};if(t==='purification')return{id:s.id||uid(),type:t,content:{enabled:s.content?.enabled!==false,method:s.content?.method||''}};return{id:s.id||uid(),type:t,content:{text:s.content?.text||''}}})}}function load(){try{let x=JSON.parse(localStorage.getItem(K)||'');if(x)return norm(x)}catch{}try{let x=JSON.parse(localStorage.getItem(OLD)||'');if(x)return norm(x)}catch{}return norm({})}function norm(x){return{version:2,reiki:(x.reiki||x.records||[]).map(normR),chakras:x.chakras||[],crystals:x.crystals||[],symbols:x.symbols||[],custom:x.custom||[]}}function save(){try{localStorage.setItem(K,JSON.stringify(S));return 1}catch{toast('儲存失敗：瀏覽器空間可能不足');return 0}}function top(){return`<div class="top"><div><div class="brand">身心靈工具箱</div><div class="sub">我的療癒資料庫與工具</div></div><button class="btn" id="home">⌂ 首頁</button></div>`}function bindHome(){document.getElementById('home').onclick=()=>{V='home';q='';render()}}function home(){A.innerHTML=`${top()}<div class="search"><span>⌕</span><input id="g" placeholder="快速搜尋靈氣法、水晶、脈輪、符號……" value="${esc(q)}"></div><h1 class="title">身心靈工具箱</h1><p class="desc">快速查詢、整理與使用你的療癒資料。</p><div class="grid"><button class="module" data-v="reiki"><div class="module-icon">🌿</div><div class="module-name">靈氣</div><div class="module-desc">靈氣法與使用步驟</div></button><button class="module" data-v="yi"><div class="module-icon">☯️</div><div class="module-name">易經</div><div class="module-desc">卦爻計算器</div></button><button class="module" data-v="chakra"><div class="module-icon">🌀</div><div class="module-name">七大脈輪</div><div class="module-desc">脈輪資料與圖片</div></button><button class="module" data-v="crystal"><div class="module-icon">💎</div><div class="module-name">水晶</div><div class="module-desc">代表意義與作用</div></button><button class="module" data-v="symbol"><div class="module-icon">🔯</div><div class="module-name">符號</div><div class="module-desc">意義、作用與圖片</div></button><button class="module" data-v="cats"><div class="module-icon">＋</div><div class="module-name">新增其他</div><div class="module-desc">完全自訂資料分類</div></button></div><div class="actions" style="margin-top:18px"><button class="btn" id="export">↥ 匯出完整備份</button><label class="btn" style="cursor:pointer">↧ 匯入備份<input id="import" type="file" accept=".json,application/json" hidden></label></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{V=b.dataset.v;render()});document.getElementById('export').onclick=exportData;document.getElementById('import').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);document.getElementById('g').oninput=e=>{q=e.target.value;if(q){V='reiki';render()}}}function reikiList(){let a=S.reiki.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 回首頁</button><button class="primary" id="new">＋ 新增靈氣法</button></div><div class="search"><span>⌕</span><input id="rq" value="${esc(q)}" placeholder="搜尋靈氣法名稱"></div><div class="section-head"><b>所有靈氣法</b><span class="muted">${a.length} 筆</span></div><div class="list twocol">${a.length?a.map(x=>`<button class="card" data-id="${x.id}"><div class="card-title">${esc(x.name)}</div><div class="sub">${x.steps.length} 個可排序步驟</div></button>`).join(''):`<div class="empty">找不到符合的靈氣法</div>`}</div>`;bindHome();document.getElementById('back').onclick=()=>{V='home';q='';render()};document.getElementById('new').onclick=()=>{draft=reiki();V='reikiEdit';render()};document.getElementById('rq').oninput=e=>{q=e.target.value;reikiList();document.getElementById('rq').focus()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sel=b.dataset.id;V='reikiDetail';render()})}function rDetail(){let r=S.reiki.find(x=>x.id===sel);if(!r)return V='reiki';A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 靈氣清單</button><div class="actions"><button class="btn" id="edit">編輯</button><button class="danger" id="del">刪除</button></div></div><div class="eyebrow">使用的靈氣法為</div><div class="detail-name">${esc(r.name)}</div><div class="read"><div class="label">① 合掌 → 宣告</div><div class="content">${esc(r.openingDeclaration)}</div><div class="repeat">${r.openingRepeat} 次</div></div><div class="read"><div class="label">② 高舉雙手</div><div class="content">${esc(r.handsRaised)}</div><div class="repeat">念 ${r.handsRepeat} 次</div></div>${r.steps.map((s,i)=>readStep(s,i+3)).join('')}<div class="read"><div class="label">合掌結束</div><div class="content">${esc(r.closing)}</div></div>${r.notes||r.noteImages.length?`<div class="read notes"><div class="label">備注</div><div class="content">${esc(r.notes)}</div>${imgs(r.noteImages)}</div>`:''}`;document.getElementById('back').onclick=()=>{V='reiki';render()};document.getElementById('edit').onclick=()=>{draft=cp(r);V='reikiEdit';render()};document.getElementById('del').onclick=()=>{if(confirm('確定刪除？')){S.reiki=S.reiki.filter(x=>x.id!==r.id);save();V='reiki';render()}};zoomBind()}function imgs(a){return a.length?`<div class="images">${a.map(x=>`<img class="gallery" data-z="${esc(x)}" src="${esc(x)}">`).join('')}</div>`:''}function readStep(s,n){let name={chant:'念達法',symbol:'符號',purification:'淨化',handTechnique:'手法',other:'其他'}[s.type],body='';if(s.type==='purification'&&!s.content.enabled)return'';if(s.type==='symbol')body=`<div class="symbol-row">${s.content.symbols.map(x=>`<div class="symbol"><img src="${esc(x.imageData)}" data-z="${esc(x.imageData)}"><div class="symbol-info"><b>${esc(x.name)}</b><br>${esc(x.activation)}<br>${x.repeatCount} 次</div></div>`).join('')}</div>`;else body=`<div class="content">${esc(s.type==='purification'?s.content.method:s.content.text)}</div>`;return`<div class="read"><div class="label">${n}　${name}</div>${body}</div>`}function rEdit(){let r=draft;A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="cancel">← 返回</button><b>${S.reiki.some(x=>x.id===r.id)?'編輯':'新增'}靈氣法</b></div><div class="form"><div class="field"><label>靈氣法名稱 *</label><input id="rn" value="${esc(r.name)}"></div><div class="field"><label>合掌 → 宣告</label><textarea id="od">${esc(r.openingDeclaration)}</textarea><div class="repeat-fixed">固定 3 次</div></div><div class="field"><label>高舉雙手</label><textarea id="hr">${esc(r.handsRaised)}</textarea><div class="repeat-fixed">固定念 3 次</div></div></div><div class="section-head"><b>可排序步驟</b><span class="muted">拖曳 ⋮⋮</span></div><div id="steps" class="steps">${r.steps.map((s,i)=>editStep(s,i)).join('')}</div><div class="add"><button data-add="chant">＋念達法</button><button data-add="symbol">＋符號</button><button data-add="purification">＋淨化</button><button data-add="handTechnique">＋手法</button><button data-add="other">＋其他</button></div><div class="form" style="margin-top:16px"><div class="field"><label>合掌結束</label><textarea id="cl">${esc(r.closing)}</textarea></div><div class="field"><label>備注</label><textarea id="nt">${esc(r.notes)}</textarea></div><div class="field"><label>備注圖片</label><label class="btn" style="display:inline-block;cursor:pointer">📷 上傳圖片<input id="nf" type="file" accept="image/*" multiple hidden></label>${imgs(r.noteImages)}</div></div><div class="footer"><button class="btn" id="cancel2">取消</button><button class="primary" id="save">儲存</button></div>`;document.getElementById('cancel').onclick=cancelEdit;document.getElementById('cancel2').onclick=cancelEdit;document.getElementById('save').onclick=saveR;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{syncR();r.steps.push(step(b.dataset.add));rEdit()});document.getElementById('nf').onchange=async e=>{syncR();for(let f of e.target.files)try{r.noteImages.push(await image(f))}catch{}rEdit()};bindStep();zoomBind()}function editStep(s,i){let title={chant:'念達法',symbol:'符號',purification:'淨化',handTechnique:'手法',other:'其他'}[s.type],b='';if(['chant','handTechnique','other'].includes(s.type))b=`<textarea data-text="${s.id}">${esc(s.content.text)}</textarea>`;if(s.type==='purification')b=`<div class="switchrow"><span>需要淨化</span><label class="switch"><input data-p="${s.id}" type="checkbox" ${s.content.enabled?'checked':''}><span class="slider"></span></label></div><div class="${s.content.enabled?'':'hidden'}" data-pm="${s.id}" style="margin-top:9px"><label>淨化方式</label><textarea data-pt="${s.id}">${esc(s.content.method)}</textarea></div>`;if(s.type==='symbol')b=`${s.content.symbols.map((x,j)=>`<div class="symbol-edit"><div class="symbol-row-edit">${x.imageData?`<img class="preview" src="${esc(x.imageData)}">`:`<div class="preview"></div>`}<div><input data-sn="${s.id}" data-i="${j}" value="${esc(x.name)}" placeholder="符號名稱"><div class="mini"><input data-sa="${s.id}" data-i="${j}" value="${esc(x.activation)}" placeholder="啟動方式"><input data-sr="${s.id}" data-i="${j}" type="number" min="1" value="${x.repeatCount}"></div><label class="btn" style="display:inline-block;margin-top:7px;cursor:pointer">📷 ${x.imageData?'更換':'上傳'}圖片<input data-sf="${s.id}" data-i="${j}" type="file" accept="image/*" hidden></label></div></div><div style="text-align:right"><button class="danger" data-sd="${s.id}" data-i="${j}">刪除符號</button></div></div>`).join('')}<button class="btn" data-as="${s.id}">＋新增符號</button>`;return`<div class="step" data-step="${s.id}"><div class="stephead"><span class="handle" data-h="${s.id}">⋮⋮</span><strong>${i+1}. ${title}</strong><button class="danger" data-d="${s.id}">刪除</button></div><div class="stepbody">${b}</div></div>`}function syncR(){let r=draft;r.name=document.getElementById('rn')?.value.trim()??r.name;r.openingDeclaration=document.getElementById('od')?.value??r.openingDeclaration;r.openingRepeat=3;r.handsRaised=document.getElementById('hr')?.value??r.handsRaised;r.handsRepeat=3;r.closing=document.getElementById('cl')?.value??r.closing;r.notes=document.getElementById('nt')?.value??r.notes;document.querySelectorAll('[data-text]').forEach(e=>{let s=r.steps.find(x=>x.id===e.dataset.text);if(s)s.content.text=e.value});document.querySelectorAll('[data-p]').forEach(e=>{let s=r.steps.find(x=>x.id===e.dataset.p);if(s)s.content.enabled=e.checked});document.querySelectorAll('[data-pt]').forEach(e=>{let s=r.steps.find(x=>x.id===e.dataset.pt);if(s)s.content.method=e.value});document.querySelectorAll('[data-sn]').forEach(e=>{let s=r.steps.find(x=>x.id===e.dataset.sn);s.content.symbols[+e.dataset.i].name=e.value});document.querySelectorAll('[data-sa]').forEach(e=>{let s=r.steps.find(x=>x.id===e.dataset.sa);s.content.symbols[+e.dataset.i].activation=e.value});document.querySelectorAll('[data-sr]').forEach(e=>{let s=r.steps.find(x=>x.id===e.dataset.sr);s.content.symbols[+e.dataset.i].repeatCount=+e.value||1})}function bindStep(){document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{syncR();draft.steps=draft.steps.filter(x=>x.id!==b.dataset.d);rEdit()});document.querySelectorAll('[data-as]').forEach(b=>b.onclick=()=>{syncR();draft.steps.find(x=>x.id===b.dataset.as).content.symbols.push({name:'',imageData:'',activation:'',repeatCount:1});rEdit()});document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{syncR();let s=draft.steps.find(x=>x.id===b.dataset.sd);s.content.symbols.splice(+b.dataset.i,1);rEdit()});document.querySelectorAll('[data-p]').forEach(b=>b.onchange=()=>{syncR();rEdit()});document.querySelectorAll('[data-sf]').forEach(b=>b.onchange=async()=>{let f=b.files[0];if(!f)return;syncR();let s=draft.steps.find(x=>x.id===b.dataset.sf);s.content.symbols[+b.dataset.i].imageData=await image(f);rEdit()});document.querySelectorAll('[data-h]').forEach(h=>h.onpointerdown=e=>dragStart(e,h))}function dragStart(e,h){e.preventDefault();let c=h.closest('.step'),list=document.getElementById('steps');c.classList.add('drag');let move=ev=>{let cards=[...list.querySelectorAll('.step:not(.drag)')],before=null;for(let x of cards){let r=x.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){before=x;break}}before?list.insertBefore(c,before):list.appendChild(c)};let up=()=>{document.removeEventListener('pointermove',move);syncR();let ids=[...list.querySelectorAll('.step')].map(x=>x.dataset.step);draft.steps.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));c.classList.remove('drag');rEdit();toast('步驟順序已更新')};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true})}function cancelEdit(){if(confirm('尚未儲存的修改會被捨棄，確定返回？')){V=sel?'reikiDetail':'reiki';render()}}function saveR(){syncR();if(!draft.name){toast('請輸入靈氣法名稱');return}let i=S.reiki.findIndex(x=>x.id===draft.id);if(i<0)S.reiki.push(cp(draft));else S.reiki[i]=cp(draft);save();sel=draft.id;V='reikiDetail';render();toast('已儲存')}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='身心靈工具箱備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('備份已匯出')}async function importData(file){if(!confirm('匯入備份會取代目前資料，確定繼續？'))return;try{let x=JSON.parse(await file.text()),n=norm(x);if(!Array.isArray(n.reiki))throw 0;S=n;if(!save())throw 0;render();toast('備份已匯入')}catch{toast('匯入失敗，原資料未被覆蓋')}}const types={chakra:{title:'七大脈輪',icon:'🌀',arr:'chakras',fields:[['name','脈輪'],['organ','器官'],['events','相關的思想與情感事件'],['disorders','生理機能障礙'],['lesson','課題'],['color','氣場顏色']]},crystal:{title:'水晶',icon:'💎',arr:'crystals',fields:[['name','水晶名稱'],['meaning','代表意義'],['effect','作用']]},symbol:{title:'符號',icon:'🔯',arr:'symbols',fields:[['name','符號名稱'],['meaning','代表意義'],['effect','作用']]}};function kList(t){let k=types[t],a=S[k.arr].filter(x=>(x.name||'').toLowerCase().includes(q.toLowerCase()));A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 回首頁</button><button class="primary" id="new">＋新增</button></div><div class="search"><span>⌕</span><input id="kq" value="${esc(q)}" placeholder="搜尋${k.title}"></div><div class="section-head"><b>${k.icon} ${k.title}</b><span class="muted">${a.length} 筆</span></div><div class="list twocol">${a.length?a.map(x=>`<button class="card" data-k="${x.id}"><div class="card-title">${esc(x.name)}</div></button>`).join(''):`<div class="empty">還沒有資料。</div>`}</div>`;bindHome();document.getElementById('back').onclick=()=>{V='home';q='';render()};document.getElementById('new').onclick=()=>{draft={id:uid(),name:'',images:[]};k.fields.forEach(f=>draft[f[0]]='');draft._type=t;V='kedit';render()};document.getElementById('kq').oninput=e=>{q=e.target.value;kList(t);document.getElementById('kq').focus()};document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{draft=cp(S[k.arr].find(x=>x.id===b.dataset.k));draft._type=t;V='kedit';render()})}function kEdit(){let t=draft._type,k=types[t];A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 返回</button><b>${k.title}</b></div><div class="form">${k.fields.map(f=>`<div class="field"><label>${f[1]}</label><textarea id="f_${f[0]}">${esc(draft[f[0]])}</textarea></div>`).join('')}<div class="field"><label>圖片</label><label class="btn" style="display:inline-block;cursor:pointer">📷 上傳圖片<input id="kf" type="file" accept="image/*" multiple hidden></label>${imgs(draft.images||[])}</div></div><div class="footer"><button class="btn" id="cancel">取消</button><button class="primary" id="save">儲存</button></div>`;document.getElementById('back').onclick=()=>{V=t;render()};document.getElementById('cancel').onclick=()=>{V=t;render()};document.getElementById('save').onclick=()=>{k.fields.forEach(f=>draft[f[0]]=document.getElementById('f_'+f[0]).value);if(!draft.name.trim())return toast('請填寫名稱');delete draft._type;let a=S[k.arr],i=a.findIndex(x=>x.id===draft.id);if(i<0)a.push(cp(draft));else a[i]=cp(draft);save();V=t;render();toast('已儲存')};document.getElementById('kf').onchange=async e=>{draft.images=draft.images||[];for(let f of e.target.files)try{draft.images.push(await image(f))}catch{}kEdit()};zoomBind()}const G=[['乾','☰',1],['兌','☱',2],['離','☲',3],['震','☳',4],['巽','☴',5],['坎','☵',6],['艮','☶',7],['坤','☷',8]],T=[['子',1],['丑',2],['寅',3],['卯',4],['辰',5],['巳',6],['午',7],['未',8],['申',9],['酉',10],['戌',11],['亥',12]];function yi(){A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 回首頁</button></div><h1 class="title">☯️ 易經・卦爻計算器</h1><p class="desc">上卦＋下卦＋當下時辰 ÷ 6，取餘數。</p><div class="form"><div class="field"><label>上卦</label><select id="u"><option value="">請選擇</option>${G.map(x=>`<option value="${x[2]}">${x[0]} ${x[1]}｜${x[2]}</option>`).join('')}</select></div><div class="field"><label>下卦</label><select id="d"><option value="">請選擇</option>${G.map(x=>`<option value="${x[2]}">${x[0]} ${x[1]}｜${x[2]}</option>`).join('')}</select></div><div class="field"><label>當下時辰</label><select id="t"><option value="">請選擇</option>${T.map(x=>`<option value="${x[1]}">${x[0]}｜${x[1]}</option>`).join('')}</select></div><button class="primary" id="calc" style="width:100%">開始計算</button></div><div id="res"></div><div class="form"><b>餘數對照</b><table><tr><th>餘數</th><th>結果</th></tr><tr><td>1</td><td>初卦</td></tr><tr><td>2</td><td>二卦</td></tr><tr><td>3</td><td>三卦</td></tr><tr><td>4</td><td>四卦</td></tr><tr><td>5</td><td>五卦</td></tr><tr><td>0</td><td>上卦</td></tr></table></div>`;document.getElementById('back').onclick=()=>{V='home';render()};document.getElementById('calc').onclick=()=>{let a=+u.value,b=+d.value,t=+document.getElementById('t').value;if(!a||!b||!t)return toast('請選擇上卦、下卦與時辰');let total=a+b+t,r=total%6,res=['上卦','初卦','二卦','三卦','四卦','五卦'][r];document.getElementById('res').innerHTML=`<div class="result"><div>${a} ＋ ${b} ＋ ${t} ＝ <b>${total}</b></div><div>${total} ÷ 6 → 餘 <b>${r}</b></div><div class="big">${res}</div></div>`}}function cats(){A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 回首頁</button><button class="primary" id="new">＋新增分類</button></div><h1 class="title">＋新增其他</h1><p class="desc">建立完全自由的資料分類。</p><div class="list">${S.custom.length?S.custom.map(c=>`<button class="card" data-c="${c.id}"><div class="card-title">${esc(c.name)}</div><div class="sub">${c.items.length} 筆資料</div></button>`).join(''):`<div class="empty">例如：精油、穴位、五行……都可以自己建立。</div>`}</div>`;document.getElementById('back').onclick=()=>{V='home';render()};document.getElementById('new').onclick=()=>{draft={id:uid(),name:'',items:[]};V='catNew';render()};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{sel=b.dataset.c;V='catList';render()})}function catNew(){A.innerHTML=`${top()}<div class="form"><label>分類名稱</label><input id="cn"><div class="footer"><button class="btn" id="x">取消</button><button class="primary" id="s">建立分類</button></div></div>`;document.getElementById('x').onclick=()=>{V='cats';render()};document.getElementById('s').onclick=()=>{let n=document.getElementById('cn').value.trim();if(!n)return toast('請輸入分類名稱');S.custom.push({id:draft.id,name:n,items:[]});save();sel=draft.id;V='catList';render()}}function catList(){let c=S.custom.find(x=>x.id===sel);A.innerHTML=`${top()}<div class="toolbar"><button class="back" id="back">← 分類</button><button class="primary" id="new">＋新增資料</button></div><h1 class="title">${esc(c.name)}</h1><div class="list">${c.items.length?c.items.map(x=>`<button class="card" data-ci="${x.id}"><div class="card-title">${esc(x.name)}</div><div class="sub">${x.fields.length} 個自訂欄位</div></button>`).join(''):`<div class="empty">還沒有資料。</div>`}</div>`;document.getElementById('back').onclick=()=>{V='cats';render()};document.getElementById('new').onclick=()=>{draft={id:uid(),name:'',fields:[],images:[]};V='catEdit';render()};document.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{draft=cp(c.items.find(x=>x.id===b.dataset.ci));V='catEdit';render()})}function catEdit(){A.innerHTML=`${top()}<div class="form"><div class="field"><label>名稱</label><input id="n" value="${esc(draft.name)}"></div><label>自訂欄位</label><div id="fields">${draft.fields.map((f,i)=>`<div class="customrow"><div class="customhead"><input data-fn="${i}" value="${esc(f.name)}" placeholder="欄位名稱"><button class="danger" data-fd="${i}">刪除</button></div><textarea data-fv="${i}" style="margin-top:7px" placeholder="內容">${esc(f.value)}</textarea></div>`).join('')}</div><button class="btn" id="af">＋新增自訂欄位</button><div class="field" style="margin-top:17px"><label>圖片</label><label class="btn" style="display:inline-block;cursor:pointer">📷 上傳圖片<input id="cf" type="file" accept="image/*" multiple hidden></label>${imgs(draft.images||[])}</div></div><div class="footer"><button class="btn" id="x">取消</button><button class="primary" id="s">儲存</button></div>`;document.getElementById('x').onclick=()=>{V='catList';render()};document.getElementById('af').onclick=()=>{syncCat();draft.fields.push({name:'',value:''});catEdit()};document.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>{syncCat();draft.fields.splice(+b.dataset.fd,1);catEdit()});document.getElementById('cf').onchange=async e=>{syncCat();draft.images=draft.images||[];for(let f of e.target.files)try{draft.images.push(await image(f))}catch{}catEdit()};document.getElementById('s').onclick=saveCat}function syncCat(){draft.name=document.getElementById('n')?.value??draft.name;document.querySelectorAll('[data-fn]').forEach(e=>draft.fields[+e.dataset.fn].name=e.value);document.querySelectorAll('[data-fv]').forEach(e=>draft.fields[+e.dataset.fv].value=e.value)}function saveCat(){syncCat();if(!draft.name.trim())return toast('請輸入名稱');let c=S.custom.find(x=>x.id===sel),i=c.items.findIndex(x=>x.id===draft.id);if(i<0)c.items.push(cp(draft));else c.items[i]=cp(draft);save();V='catList';render();toast('已儲存')}function zoomBind(){document.querySelectorAll('[data-z]').forEach(x=>x.onclick=()=>{document.getElementById('modalImg').src=x.dataset.z;document.getElementById('modal').classList.add('open')})}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');function render(){if(V==='home')home();else if(V==='reiki')reikiList();else if(V==='reikiDetail')rDetail();else if(V==='reikiEdit')rEdit();else if(V==='yi')yi();else if(types[V])kList(V);else if(V==='kedit')kEdit();else if(V==='cats')cats();else if(V==='catNew')catNew();else if(V==='catList')catList();else if(V==='catEdit')catEdit()}render()})();
