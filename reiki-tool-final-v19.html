<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>笑笑的魔法書</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
--pink:#C9938A;--soft-pink:#E8C4BC;--light-pink:#F5E6E3;
--blue:#7A9BAD;--soft-blue:#B8CFDA;--light-blue:#E3EDF3;
--sage:#9AAE9B;--light-sage:#E8F0E8;
--cream:#FAF3EE;--bg:#FAFAF8;--dark:#37352F;--medium:#5A5248;--gray:#9B9A97;
--line:#E8E4DF;--white:#fff;--danger:#A65D59
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC",sans-serif;line-height:1.65}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:16px 14px 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.brand{font-weight:700;font-size:20px}.sub{font-size:12px;color:var(--gray)}
.btn,.ghost,.danger,.primary{border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:#fff;color:var(--medium)}
.primary{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:700}
.danger{background:#f8e9e7;color:var(--danger)}
.search{position:relative;margin:4px 0 18px}.search input{width:100%;height:52px;padding:0 16px 0 45px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:0}
.search span{position:absolute;left:15px;top:8px;font-size:22px;color:var(--gray)}
h1{font-size:26px;margin:4px 0 5px}h2{font-size:19px;margin:0 0 10px}h3{margin:0;font-size:17px}
.muted{color:var(--gray);font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.module,.card,.form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px #37352f08}
.module{text-align:left;min-height:112px;color:var(--dark);display:flex;flex-direction:column;justify-content:center;gap:5px}
.module b{font-size:18px}.module small{color:var(--gray)}
.module:nth-child(1){border-top:6px solid var(--pink)}.module:nth-child(2){border-top:6px solid var(--sage)}
.module:nth-child(3){border-top:6px solid #B5AFC7}.module:nth-child(4){border-top:6px solid #D8C8AD}
.module:nth-child(5){border-top:6px solid var(--soft-blue)}.module:nth-child(6){border-top:6px solid #C9B596}
.list{display:grid;gap:9px}.card-btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px}
.field{display:grid;gap:5px;margin-bottom:13px}.field label,label{font-weight:700;font-size:13px;color:var(--medium)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--dark)}
textarea{min-height:86px;resize:vertical}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.form{margin-bottom:12px}.section{margin:14px 0}.section-title{font-weight:700;margin-bottom:8px}
.step-list{display:grid;gap:9px}.step{border:1px dashed #cfc6bb;border-radius:13px;background:#fff;padding:10px}
.step.dragging{opacity:.45}.step-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.handle{font-size:20px;color:var(--gray);cursor:grab;touch-action:none}.step-head strong{flex:1}
.symbols{display:flex;gap:10px;overflow-x:auto;padding:4px 0 7px}.symbol-box{min-width:145px;width:145px;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fcfaf8}
.symbol-box img{width:100%;height:95px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);margin-bottom:7px}
.symbol-box .field{margin-bottom:7px}.symbol-box input{font-size:13px;padding:8px}
.addbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.addbar button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px}
.fixed-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}
.fixed-step .num{color:var(--pink);font-weight:700}.repeat{font-size:13px;color:var(--pink);font-weight:700}
.image-row{display:flex;gap:10px;overflow-x:auto;padding:5px 0}.image-wrap{min-width:110px}.thumb{width:110px;height:110px;object-fit:contain;background:var(--cream);border:1px solid var(--line);border-radius:10px}
.detail-label{font-size:13px;color:var(--pink);font-weight:700;margin-bottom:4px}.content{white-space:pre-wrap;word-break:break-word}
.use-step{background:#fff;border-left:4px solid var(--soft-pink);padding:11px 13px;border-radius:8px;margin:9px 0}
.gua-result{background:var(--light-blue);border:1px solid var(--soft-blue);border-radius:15px;padding:18px;text-align:center;margin-top:12px}.gua-result .big{font-size:29px;font-weight:700;color:var(--blue)}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.gallery{display:flex;gap:10px;overflow-x:auto}.gallery .thumb{min-width:110px}
.custom-row{border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0;background:#fcfaf8}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#37352fb8;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}.modal.open{display:flex}.modal img{max-width:95vw;max-height:85vh;background:#fff;border-radius:12px}.close{position:absolute;right:16px;top:16px;border:0;border-radius:50%;width:38px;height:38px;background:#fff;font-size:22px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.app{padding:25px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
@media(max-width:420px){.app{padding:13px 11px 40px}.toolbar{align-items:flex-start}.toolbar .primary,.toolbar .btn{padding:8px 10px}.module{min-height:100px}.symbol-box{min-width:135px;width:135px}}

.step .handle{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.step.dragging{opacity:.55}
.step .handle{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.step.dragging{opacity:.45}
.step-drag-placeholder{box-sizing:border-box}

.detail-sort-item{position:relative;margin-bottom:10px}
.detail-sort-item .use-step{margin-bottom:0}
.detail-sort-handle{display:flex;align-items:center;justify-content:center;width:34px;height:30px;margin:0 auto -4px;border-radius:8px;background:var(--light-pink);color:var(--pink);font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.detail-sort-item.dragging{opacity:.5}

.knowledge-list-item{display:flex;align-items:center;justify-content:space-between;gap:12px}
.knowledge-list-main{min-width:0;flex:1;text-align:left}
.knowledge-thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:0 0 64px}
.image-edit-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.image-edit-item{width:110px}
.image-edit-item img{width:110px;height:110px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.image-delete{width:100%;padding:7px 8px;font-size:.85rem}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal" id="modal"><button class="close" id="closeModal">×</button><img id="modalImg"></div>

<script>
(function(){
'use strict';
const KEY='spirit-toolbox-final-v1';
let store=load(), page='home', currentType='', currentId='', draft=null, search='';
const app=document.getElementById('app');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(store))}
function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('spirit-toolbox-v2')||'{}');
  return normalizeStore(raw);
 }catch(e){return emptyStore()}
}
function emptyStore(){return{version:3,reiki:[],chakras:[],crystals:[],symbols:[],customCategories:[]}}
function normalizeStore(raw){
 const src=raw.data||raw||{};
 const arr=(...keys)=>{for(const k of keys)if(Array.isArray(src[k]))return src[k];return[]};
 return{
  version:3,
  reiki:arr('reiki','靈氣','reikiRecords').map(normalizeReiki),
  chakras:arr('chakras','七大脈輪','chakra').map(x=>({...x,id:x.id||uid(),name:x.name||x.title||'',images:Array.isArray(x.images)?x.images:((x.image||x.img)?[x.image||x.img]:[])})),
  crystals:arr('crystals','水晶').map(x=>({...x,id:x.id||uid(),name:x.name||x.title||'',images:Array.isArray(x.images)?x.images:((x.image||x.img)?[x.image||x.img]:[])})),
  symbols:arr('symbols','符號').map(x=>({...x,id:x.id||uid(),name:x.name||x.title||'',images:Array.isArray(x.images)?x.images:((x.image||x.img)?[x.image||x.img]:[])})),
  customCategories:Array.isArray(src.customCategories)?src.customCategories.map(normalizeCustomCategory):[]
 }
}
function normalizeCustomCategory(c){return{id:c.id||uid(),name:c.name||'未命名分類',items:Array.isArray(c.items)?c.items:[]}}
function normalizeReiki(r){
 return{
  id:r.id||uid(),title:r.title||r.name||'未命名靈氣法',
  opening:r.opening||r.openingDeclaration||'我現在使用靈氣來為＿＿＿做靈氣療癒',
  hands:r.hands||r.handsRaised||'我就是光、光就是我',
  closing:r.closing||'感恩宇宙能量',
  note:r.note||r.notes||'',
  images:Array.isArray(r.images)?r.images:((r.image||r.img)?[r.image||r.img]:[]),
  steps:(Array.isArray(r.steps)?r.steps:[]).map(normalizeStep)
 }
}
function normalizeStep(s){
 const type=s.type==='symbol'?'symbols':(s.type||'other');
 return{
  id:s.id||uid(),type,
  sutra:s.sutra||s.text||'',method:s.method||s.technique||'',
  handPlacement:s.handPlacement||s.hands||'',
  purify:s.purify||s.answer||'否',
  symbols:(s.symbols||s.items||[]).map(x=>({id:x.id||uid(),name:x.name||x.title||'',image:x.image||x.img||'',activation:x.activation||x.method||'',count:Number(x.count||x.times||1)})),
  note:s.note||''
 }
}
function imageData(file,max=1100){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onerror=reject;
  r.onload=()=>{
   const im=new Image();
   im.onload=()=>{
    const scale=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',.86));
   };
   im.onerror=reject;im.src=r.result;
  };
  r.readAsDataURL(file);
 });
}
function openImage(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('open')}
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');

function top(back=true){
 return `<div class="top"><div><div class="brand">笑笑的魔法書</div><div class="sub">療癒資料與工具</div></div>${back?'<button type="button" class="ghost" id="homeBtn" onclick="window.__goHome()">⌂ 首頁</button>':''}</div>`;
}
function goHome(){page='home';search='';render()}
window.__goHome=function(){goHome()}
function render(){
 if(page==='home')home();
 else if(page==='reikiList')reikiList();
 else if(page==='reikiDetail')reikiDetail();
 else if(page==='reikiEdit')reikiEdit();
 else if(page==='iching')iching();
 else if(['chakras','crystals','symbols'].includes(page))knowledgeList(page);
 else if(page==='knowledgeDetail')knowledgeDetail();
 else if(page==='knowledgeEdit')knowledgeEdit();
 else if(page==='customCategories')customCategories();
 else if(page==='customList')customList();
 else if(page==='customEdit')customEdit();
}
function bindHome(){document.getElementById('homeBtn')?.addEventListener('click',goHome)}

function home(){
 page='home';
 app.innerHTML=top(false)+`
 <h1>首頁</h1>
 <div class="grid">
  <button class="module" data-module="reikiList"><b>🌿 靈氣</b><small>靈氣法與使用步驟</small></button>
  <button class="module" data-module="iching"><b>☯️ 易經</b><small>卦爻計算器</small></button>
  <button class="module" data-module="chakras"><b>🌀 七大脈輪</b><small>脈輪資料</small></button>
  <button class="module" data-module="crystals"><b>💎 水晶</b><small>水晶資料</small></button>
  <button class="module" data-module="symbols"><b>🔯 符號</b><small>符號資料</small></button>
  <button class="module" data-module="customCategories"><b>＋新增其他</b><small>完全自由自訂</small></button>
 </div>
 <div class="card" style="margin-top:15px">
  <h3>完整資料匯出／匯入</h3>
  <p class="muted">所有資料會保存在目前瀏覽器。建議定期匯出備份。</p><p id="lastBackup" class="muted" style="margin:8px 0 0;font-weight:700">${getLastBackupText()}</p>
  <div class="row"><button class="ghost" id="exportHome">匯出備份</button><button class="ghost" id="importHome">匯入備份</button><input id="importFile" type="file" accept="application/json" class="hidden"></div>
 </div>`;
 document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{page=b.dataset.module;if(['chakras','crystals','symbols'].includes(page))search='';render()});
 document.getElementById('exportHome').onclick=exportData;
 document.getElementById('importHome').onclick=()=>document.getElementById('importFile').click();
 document.getElementById('importFile').onchange=importData;
}

function reikiList(){
 page='reikiList';app.innerHTML=top()+`
 <div class="toolbar"><button class="ghost" id="back">← 回首頁</button><button class="primary" id="new">＋ 新增靈氣法</button></div>
 <div class="search"><span>⌕</span><input id="search" placeholder="快速搜尋靈氣法名稱" value="${esc(search)}"></div>
 <div class="row between"><h2>所有靈氣法</h2><span class="muted">${store.reiki.length} 筆</span></div>
 <div class="list">${store.reiki.filter(r=>r.title.toLowerCase().includes(search.toLowerCase())).map(r=>`
 <button class="card-btn" data-id="${r.id}"><h3>${esc(r.title)}</h3><div class="muted">${r.steps.length} 個中間步驟</div></button>`).join('')||'<div class="card muted">目前沒有靈氣法</div>'}</div>`;
 document.getElementById('back').onclick=goHome;document.getElementById('new').onclick=()=>{draft=blankReiki();page='reikiEdit';render()};
 const searchInput=document.getElementById('search');
 let composing=false;
 searchInput.addEventListener('compositionstart',()=>{composing=true});
 searchInput.addEventListener('compositionend',e=>{
   composing=false;
   search=e.target.value;
   reikiList();
   const next=document.getElementById('search');
   next.focus();
   try{next.setSelectionRange(next.value.length,next.value.length)}catch(_){}
 });
 searchInput.addEventListener('input',e=>{
   search=e.target.value;
   if(composing)return;
   reikiList();
   const next=document.getElementById('search');
   next.focus();
   try{next.setSelectionRange(next.value.length,next.value.length)}catch(_){}
 });
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{currentId=b.dataset.id;page='reikiDetail';render()});
}
function blankReiki(){return{id:uid(),title:'',opening:'我現在使用靈氣來為＿＿＿做靈氣療癒',hands:'我就是光、光就是我',closing:'感恩宇宙能量',note:'',images:[],steps:[]}}
function reikiDetail(){
 const r=store.reiki.find(x=>x.id===currentId);if(!r){reikiList();return}
 let orderDraft=JSON.parse(JSON.stringify(r.steps||[])),sortMode=false;

 function renderDetail(){
  app.innerHTML=top()+`
  <div class="toolbar"><button class="ghost" id="back">← 靈氣清單</button><div class="row"><button class="ghost" id="edit">編輯</button><button class="danger" id="delete">刪除</button></div></div>
  <div style="text-align:center"><div class="muted">使用的靈氣法為</div><h1>${esc(r.title)}</h1></div>
  <div class="fixed-step"><div class="num">① 合掌 → 宣告　<span class="repeat">3 次</span></div><div class="content">${esc(r.opening)}</div></div>
  <div class="fixed-step"><div class="num">② 高舉雙手　<span class="repeat">念 3 次</span></div><div class="content">${esc(r.hands)}</div></div>
  <div class="section">
   <div class="row between"><h2>中間步驟</h2>
   ${sortMode?`<div class="row"><button class="primary" id="saveOrder">儲存順序</button><button class="ghost" id="cancelOrder">取消</button></div>`:`<button class="ghost" id="startOrder">調整步驟順序</button>`}</div>
   ${sortMode?`<div class="muted" style="margin:8px 0 12px">調整模式已開啟，拖曳「⋮⋮」；完成後請按「儲存順序」。</div>`:''}
   <div id="detailSteps">${orderDraft.map((x,i)=>sortMode?sortableReadStep(x,i+1):readStep(x,i+1)).join('')}</div>
  </div>
  <div class="fixed-step"><div class="num">③ 合掌結束　<span class="repeat">念 3 次</span></div><div class="content">${esc(r.closing)}</div></div>
  ${r.note||r.images.length?`<div class="card"><h2>備注</h2><div class="content">${esc(r.note)}</div>${gallery(r.images)}</div>`:''}`;
  bindHome();
  document.getElementById('back').onclick=()=>{page='reikiList';render()};
  document.getElementById('edit').onclick=()=>{draft=JSON.parse(JSON.stringify(r));page='reikiEdit';render()};
  document.getElementById('delete').onclick=()=>{if(confirm('確定刪除這個靈氣法？')){store.reiki=store.reiki.filter(x=>x.id!==r.id);save();page='reikiList';render()}};
  if(sortMode){
   document.getElementById('cancelOrder').onclick=()=>{orderDraft=JSON.parse(JSON.stringify(r.steps||[]));sortMode=false;renderDetail()};
   document.getElementById('saveOrder').onclick=()=>{r.steps=JSON.parse(JSON.stringify(orderDraft));save();sortMode=false;renderDetail()};
   enableDetailDrag();
  }else{
   document.getElementById('startOrder').onclick=()=>{orderDraft=JSON.parse(JSON.stringify(r.steps||[]));sortMode=true;renderDetail()};
  }
 }
 function sortableReadStep(st,n){
  return `<div class="detail-sort-item" draggable="true" data-detail-step="${st.id}"><div class="detail-sort-handle">⋮⋮</div>${readStep(st,n)}</div>`;
 }
 function enableDetailDrag(){
  const list=document.getElementById('detailSteps');if(!list)return;
  let dragId=null,dragEl=null;
  const syncOrder=()=>{const ids=[...list.querySelectorAll('[data-detail-step]')].map(x=>x.dataset.detailStep);const ordered=ids.map(id=>orderDraft.find(x=>x.id===id)).filter(Boolean);if(ordered.length===orderDraft.length)orderDraft=ordered};
  list.querySelectorAll('[data-detail-step]').forEach(el=>{
   el.addEventListener('dragstart',e=>{dragId=el.dataset.detailStep;dragEl=el;el.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
   el.addEventListener('dragover',e=>e.preventDefault());
   el.addEventListener('drop',e=>{e.preventDefault();if(!dragId||dragId===el.dataset.detailStep)return;const from=orderDraft.findIndex(x=>x.id===dragId),to=orderDraft.findIndex(x=>x.id===el.dataset.detailStep);if(from>=0&&to>=0){orderDraft.splice(to,1,orderDraft.splice(from,1)[0]);renderDetail()}});
   el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragId=null;dragEl=null});
   const handle=el.querySelector('.detail-sort-handle');if(!handle)return;
   handle.style.touchAction='none';
   handle.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;dragId=el.dataset.detailStep;dragEl=el;el.classList.add('dragging');e.preventDefault()},{passive:false});
   handle.addEventListener('touchmove',e=>{if(!dragEl||e.touches.length!==1)return;e.preventDefault();const t=e.touches[0];const target=[...list.querySelectorAll('[data-detail-step]')].find(x=>{if(x===dragEl)return false;const q=x.getBoundingClientRect();return t.clientY>=q.top&&t.clientY<=q.bottom});if(!target)return;const q=target.getBoundingClientRect();if(t.clientY<q.top+q.height/2)list.insertBefore(dragEl,target);else list.insertBefore(dragEl,target.nextSibling)},{passive:false});
   handle.addEventListener('touchend',()=>{if(!dragEl)return;syncOrder();dragEl.classList.remove('dragging');dragId=null;dragEl=null},{passive:false});
   handle.addEventListener('touchcancel',()=>{dragEl?.classList.remove('dragging');dragId=null;dragEl=null},{passive:false});
  });
 }
 renderDetail();
}

function readStep(s,n){
 const name={sutra:'念達法',symbols:'符號',purification:'淨化',technique:'手法',other:'其他'}[s.type]||'其他';
 const repeat=s.type==='sutra'?'　<span class="repeat">唸 3 次</span>':'';
 if(s.type==='purification'&&s.purify==='否')return '';
 let body='';
 if(s.type==='symbols')body=`<div class="symbols">${s.symbols.map(x=>`<div class="symbol-box"><b>${esc(x.name)}</b>${x.image?`<img src="${esc(x.image)}" data-zoom="${esc(x.image)}">`:''}<div class="muted">啟動方式：${esc(x.activation)}</div><div class="muted">次數：${Number(x.count)||1} 次</div></div>`).join('')}</div>`;
 else if(s.type==='purification')body=`<div class="content">${esc(s.method)}</div>`;

function enableDrag(){
 const list=document.getElementById('steps');if(!list)return;
 let dragId=null,dragEl=null,placeholder=null,active=false,startY=0;

 const getTarget=(x,y)=>{
   return [...list.querySelectorAll('[data-step]')].find(el=>{
     if(el===dragEl)return false;
     const r=el.getBoundingClientRect();
     return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
   });
 };

 const finish=()=>{
   if(!dragEl)return;
   if(active&&placeholder){
     list.insertBefore(dragEl,placeholder);
     const ids=[...list.querySelectorAll('[data-step]')].map(x=>x.dataset.step);
     const ordered=ids.map(id=>draft.steps.find(x=>x.id===id)).filter(Boolean);
     if(ordered.length===draft.steps.length)draft.steps=ordered;
   }
   dragEl.classList.remove('dragging');
   placeholder?.remove();
   dragEl=null;placeholder=null;dragId=null;active=false;
 };

 list.querySelectorAll('[data-step]').forEach(el=>{
   el.draggable=true;
   el.addEventListener('dragstart',e=>{
     syncReiki();dragId=el.dataset.step;el.classList.add('dragging');
     try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}
   });
   el.addEventListener('dragover',e=>e.preventDefault());
   el.addEventListener('drop',e=>{
     e.preventDefault();
     const from=draft.steps.findIndex(x=>x.id===dragId);
     const to=draft.steps.findIndex(x=>x.id===el.dataset.step);
     if(from>=0&&to>=0&&from!==to){
       draft.steps.splice(to,0,draft.steps.splice(from,1)[0]);
       reikiEdit();
     }
   });
   el.addEventListener('dragend',()=>el.classList.remove('dragging'));

   const handle=el.querySelector('.handle');if(!handle)return;
   handle.style.touchAction='none';
   handle.addEventListener('touchstart',e=>{
     if(e.touches.length!==1)return;
     syncReiki();
     dragEl=el;dragId=el.dataset.step;startY=e.touches[0].clientY;active=false;
     e.preventDefault();
   },{passive:false});

   handle.addEventListener('touchmove',e=>{
     if(!dragEl||e.touches.length!==1)return;
     const t=e.touches[0];
     if(!active&&Math.abs(t.clientY-startY)<6)return;
     if(!active){
       active=true;dragEl.classList.add('dragging');
       placeholder=document.createElement('div');
       placeholder.className='step-drag-placeholder';
       placeholder.style.height=dragEl.getBoundingClientRect().height+'px';
       placeholder.style.border='2px dashed var(--soft-pink)';
       placeholder.style.borderRadius='13px';
       list.insertBefore(placeholder,dragEl);
     }
     e.preventDefault();
     const target=getTarget(t.clientX,t.clientY);
     if(target){
       const r=target.getBoundingClientRect();
       if(t.clientY<r.top+r.height/2)list.insertBefore(placeholder,target);
       else list.insertBefore(placeholder,target.nextSibling);
     }
   },{passive:false});

   handle.addEventListener('touchend',e=>{
     if(dragEl)finish();
     e.preventDefault();
   },{passive:false});
   handle.addEventListener('touchcancel',finish,{passive:false});
 });
}

 const renderEdit=()=>{

  ${k.fields.map(f=>`<div class="field"><label>${f[1]}</label>${f[0]==='aura'?`<input id="f_${f[0]}" type="text" value="${esc(draftType[f[0]])}" placeholder="例如：綠色">`:`<textarea id="f_${f[0]}">${esc(draftType[f[0]])}</textarea>`}</div>`).join('')}
  <div class="field"><label>圖片（可多張）</label><input id="files" type="file" accept="image/*" multiple>
   <div class="image-edit-grid">${(draftType.images||[]).map((img,i)=>`<div class="image-edit-item"><img src="${esc(img)}" alt=""><button type="button" class="danger image-delete" data-img-index="${i}">刪除圖片</button></div>`).join('')||'<div class="muted">尚未上傳圖片</div>'}</div>
  </div>
  <div class="row" style="justify-content:flex-end"><button class="primary" id="save">儲存</button></div></div>`;
  document.getElementById('back').onclick=()=>{page=type;render()};
  document.querySelectorAll('.image-delete').forEach(btn=>btn.onclick=()=>{
    const i=Number(btn.dataset.imgIndex);
    if(Number.isInteger(i)&&i>=0&&i<draftType.images.length){
      draftType.images.splice(i,1);
      renderEdit();
    }
  });
  document.getElementById('save').onclick=async()=>{
    k.fields.forEach(f=>draftType[f[0]]=document.getElementById('f_'+f[0]).value);
    const fs=document.getElementById('files').files;
    for(const f of fs)draftType.images.push(await imageData(f));
    const i=store[k.arr].findIndex(x=>x.id===draftType.id);
    if(i>=0)store[k.arr][i]=draftType;else store[k.arr].push(draftType);
    save();currentId=draftType.id;page='knowledgeDetail';render();
  };
 };
 renderEdit();
}

function customCategories(){
 page='customCategories'; currentId=''; draft=null;
 app.innerHTML=top()+`<div class="toolbar">
 <button type="button" class="ghost" id="customHome">← 回首頁</button>
 <button type="button" class="primary" id="newCategory">＋ 新增分類</button>
 </div>
 <h1>＋新增其他</h1>
 <p class="muted">自訂分類、自訂資料名稱、任意新增欄位、圖片。</p>
 <div class="list">${store.customCategories.map(c=>`
   <div class="card">
    <div class="row between">
      <button type="button" class="card-btn" style="flex:1" data-cat="${c.id}">
        <h3>${esc(c.name)}</h3><div class="muted">${c.items.length} 筆資料</div>
      </button>
      <button type="button" class="danger" data-delete-cat="${c.id}">刪除</button>
    </div>
   </div>`).join('')||'<div class="card muted">尚未建立分類</div>'}</div>`;

 document.getElementById('customHome').onclick=()=>goHome();
 document.getElementById('newCategory').onclick=()=>{
   draft={id:uid(),name:'',items:[]};
   currentId=draft.id;
   page='customList';
   render();
 };
 document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{
   currentId=b.dataset.cat;
   draft=null;
   page='customList';
   render();
 });
 document.querySelectorAll('[data-delete-cat]').forEach(b=>b.onclick=()=>{
   const id=b.dataset.deleteCat;
   const c=store.customCategories.find(x=>x.id===id);
   if(!c)return;
   if(confirm(`確定刪除分類「${c.name}」及其中所有資料嗎？`)){
     store.customCategories=store.customCategories.filter(x=>x.id!==id);
     save(); render();
   }
 });
}

function customList(){
 let c=store.customCategories.find(x=>x.id===currentId);
 const isNew=!c && draft && draft.id===currentId;
 if(!c && !isNew){page='customCategories';currentId='';draft=null;render();return}
 if(isNew)c=draft;

 app.innerHTML=top()+`<div class="toolbar">
 <button type="button" class="ghost" id="backToCategories">← 返回分類</button>
 <button type="button" class="primary" id="newCustomItem">＋ 新增資料</button>
 </div>
 <h1>${esc(c.name||'新增分類')}</h1>
 ${isNew?`<div class="form">
   <div class="field"><label>自訂分類</label><input id="catName" placeholder="例如：特殊工具"></div>
   <button type="button" class="primary" id="saveCat">建立分類</button>
 </div>`:''}
 <div class="list" style="margin-top:12px">${c.items.map(x=>`
   <div class="card">
    <div class="row between">
      <button type="button" class="card-btn" style="flex:1" data-item="${x.id}">
       <h3>${esc(x.name)}</h3><div class="muted">${x.fields?.length||0} 個自訂欄位</div>
      </button>
      <button type="button" class="danger" data-delete-item="${x.id}">刪除</button>
    </div>
   </div>`).join('')||'<div class="card muted">目前沒有資料</div>'}</div>`;

 document.getElementById('backToCategories').onclick=()=>{
   currentId='';draft=null;page='customCategories';render();
 };
 document.getElementById('newCustomItem').onclick=()=>{
   if(isNew){alert('請先建立分類');return}
   draft={id:uid(),name:'',fields:[],images:[]};
   page='customEdit';render();
 };
 document.getElementById('saveCat')?.addEventListener('click',()=>{
   const n=document.getElementById('catName').value.trim();
   if(!n){alert('請輸入自訂分類名稱');return}
   store.customCategories.push({id:currentId,name:n,items:[]});
   save();draft=null;page='customList';render();
 });
 document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{
   draft=JSON.parse(JSON.stringify(c.items.find(x=>x.id===b.dataset.item)));
   page='customEdit';render();
 });
 document.querySelectorAll('[data-delete-item]').forEach(b=>b.onclick=()=>{
   const id=b.dataset.deleteItem;
   if(confirm('確定刪除這筆資料嗎？')){
     const target=store.customCategories.find(x=>x.id===currentId);
     if(target){target.items=target.items.filter(x=>x.id!==id);save();render();}
   }
 });
}

function customEdit(){
 const c=store.customCategories.find(x=>x.id===currentId);
 if(!c){page='customCategories';currentId='';draft=null;render();return}
 app.innerHTML=top()+`<div class="toolbar">
 <button type="button" class="ghost" id="backCustom">← 返回</button><b>自訂資料</b></div>
 <div class="form">
 <div class="field"><label>自訂資料名稱</label><input id="cn" value="${esc(draft.name)}"></div>
 <div><label>任意新增欄位</label>
  <div id="fields">${draft.fields.map((f,i)=>`<div class="custom-row">
   <div class="row"><input data-fn="${i}" placeholder="欄位名稱" value="${esc(f.name)}"></div>
   <textarea data-fv="${i}" placeholder="內容">${esc(f.value)}</textarea>
  </div>`).join('')}</div>
  <button type="button" class="ghost" id="addField">＋新增欄位</button>
 </div>
 <div class="field"><label>圖片（可多張）</label><input id="cfiles" type="file" accept="image/*" multiple>${gallery(draft.images||[])}</div>
 <div class="row" style="justify-content:flex-end"><button type="button" class="primary" id="save">儲存</button></div>
 </div>`;
 document.getElementById('backCustom').onclick=()=>{page='customList';render()};
 document.getElementById('addField').onclick=()=>{syncCustom();draft.fields.push({name:'',value:''});render()};
 document.getElementById('save').onclick=saveCustom;
}


function getLastBackupText(){
 const raw=localStorage.getItem('xiaoxiao_magicbook_last_backup');
 if(!raw)return '尚未備份';
 const d=new Date(raw);
 if(Number.isNaN(d.getTime()))return '尚未備份';
 const pad=n=>String(n).padStart(2,'0');
 return `最後備份：${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function exportData(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));
 a.download='笑笑的魔法書-完整備份.json';
 a.click();
 localStorage.setItem('xiaoxiao_magicbook_last_backup', new Date().toISOString());
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 if(page==='home') render();
}
function importData(e){
 const file=e.target.files[0];if(!file)return;
 file.text().then(txt=>{try{const incoming=normalizeStore(JSON.parse(txt));if(confirm('匯入會取代目前瀏覽器中的資料，確定嗎？')){store=incoming;save();goHome()}}catch(err){alert('匯入失敗，請確認備份檔案格式。')}e.target.value=''})
}

window.__backToCategories=function(){
 currentId='';
 draft=null;
 page='customCategories';
 render();
};
document.addEventListener('click',e=>{
 const nav=e.target.closest('#homeBtn');
 if(nav){e.preventDefault();e.stopPropagation();goHome();return}
 const backCat=e.target.closest('#backToCategories');
 if(backCat){e.preventDefault();e.stopPropagation();currentId='';draft=null;page='customCategories';render();return}
 const backCustom=e.target.closest('#backCustom');
 if(backCustom){e.preventDefault();e.stopPropagation();page='customList';render();return}

 const z=e.target.closest('[data-zoom]');if(z)openImage(z.dataset.zoom);
 const edit=e.target.closest('[data-edit]');if(edit){currentType=edit.dataset.edit;draft=JSON.parse(JSON.stringify(store[currentType].find(x=>x.id===currentId)));page='knowledgeEdit';render()}
});
render();
})();
</script>
</body>
</html>
