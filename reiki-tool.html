<meta name="apple-mobile-web-app-title" content="笑笑的魔法書">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
:root{
--pink:#C9938A;--soft-pink:#E8C4BC;--light-pink:#F5E6E3;
--blue:#7A9BAD;--soft-blue:#B8CFDA;--light-blue:#E3EDF3;
--sage:#9AAE9B;--light-sage:#E8F0E8;
--cream:#FAF3EE;--bg:#FAFAF8;--dark:#37352F;--medium:#5A5248;--gray:#9B9A97;
--line:#E8E4DF;--white:#fff;--danger:#A65D59
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--dark);font-family:"Noto Sans TC",sans-serif;line-height:1.65}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:980px;margin:auto;padding:16px 14px 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.brand{font-weight:700;font-size:20px}.sub{font-size:12px;color:var(--gray)}
.btn,.ghost,.danger,.primary{border:1px solid var(--line);border-radius:11px;padding:9px 13px;background:#fff;color:var(--medium)}
.primary{background:var(--pink);color:#fff;border-color:var(--pink);font-weight:700}
.danger{background:#f8e9e7;color:var(--danger)}
.search{position:relative;margin:4px 0 18px}.search input{width:100%;height:52px;padding:0 16px 0 45px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:0}
.search span{position:absolute;left:15px;top:8px;font-size:22px;color:var(--gray)}
h1{font-size:26px;margin:4px 0 5px}h2{font-size:19px;margin:0 0 10px}h3{margin:0;font-size:17px}
.muted{color:var(--gray);font-size:13px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.module,.card,.form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 16px #37352f08}
.module{text-align:left;min-height:112px;color:var(--dark);display:flex;flex-direction:column;justify-content:center;gap:5px}
.module b{font-size:18px}.module small{color:var(--gray)}
.module:nth-child(1){border-top:6px solid var(--pink)}.module:nth-child(2){border-top:6px solid var(--sage)}
.module:nth-child(3){border-top:6px solid #B5AFC7}.module:nth-child(4){border-top:6px solid #D8C8AD}
.module:nth-child(5){border-top:6px solid var(--soft-blue)}.module:nth-child(6){border-top:6px solid #C9B596}
.list{display:grid;gap:9px}.card-btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px}
.field{display:grid;gap:5px;margin-bottom:13px}.field label,label{font-weight:700;font-size:13px;color:var(--medium)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--dark)}
textarea{min-height:86px;resize:vertical}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.form{margin-bottom:12px}.section{margin:14px 0}.section-title{font-weight:700;margin-bottom:8px}
.step-list{display:grid;gap:9px}.step{border:1px dashed #cfc6bb;border-radius:13px;background:#fff;padding:10px}
.step.dragging{opacity:.45}.step-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.handle{font-size:20px;color:var(--gray);cursor:grab;touch-action:none}.step-head strong{flex:1}
.symbols{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;padding:4px 0 7px;align-items:start}.symbol-box{min-width:0;width:auto;border:1px solid var(--line);border-radius:11px;padding:9px;background:#fcfaf8}
.symbol-box img{width:100%;height:95px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);margin-bottom:7px}

<script>
(function(){
'use strict';
const KEY='spirit-toolbox-final-v1';
let store=load(), page='home', currentType='', currentId='', draft=null, search='', customScope='customCategories';
const app=document.getElementById('app');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEDIA_DB='xiaoxiao-magicbook-media-v1';
const MEDIA_STORE='media';
const mediaCache=new Map();

function openMediaDB(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB)return reject(new Error('此瀏覽器不支援 IndexedDB'));
  const req=indexedDB.open(MEDIA_DB,1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE)};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error||new Error('無法開啟圖片資料庫'));
 });
}
function mediaPutAll(items){
 if(!items.length)return Promise.resolve();
 return openMediaDB().then(db=>new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,'readwrite'), os=tx.objectStore(MEDIA_STORE);
  for(const [id,data] of items)os.put(data,id);
  tx.oncomplete=()=>{db.close();resolve()};
  tx.onerror=()=>{db.close();reject(tx.error||new Error('圖片儲存失敗'))};
  tx.onabort=()=>{db.close();reject(tx.error||new Error('圖片儲存失敗'))};
 }));
}
function mediaGetAll(ids){
 if(!ids.length)return Promise.resolve({});
 return openMediaDB().then(db=>new Promise((resolve,reject)=>{
  const tx=db.transaction(MEDIA_STORE,'readonly'), os=tx.objectStore(MEDIA_STORE), out={};
  let left=ids.length;
  for(const id of ids){
   const req=os.get(id);
   req.onsuccess=()=>{if(req.result)out[id]=req.result;if(--left===0){db.close();resolve(out)}};
   req.onerror=()=>{db.close();reject(req.error||new Error('圖片讀取失敗'))};
  }
 }));
}
function mediaId(){return 'm_'+uid()}
function externalizeMedia(value, media){
 if(typeof value==='string'){
  if(value.startsWith('data:image/')){
   const cached=mediaCache.get(value);
   if(cached)return `__MEDIA__${cached}`;
   const id=mediaId();
   mediaCache.set(value,id);
   media.push([id,value]);
   return `__MEDIA__${id}`;
  }
  return value;
 }
 if(Array.isArray(value))return value.map(x=>externalizeMedia(x,media));
 if(value&&typeof value==='object'){
  const out={};
  for(const [k,v] of Object.entries(value))out[k]=externalizeMedia(v,media);
  return out;
 }
 return value;
}
function collectMediaRefs(value, ids){
 if(typeof value==='string'&&value.startsWith('__MEDIA__')){ids.push(value.slice(9));return}
 if(Array.isArray(value)){value.forEach(x=>collectMediaRefs(x,ids));return}
 if(value&&typeof value==='object')Object.values(value).forEach(x=>collectMediaRefs(x,ids));
}
function hydrateMedia(value, media){
 if(typeof value==='string'&&value.startsWith('__MEDIA__'))return media[value.slice(9)]||value;
 if(Array.isArray(value))return value.map(x=>hydrateMedia(x,media));
 if(value&&typeof value==='object'){
  for(const k of Object.keys(value))value[k]=hydrateMedia(value[k],media);
 }
 return value;
}
async function hydrateStoreMedia(){
 const ids=[];collectMediaRefs(store,ids);
 if(!ids.length)return;
 const unique=[...new Set(ids)];
 const media=await mediaGetAll(unique);
 for(const id of unique)if(media[id])mediaCache.set(media[id],id);
 hydrateMedia(store,media);
}
function save(){
 const media=[];
 const stripped=externalizeMedia(store,media);
 // Metadata remains in localStorage; potentially large Base64 images no longer consume
 // the single localStorage quota.
 localStorage.setItem(KEY,JSON.stringify(stripped));
 const putP=mediaPutAll(media);
 putP.then(()=>{try{syncAfterPersist()}catch(e){console.error(e)}},()=>{});
 return putP;
}
function normalizeSymbolSteps(store){
 (store.reiki||[]).forEach(r=>(r.steps||[]).forEach(st=>{
   if(st.type!=='symbols')return;
   (st.symbols||[]).forEach(sym=>{
     if(!sym.countUnit)sym.countUnit='點';
     if(sym.imageRef===undefined)sym.imageRef='';
   });
 }));
 return store;
}
function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('spirit-toolbox-v2')||'{}');
  return normalizeSymbolSteps(normalizeStore(raw));
 }catch(e){return emptyStore()}
}
function emptyStore(){return{version:3,reiki:[],chakras:[],crystals:[],symbols:[],customCategories:[],ichingCustomCategories:[]}}
function normalizeStore(raw){
 const src=raw.data||raw||{};
 const arr=(...keys)=>{for(const k of keys)if(Array.isArray(src[k]))return src[k];return[]};
 return{
  ...src,
  version:3,
  reiki:arr('reiki','靈氣','reikiRecords').map(normalizeReiki),
  chakras:arr('chakras','七大脈輪','chakra').map(x=>({...x,id:x.id||uid(),name:x.name||x.title||'',images:Array.isArray(x.images)?x.images:((x.image||x.img)?[x.image||x.img]:[])})),
  crystals:arr('crystals','水晶').map(x=>({...x,id:x.id||uid(),name:x.name||x.title||'',images:Array.isArray(x.images)?x.images:((x.image||x.img)?[x.image||x.img]:[])})),
  symbols:arr('symbols','符號').map(x=>({...x,id:x.id||uid(),name:x.name||x.title||'',images:Array.isArray(x.images)?x.images:((x.image||x.img)?[x.image||x.img]:[])})),
  customCategories:Array.isArray(src.customCategories)?src.customCategories.map(normalizeCustomCategory):[],
  ichingCustomCategories:Array.isArray(src.ichingCustomCategories)?src.ichingCustomCategories.map(normalizeCustomCategory):[]
 }
}
function normalizeCustomCategory(c){
 return{
  id:c.id||uid(),
  name:c.name||'未命名分類',
  items:(Array.isArray(c.items)?c.items:[]).map(x=>({
   ...x,
   id:x.id||uid(),
   name:x.name||'未命名資料',
   fields:Array.isArray(x.fields)?x.fields.map(f=>({name:String(f?.name??''),value:String(f?.value??'')})):[],
   images:Array.isArray(x.images)?x.images:[]
  }))
 }
}
function normalizeReiki(r){
 return{
  ...r,
  id:r.id||uid(),title:r.title||r.name||'未命名靈氣法',
  opening:r.opening||r.openingDeclaration||'我現在使用靈氣來為＿＿＿做靈氣療癒',
  hands:r.hands||r.handsRaised||'我就是光、光就是我',
  closing:r.closing||'感恩宇宙能量',
  note:r.note||r.notes||'',
  images:Array.isArray(r.images)?r.images:((r.image||r.img)?[r.image||r.img]:[]),
  steps:(Array.isArray(r.steps)?r.steps:[]).map(normalizeStep)
 }
}
function normalizeStep(s){
 const type=s.type==='symbol'?'symbols':(s.type||'other');
 return{
  ...s,
  id:s.id||uid(),type,
  sutra:s.sutra||s.text||'',method:s.method||s.technique||'',
  handPlacement:s.handPlacement||s.hands||'',
  purify:s.purify||s.answer||'否',
  symbols:(s.symbols||s.items||[]).map(x=>({
   ...x,
   id:x.id||uid(),name:x.name||x.title||'',image:x.image||x.img||'',imageRef:x.imageRef||'',
   activation:x.activation||x.method||'',count:Number(x.count||x.times||1),countUnit:x.countUnit||'點'
  })),
  note:s.note||''
 }
}
function imageData(file,max=1100){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onerror=reject;
  r.onload=()=>{
   const im=new Image();
   im.onload=()=>{
    const scale=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',.86));
   };
   im.onerror=reject;im.src=r.result;
  };
  r.readAsDataURL(file);
 });
}
function normalizeName(v){return String(v??'').trim().toLowerCase()}
function symbolLibraryImage(x){
 const ref=String(x?.imageRef||'');
 if(ref){
  const lib=store.symbols.find(z=>z.id===ref);
  if(lib&&lib.images?.[0])return lib.images[0];
 }
 return x?.image||'';
}
function compactReikiDraft(input){
 const out=JSON.parse(JSON.stringify(input));
 for(const step of (out.steps||[])){
  if(step.type!=='symbols')continue;
  for(const sym of (step.symbols||[])){
   const lib=store.symbols.find(z=>normalizeName(z.name)===normalizeName(sym.name)&&z.images?.[0]);
   if(lib && sym.image && sym.image===lib.images[0]){
    sym.image='';
    sym.imageRef=lib.id;
   }
  }
 }
 return out;
}
function compactDataUrl(src,max=700,quality=.68){
 return new Promise(resolve=>{
  if(!src||!String(src).startsWith('data:image/'))return resolve(src);
  try{
   const im=new Image();
   im.onload=()=>{
    if((im.naturalWidth||im.width)<=max&&(im.naturalHeight||im.height)<=max&&src.length<140000)return resolve(src);
    const scale=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    resolve(c.toDataURL('image/jpeg',quality));
   };
   im.onerror=()=>resolve(src);
   im.src=src;
  }catch(_){resolve(src)}
 });
}

 let orderDraft=store.reiki.map(x=>x.id);

 const renderList=()=>{

  app.innerHTML=top()+`
  <div class="toolbar"><button class="ghost" id="back">← 回首頁</button><button class="primary" id="new">＋ 新增靈氣法</button></div>

 function enableReikiListDrag(){
  const list=document.getElementById('reikiListItems');if(!list)return;
  let dragId=null,dragEl=null;
  const syncOrder=()=>{
    const visible=[...list.querySelectorAll('[data-reiki-list-item]')].map(x=>x.dataset.reikiListItem);
    const visibleSet=new Set(visible);
    const hidden=store.reiki.filter(x=>!visibleSet.has(x.id)).map(x=>x.id);
    // Keep filtered-out items in their existing relative positions, while the
    // visible items take the positions occupied by visible items. This makes
    // drag ordering safe even when a search term is active.
    const base=store.reiki.map(x=>x.id);
    const next=[];
    let vi=0;
    for(const id of base){
      if(visibleSet.has(id))next.push(visible[vi++]);
      else next.push(id);
    }
    orderDraft=next;
  };
  list.querySelectorAll('[data-reiki-list-item]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      dragId=el.dataset.reikiListItem;dragEl=el;el.classList.add('dragging');
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}catch(_){}
    });
    el.addEventListener('dragover',e=>e.preventDefault());
    el.addEventListener('drop',e=>{
      e.preventDefault();
      if(!dragId||dragId===el.dataset.reikiListItem)return;
      const from=orderDraft.indexOf(dragId),to=orderDraft.indexOf(el.dataset.reikiListItem);
      if(from<0||to<0)return;
      orderDraft.splice(to,1,orderDraft.splice(from,1)[0]);
      renderList();
    });
    el.addEventListener('dragend',()=>{el.classList.remove('dragging');dragId=null;dragEl=null});
    const handle=el.querySelector('.reiki-list-handle');if(!handle)return;
    handle.style.touchAction='none';
    handle.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      dragId=el.dataset.reikiListItem;dragEl=el;el.classList.add('dragging');e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchmove',e=>{
      if(!dragEl||e.touches.length!==1)return;
      e.preventDefault();
      const t=e.touches[0];
      const target=[...list.querySelectorAll('[data-reiki-list-item]')].find(x=>{
        if(x===dragEl)return false;
        const q=x.getBoundingClientRect();
        return t.clientY>=q.top&&t.clientY<=q.bottom;
      });
      if(!target)return;
      const q=target.getBoundingClientRect();
      if(t.clientY<q.top+q.height/2)list.insertBefore(dragEl,target);
      else list.insertBefore(dragEl,target.nextSibling);
    },{passive:false});
    handle.addEventListener('touchend',()=>{
      if(!dragEl)return;
      syncOrder();dragEl.classList.remove('dragging');dragId=null;dragEl=null;renderList();
    },{passive:false});
    handle.addEventListener('touchcancel',()=>{
      dragEl?.classList.remove('dragging');dragId=null;dragEl=null;renderList();
    },{passive:false});
  });
 }
 renderList();
}

async function saveReiki(){
 syncReiki();
 if(!draft.title.trim()){alert('請輸入靈氣法名稱');return}
 const files=document.getElementById('noteImages')?.files||[];
 if(files.length){for(const f of files)draft.images.push(await imageData(f))}
 const compact=compactReikiDraft(draft);
 for(const step of (compact.steps||[])){
  if(step.type!=='symbols')continue;
  for(const sym of (step.symbols||[])){
   if(sym.image)sym.image=await compactDataUrl(sym.image);
  }
 }
 const next=JSON.parse(JSON.stringify(compact));
 const previous=store.reiki;
 const i=previous.findIndex(x=>x.id===next.id);
 const oldValue=i>=0?JSON.parse(JSON.stringify(previous[i])):null;
 if(i>=0)previous[i]=next;else previous.push(next);
 try{
  await save();
  currentId=next.id;draft=null;page='reikiDetail';render();
 }catch(err){
  if(i>=0)previous[i]=oldValue;
  else previous.pop();
  console.error(err);
  alert('儲存失敗：請先確認瀏覽器儲存權限與空間，再使用「完整資料匯出」備份。');
 }
}
function enableDrag(){
 const list=document.getElementById('steps');if(!list)return;
 let dragId=null,dragEl=null,placeholder=null,active=false,startY=0;

 const getTarget=(x,y)=>{
   return [...list.querySelectorAll('[data-step]')].find(el=>{
     if(el===dragEl)return false;
     const r=el.getBoundingClientRect();
     return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
   });
 };

 const finish=()=>{
   if(!dragEl)return;
   if(active&&placeholder){
     list.insertBefore(dragEl,placeholder);
     const ids=[...list.querySelectorAll('[data-step]')].map(x=>x.dataset.step);
     const ordered=ids.map(id=>draft.steps.find(x=>x.id===id)).filter(Boolean);
     if(ordered.length===draft.steps.length)draft.steps=ordered;
   }
   dragEl.classList.remove('dragging');
   placeholder?.remove();
   dragEl=null;placeholder=null;dragId=null;active=false;
 };

 list.querySelectorAll('[data-step]').forEach(el=>{
   el.draggable=true;
   el.addEventListener('dragstart',e=>{
     syncReiki();dragId=el.dataset.step;el.classList.add('dragging');
     try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}
   });
   el.addEventListener('dragover',e=>e.preventDefault());
   el.addEventListener('drop',e=>{
     e.preventDefault();
     const from=draft.steps.findIndex(x=>x.id===dragId);
     const to=draft.steps.findIndex(x=>x.id===el.dataset.step);
     if(from>=0&&to>=0&&from!==to){
       draft.steps.splice(to,0,draft.steps.splice(from,1)[0]);
       reikiEdit();
     }
   });
   el.addEventListener('dragend',()=>el.classList.remove('dragging'));

   const handle=el.querySelector('.handle');if(!handle)return;
   handle.style.touchAction='none';
   handle.addEventListener('touchstart',e=>{
     if(e.touches.length!==1)return;
     syncReiki();
     dragEl=el;dragId=el.dataset.step;startY=e.touches[0].clientY;active=false;
     e.preventDefault();
   },{passive:false});

   handle.addEventListener('touchmove',e=>{
     if(!dragEl||e.touches.length!==1)return;
     const t=e.touches[0];
     if(!active&&Math.abs(t.clientY-startY)<6)return;
     if(!active){
       active=true;dragEl.classList.add('dragging');
       placeholder=document.createElement('div');
       placeholder.className='step-drag-placeholder';
       placeholder.style.height=dragEl.getBoundingClientRect().height+'px';
       placeholder.style.border='2px dashed var(--soft-pink)';
       placeholder.style.borderRadius='13px';
       list.insertBefore(placeholder,dragEl);
     }
     e.preventDefault();
     const target=getTarget(t.clientX,t.clientY);
     if(target){
       const r=target.getBoundingClientRect();
       if(t.clientY<r.top+r.height/2)list.insertBefore(placeholder,target);
       else list.insertBefore(placeholder,target.nextSibling);
     }
   },{passive:false});

   handle.addEventListener('touchend',e=>{
     if(dragEl)finish();
     e.preventDefault();
   },{passive:false});
   handle.addEventListener('touchcancel',finish,{passive:false});
 });
}

自失也。","比之匪人，不亦傷乎！","外比於賢，以從上也。","顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。","比之無首，無所終也。"]],["小畜：亨。密雲不雨，自我西郊。","風行天上，小畜；君子以懿文德。",["初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿說輻，夫妻反目。","六四：有孚，血去惕出，無咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載，婦貞厲。月幾望，君子征凶。"],["復自道，其義吉也。","牽復在中，亦不自失也。","夫妻反目，不能正室也。","有孚惕出，上合誌也。","有孚攣如，不獨富也。","既雨既處，德積載也。君子征凶，有所疑也。"]],["履虎尾，不咥人，亨。","上天下澤，履；君子以辨上下，安民誌。",["初九：素履，往無咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾，咥人，凶。武人為於大君。","九四：履虎尾，訴訴，終吉。","九五：夬履，貞厲。","上九：視履考祥，其旋元吉。"],["素履之往，獨行願也。","幽人貞吉，中不自亂也。","眇能視；不足以有明也。跛能履；不足以與行也，咥人之凶；位不當也。武人為於大君；誌剛也。","訴訴終吉，誌行也。","夬履貞厲，位正當也。","元吉在上，大有慶也。"]],["泰：小往大來，吉亨。","天地交泰，後以財成天地之道，輔相天地之宜，以左右民。",["初九：拔茅茹，以其彙，征吉。","九二：包荒，用馮河，不遐遺，朋亡，得尚於中行。","九三：無平不陂，無往不復，艱貞無咎。勿恤其孚，於食有福。","六四：翩翩，不富，以其鄰，不戒以孚。","六五：帝乙歸妹，以祉元吉。","上六：城復於隍，勿用師。自邑告命，貞吝。"],["拔茅征吉，誌在外也。","包荒，得尚於中行，以光大也。","無往不復，天地際也。","翩翩不富，皆失實也。不戒以孚，中心願也。","以祉元吉，中以行願也。","城復於隍，其命亂也。"]],["否之匪人，不利君子貞，大往小來。","天地不交，否；君子以儉德辟難，不可榮以祿。",["初六：拔茅茹，以其匯，貞吉亨。","六二：包承。小人吉，大人否，亨。","六三：包羞。","九四：有命，無咎，疇離祉。","九五：休否，大人吉。其亡其亡，系於苞桑。","上九：傾否，先否後喜。"],["拔茅貞吉，誌在君也。","大人否亨，不亂群也。","包羞，位不當也。","有命無咎，誌行也。","大人之吉，位正當也。","否終則傾，何可長也。"]],["同人於野，亨。利涉大川，利君子貞。","天與火，同人；君子以類族辨物。",["初九：同人於門，無咎。","六二：同人於宗，吝。","九三：伏戎於莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人，先號啕而後笑。大師克相遇。","上九：同人於郊，無悔。"],["出門同人，又誰咎也。","同人於宗，吝道也。","伏戎於莽，敵剛也。三歲不興，安行也。","乘其墉，義弗克也，其吉，則困而反則也。  ","同人之先，以中直也。大師相遇，言相克也。","同人於郊，誌未得也。"]],["大有：元亨。","火在天上，大有；君子以遏惡揚善，順天休命。",["初九：無交害，匪咎，艱則無咎。","六二：同人於宗，吝。","九三：公用亨於天子，小人弗克。","九四：匪其彭，無咎。","六五：厥孚交如，威如；吉。","上九：自天佑之，吉無不利。"],["大有初九，無交害也。","大車以載，積中不敗也。","公用亨於天子，小人害也。","匪其彭，無咎；明辨晰也。","厥孚交如，信以發誌也。威如之吉，易而無備也。","大有上吉，自天佑也。"]],["謙：亨，君子有終。","地中有山，謙；君子以裒多益寡，稱物平施。",["初六：謙謙君子，用涉大川，吉。","六二：鳴謙，貞吉。","九三：勞謙，君子有終，吉。","六四：無不利，撝謙。","六五：不富，以其鄰，利用侵伐，無不利。","上六：鳴謙，利用行師，征邑國。"],["謙謙君子，卑以自牧也。","鳴謙貞吉，中心得也。","勞謙君子，萬民服也。","無不利，撝謙；不違則也。","利用侵伐，征不服也。","鳴謙，誌未得也。可用行師，征邑國也。"]],["豫：利建侯，行師。","雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。",["初六：鳴豫，凶。","六二：介於石，不終日，貞吉。","六三：盱豫，悔。遲有悔。","九四：由豫，大有得。勿疑。朋盍簪。","六五：貞疾，恒不死。","上六：冥豫，成有渝，無咎。"],["初六鳴豫，誌窮凶也。","不終日，貞吉；以中正也。","盱豫有悔，位不當也。","由豫，大有得；誌大行也。","六五貞疾，乘剛也。恒不死，中未亡也。","冥豫在上，何可長也。"]],["隨：元亨利貞，無咎。","澤中有雷，隨；君子以向晦入宴息。",["初九：官有渝，貞吉。出門交有功。","六二：系小子，失丈夫。","六三：系丈夫，失小子。隨有求得，利居貞。","九四：隨有獲，貞凶。有孚在道，以明，何咎。","九五：孚於嘉，吉。","上六：拘系之，乃從維之。王用亨於西山。"],["官有渝，從正吉也。出門交有功，不失也。","系小子，弗兼與也。","系丈夫，誌舍下也。","隨有獲，其義凶也。有孚在道，明功也。","孚於嘉，吉；位正中也。","拘系之，上窮也。"]],["蠱：元亨，利涉大川。先甲三日，後甲三日。","山下有風，蠱；君子以振民育德。",["初六：幹父之蠱，有子，考無咎，厲終吉。","九二：幹母之蠱，不可貞。","九三：幹父之蠱，小有悔，無大咎。","六四：裕父之蠱，往見吝。","六五：幹父之蠱，用譽。","上九：不事王侯，高尚其事。"],["幹父之蠱，意承考也。","幹母之蠱，得中道也。","幹父之蠱，終無咎也。","裕父之蠱，往未得也。","幹父之蠱；承以德也。","不事王侯，誌可則也。"]],["臨：元，亨，利，貞。至於八月有凶。","澤上有地，臨；君子以教思無窮，容保民無疆。",["初九：咸臨，貞吉。","九二：咸臨，吉無不利。","六三：甘臨，無攸利。既憂之，無咎。","六四：至臨，無咎。","六五：知臨，大君之宜，吉。","上六：敦臨，吉無咎。"],["咸臨貞吉，誌行正也。","咸臨，吉無不利；未順命也。","甘臨，位不當也。既憂之，咎不長也。","至臨無咎，位當也。","大君之宜，行中之謂也。","敦臨之吉，誌在內也。"]],["觀：盥而不薦，有孚顒若。","風行地上，觀；先王以省方，觀民設教。",["初六：童觀，小人無咎，君子吝。","六二：窺觀，利女貞。","六三：觀我生，進退。","六四：觀國之光，利用賓於王。","九五：觀我生，君子無咎。","上九：觀其生，君子無咎。"],["初六童觀，小人道也。","窺觀女貞，亦可醜也。","觀我生，進退；未失道也。","觀國之光，尚賓也。","觀我生，觀民也。","觀其生，誌未平也。"]],["噬嗑：亨。利用獄。","雷電噬嗑；先王以明罰敕法。",["初九：屨校滅趾，無咎。","六二：噬膚滅鼻，無咎。","六三：噬臘肉，遇毒；小吝，無咎。","九四：噬乾胏，得金矢，利艱貞，吉。","六五：噬乾肉，得黃金，貞厲，無咎。","上九：何校滅耳，凶。"],["屨校滅趾，不行也。","噬膚滅鼻，乘剛也。","遇毒，位不當也。","利艱貞吉，未光也。","貞厲無咎，得當也。","何校滅耳，聰不明也。"]],["賁：亨。小利有攸往。","山下有火，賁；君子以明庶政，無敢折獄。",["初九：賁其趾，舍車而徒。","六二：賁其須。","九三：賁如濡如，永貞吉。","六四：賁如皤如，白馬翰如，匪寇婚媾。","六五：賁於丘園，束帛戔戔，吝，終吉。","上九：白賁，無咎。"],["舍車而徒，義弗乘也。","賁其須，與上興也。","永貞之吉，終莫之陵也。","六四，當位疑也。匪寇婚媾，終無尤也。","六五之吉，有喜也。","白賁無咎，上得誌也。"]],["剝：不利有攸往。","山附地上，剝；上以厚下，安宅。",["初六：剝床以足，蔑貞凶。","六二：剝床以辨，蔑貞凶。","六三：剝之，無咎。","六四：剝床以膚，凶。","六五：貫魚，以宮人寵，無不利。","上九：碩果不食，君子得輿，小人剝廬。"],["剝床以足，以滅下也。","剝床以辨，未有與也。","剝之無咎，失上下也。","剝床以膚，切近災也。","以宮人寵，終無尤也。","君子得輿，民所載也。小人剝廬，終不可用也。"]],["復：亨。出入無疾，朋來無咎。反復其道，七日來復，利有攸往。","雷在地中，復；先王以至日閉關，商旅不行，後不省方。",["初九：不復遠，無祗悔，元吉。","六二：休復，吉。","六三：頻復，厲無咎。","六四：中行獨復。","六五：敦復，無悔。","上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至於十年，不克征。"],["不遠之復，以修身也。","休復之吉，以下仁也。","頻復之厲，義無咎也。","中行獨復，以從道也。","敦復無悔，中以自考也。","迷復之凶，反君道也。"]],["無妄：元亨，利貞。其匪正有眚，不利有攸往。","天下雷行，物與無妄；先王以茂對時，育萬物。",["初九：無妄，往吉。","六二：不耕獲，不災畬，則利有攸往。","六三：無妄之災，或系之牛，行人之得，邑人之災。","九四：可貞，無咎。","九五：無妄之疾，勿藥有喜。","上九：無妄，行有眚，無攸利。"],["無妄之往，得誌也。","不耕獲，未富也。","行人得牛，邑人災也。","可貞無咎，固有之也。","無妄之藥，不可試也。","無妄之行，窮之災也。"]],["大畜：利貞，不家食吉，利涉大川。","天在山中，大畜；君子以多識前言往行，以畜其德。",["初九：有厲利已。","九二：輿說輹。","九三：良馬逐，利艱貞。曰閑輿衛，利有攸往。","六四：童牛之牿，元吉。","六五：豶豕之牙，吉。","上九：何天之衢，亨。"],["有厲利已，不犯災也。","輿說輹，中無尤也。","利有攸往，上合誌也。","六四元吉，有喜也。","六五之吉，有慶也。","何天之衢，道大行也。"]],["頤：貞吉。觀頤，自求口實。","山下有雷，頤；君子以慎言語，節飲食。",["初九：舍爾靈龜，觀我朵頤，凶。","六二：顛頤，拂經，於丘頤，征凶。","六三：拂頤，貞凶，十年勿用，無攸利。","六四：顛頤，吉，虎視眈眈，其欲逐逐，無咎。","六五：拂經，居貞吉，不可涉大川。","上九：由頤，厲吉，利涉大川。"],["觀我朵頤，亦不足貴也。","六二征凶，行失類也。","十年勿用，道大悖也。","顛頤之吉，上施光也。","居貞之吉，順以從上也。","由頤厲吉，大有慶也。"]],["大過：棟橈，利有攸往，亨。","澤滅木，大過；君子以獨立不懼，遯世無悶。",["初六：藉用白茅，無咎。","九二：枯楊生稊，老夫得其女妻，無不利。","九三：棟橈，凶。","九四：棟隆，吉；有它吝。","九五：枯楊生華，老婦得士夫，無咎無譽。","上六：過涉滅頂，凶，無咎。"],["藉用白茅，柔在下也。","老夫女妻，過以相與也。","棟橈之凶，不可以有輔也。","棟隆之吉，不橈乎下也。","枯楊生華，何可久也。老婦士夫，亦可醜也。","過涉之凶，不可咎也。"]],["坎：習坎，有孚，維心亨，行有尚。","水洊至，習坎；君子以常德行，習教事。",["初六：習坎，入於坎窞，凶。","九二：坎有險，求小得。","六三：來之坎坎，險且枕，入於坎窞，勿用。","六四：樽酒簋貳，用缶，納約自牖，終無咎。","九五：坎不盈，祗既平，無咎。","上六：系用徽纆，置於叢棘，三歲不得，凶。"],["習坎入坎，失道凶也。","求小得，未出中也。","來之坎坎，終無功也。","樽酒簋貳，剛柔際也。","坎不盈，中未大也。","上六失道，凶三歲也。"]],["離：利貞，亨。畜牝牛，吉。","明兩作離，大人以繼明照於四方。",["初九：履錯然，敬之無咎。","六二：黃離，元吉。","九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。","九四：突如其來如，焚如，死如，棄如。","六五：出涕沱若，戚嗟若，吉。","上九：王用出征，有嘉折首，獲匪其醜，無咎。"],["履錯之敬，以辟咎也。","黃離元吉，得中道也。","日昃之離，何可久也。","突如其來如，無所容也。","六五之吉，離王公也。","王用出征，以正邦也。"]],["咸，亨，利貞，取女吉。","山上有澤，咸，君子以虛受人。",["初六，咸其拇。","六二，咸其腓，凶，居吉。","九三，咸其股，執其隨，往吝。","九四，貞吉，悔亡，憧憧往來，朋從爾思。","九五，咸其脢，無悔。","上六，咸其輔頰舌。"],["咸其拇，誌在外也。","雖凶居吉，順不害也。","咸其股，亦不處也。誌在隨人，所執下也。","貞吉悔亡，未感害也。憧憧往來，未光大也。","咸其脢，誌末也。","咸其輔頰舌，滕口說也。"]],["恒：亨，無咎，利貞，利有攸往。","雷風，恒；君子以立不易方。",["初六：浚恒，貞凶，無攸利。","九二：悔亡。","九三：不恒其德，或承之羞，貞吝。","九四：田無禽。","六五：恒其德，貞，婦人吉，夫子凶。","上六：振恒，凶。"],["浚恒之凶，始求深也。","九二悔亡，能久中也。","不恒其德，無所容也。","久非其位，安得禽也。","婦人貞吉，從一而終也。夫子制義，從婦凶也。","振恒在上，大無功也。"]],["遯：亨，小利貞。","天下有山，遯；君子以遠小人，不惡而嚴。",["初六：遯尾，厲，勿用有攸往。","六二：執之用黃牛之革，莫之勝說。","九三：系遯，有疾厲，畜臣妾吉。","九四：好遯，君子吉，小人否。","九五：嘉遯，貞吉。","上九：肥遯，無不利。"],["遯尾之厲，不往何災也。","執用黃牛，固誌也。","系遯之厲，有疾憊也。畜臣妾吉，不可大事也。","君子好遯，小人否也。","嘉遯貞吉，以正誌也。","肥遯，無不利；無所疑也。"]],["大壯：利貞","雷在天上，大壯；君子以非禮勿履。",["初九：壯於趾，征凶，有孚。","九二：貞吉。","九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","九四：貞吉悔亡，藩決不羸，壯於大輿之輹。","六五：喪羊於易，無悔。","上六：羝羊觸藩，不能退，不能遂，無攸利，艱則吉。"],["壯於趾，其孚窮也。","九二貞吉，以中也。","小人用壯，君子罔也。","藩決不羸，尚往也。","喪羊於易，位不當也。","不能退，不能遂，不祥也。艱則吉，咎不長也。"]],["晉：康侯用錫馬蕃庶，晝日三接。","明出地上，晉；君子以自昭明德。",["初六：晉如，摧如，貞吉。罔孚，裕無咎。","六二：晉如，愁如，貞吉。受茲介福，於其王母。","六三：眾允，悔亡。","九四：晉如碩鼠，貞厲。","六五：悔亡，失得勿恤，往吉，無不利。","上九：晉其角，維用伐邑，厲吉無咎，貞吝。"],["晉如，摧如；獨行正也。裕無咎；未受命也。","受之介福，以中正也。","眾允之，誌上行也。","碩鼠貞厲，位不當也。","失得勿恤，往有慶也。","維用伐邑，道未光也。"]],["明夷：利艱貞。","明入地中，明夷；君子以蒞眾，用晦而明。",["初九：明夷於飛，垂其翼。君子於行，三日不食，有攸往，主人有言。","六二：明夷，夷於左股，用拯馬壯，吉。","九三：明夷於南狩，得其大首，不可疾貞。","六四：入於左腹，獲明夷之心，出於門庭。","六五：箕子之明夷，利貞。","上六：不明晦，初登於天，後入於地。"],["君子於行，義不食也。","六二之吉，順以則也。","南狩之誌，乃大得也。","入於左腹，獲心意也。","箕子之貞，明不可息也。","初登於天，照四國也。後入於地，失則也。"]],["家人：利女貞。","風自火出，家人；君子以言有物，而行有恒。",["初九：閑有家，悔亡。","六二：無攸遂，在中饋，貞吉。","九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。","六四：富家，大吉。","九五：王假有家，勿恤，往吉。","上九：有孚威如，終吉。"],["閑有家，誌未變也。","六二之吉，順以巽也。","家人嗃嗃，未失也；婦子嘻嘻，失家節也。","富家大吉，順在位也。","王假有家，交相愛也。","威如之吉，反身之謂也。"]],["睽：小事吉。","上火下澤，睽；君子以同而異。",["初九：悔亡，喪馬勿逐，自復；見惡人無咎。","九二：遇主於巷，無咎。","六三：見輿曳，其牛掣，其人天且劓，無初有終。","九四：睽孤，遇元夫，交孚，厲無咎。","六五：悔亡，厥宗噬膚，往何咎。","上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。"],["見惡人，以辟咎也。","遇主於巷，未失道也。","見輿曳，位不當也。無初有終，遇剛也。","交孚無咎，誌行也。","厥宗噬膚，往有慶也。","遇雨之吉，群疑亡也。"]],["蹇：利西南，不利東北；利見大人，貞吉。","山上有水，蹇；君子以反身修德。",["初六：往蹇，來譽。","六二：王臣蹇蹇，匪躬之故。","九三：往蹇來反。","六四：往蹇來連。","九五：大蹇朋來。","上六：往蹇來碩，吉；利見大人。"],["往蹇來譽，宜待也。","王臣蹇蹇，終無尤也。","往蹇來反，內喜之也。","往蹇來連，當位實也。","大蹇朋來，以中節也。","往蹇來碩，誌在內也。利見大人，以從貴也。"]],["解：利西南，無所往，其來復吉。有攸往，夙吉。","雷雨作，解；君子以赦過宥罪。",["初六：無咎。","九二：田獲三狐，得黃矢，貞吉。","六三：負且乘，致寇至，貞吝。","九四：解而拇，朋至斯孚。","六五：君子維有解，吉；有孚於小人。","上六：公用射隼於高墉之上，獲之，無不利。"],["剛柔之際，義無咎也。","九二貞吉，得中道也。","負且乘，亦可醜也，自我致戎，又誰咎也。","解而拇，未當位也。","君子有解，小人退也。","公用射隼，以解悖也。"]],["損：有孚，元吉，無咎，可貞，利有攸往。曷之用，二簋可用享。","山下有澤，損；君子以懲忿窒欲。",["初九：巳事遄往，無咎，酌損之。","九二：利貞，征凶，弗損，益之。","六三：三人行，則損一人；一人行，則得其友。","六四：損其疾，使遄有喜，無咎。","六五：或益之，十朋之龜弗克違，元吉。","上九：弗損益之，無咎，貞吉，有攸往，得臣無家。"],["巳事遄往，尚合誌也。","九二利貞，中以為誌也。","一人行，三則疑也。","損其疾，亦可喜也。","六五元吉，自上佑也。","弗損益之，大得誌也。"]],["益：利有攸往，利涉大川。","風雷，益；君子以見善則遷，有過則改。",["初九：利用為大作，元吉，無咎。","六二：或益之，十朋之龜弗克違，永貞吉。王用享於帝，吉。","六三：益之用凶事，無咎。有孚中行，告公用圭。","六四：中行，告公從。利用為依遷國。","九五：有孚惠心，勿問元吉。有孚惠我德。","上九：莫益之，或擊之，立心勿恒，凶。"],["元吉無咎，下不厚事也。","或益之，自外來也。","益用凶事，固有之也。","告公從，以益誌也。","有孚惠心，勿問之矣。惠我德，大得誌也。","莫益之，偏辭也。或擊之，自外來也。"]],["夬：揚於王庭，孚號，有厲，告自邑，不利即戎，利有攸往。","澤上於天，夬；君子以施祿及下，居德則忌。",["初九：壯於前趾，往不勝為咎。","九二：惕號，莫夜有戎，勿恤。","九三：壯於頄，有凶。君子夬夬，獨行，遇雨，若濡，有慍，無咎。   ","九四：臀無膚，其行次且。牽羊悔亡，聞言不信。","九五：莧陸夬夬，中行無咎。","上六：無號，終有凶。"],["不勝而往，咎也。","莫夜有戎，得中道也。","君子夬夬，終無咎也。","其行次且，位不當也。聞言不信，聰不明也。","中行無咎，中未光也。","無號之凶，終不可長也。"]],["姤：女壯，勿用取女。","天下有風，姤；後以施命誥四方。",["初六：系於金柅，貞吉，有攸往，見凶，羸豕孚踟躅。","九二：包有魚，無咎，不利賓。","九三：臀無膚，其行次且，厲，無大咎。   ","九四：包無魚，起凶。","九五：以杞包瓜，含章，有隕自天。九五：以杞包瓜，含章，有隕自天。","上九：姤其角，吝，無咎。"],["系於金柅，柔道牽也。","包有魚，義不及賓也。","其行次且，行未牽也。","無魚之凶，遠民也。","九五含章，中正也。有隕自天，誌不舍命也。","姤其角，上窮吝也。"]],["萃：亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。","澤上於地，萃；君子以除戎器，戒不虞。",["初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往無咎。","六二：引吉，無咎，孚乃利用禴。","六三：萃如，嗟如，無攸利，往無咎，小吝。   ","九四：大吉，無咎。","九五：萃有位，無咎。匪孚，元永貞，悔亡。","上六：賫咨涕洟，無咎。"],["乃亂乃萃，其誌亂也。","引吉無咎，中未變也。","往無咎，上巽也。","大吉無咎，位不當也。","萃有位，誌未光也。","賫咨涕洟，未安上也。"]],["升：元亨，用見大人，勿恤，南征吉。","地中生木，升；君子以順德，積小以高大。",["初六：允升，大吉。","九二：孚乃利用禴，無咎。","九三：升虛邑。   ","六四：王用亨於岐山，吉無咎。","六五：貞吉，升階。","上六：冥升，利於不息之貞。"],["允升大吉，上合誌也。","九二之孚，有喜也。","升虛邑，無所疑也。","王用亨於岐山，順事也。","貞吉升階，大得誌也。","冥升在上，消不富也。"]],["困：亨，貞，大人吉，無咎，有言不信。","澤無水，困；君子以致命遂誌。",["初六：臀困於株木，入於幽谷，三歲不覿。","九二：困於酒食，朱紱方來，利用享祀，征凶，無咎。","六三：困於石，據於蒺藜，入於其宮，不見其妻，凶。   ","九四：來徐徐，困於金車，吝，有終。","九五：劓刖，困於赤紱，乃徐有說，利用祭祀。","上六：困於葛藟，於臲卼，曰動悔。有悔，征吉。"],["入於幽谷，幽不明也。","困於酒食，中有慶也。","據於蒺藜，乘剛也。入於其宮，不見其妻，不祥也。","來徐徐，誌在下也。雖不當位，有與也。","劓刖，誌未得也。乃徐有說，以中直也。利用祭祀，受福也。","困於葛藟，未當也。動悔，有悔吉，行也。"]],["井：改邑不改井，無喪無得，往來井井。汔至，亦未繘井，羸其瓶，凶。","木上有水，井；君子以勞民勸相。",["初六：井泥不食，舊井無禽。","九二：井谷射鮒，甕敝漏。","九三：井渫不食，為我心惻，可用汲，王明，並受其福。   ","六四：井甃，無咎。","九五：井冽，寒泉食。","上六：井收勿幕，有孚元吉。"],["井泥不食，下也。舊井無禽，時舍也。","井谷射鮒，無與也。","井渫不食，行惻也。求王明，受福也。","井甃無咎，修井也。","寒泉之食，中正也。","元吉在上，大成也。"]],["革：巳日乃孚，元亨利貞，悔亡。","澤中有火，革；君子以治歷明時。",["初九：鞏用黃牛之革。","六二：巳日乃革之，征吉，無咎。","九三：征凶，貞厲，革言三就，有孚。   ","九四：悔亡，有孚改命，吉。","九五：大人虎變，未占有孚。","上六：君子豹變，小人革面，征凶，居貞吉。"],["鞏用黃牛，不可以有為也。","巳日革之，行有嘉也。","革言三就，又何之矣。","改命之吉，信誌也。","大人虎變，其文炳也。","君子豹變，其文蔚也。小人革面，順以從君也。"]],["鼎：元吉，亨。","木上有火，鼎；君子以正位凝命。",["初六：鼎顛趾，利出否，得妾以其子，無咎。","九二：鼎有實，我仇有疾，不我能即，吉。","九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。   ","九四：鼎折足，覆公餗，其形渥，凶。","六五：鼎黃耳，金鉉，利貞。","上九：鼎玉鉉，大吉，無不利。"],["鼎顛趾，未悖也。利出否，以從貴也。","鼎有實，慎所之也。我仇有疾，終無尤也。","鼎耳革，失其義也。","覆公餗，信如何也。","鼎黃耳，中以為實也。","玉鉉在上，剛柔節也。"]],["震：亨。震來虩虩，笑言啞啞。震驚百裏，不喪匕鬯。","虩雷，震；君子以恐懼修身。",["初九：震來虩虩，後笑言啞啞，吉。","六二：震來厲，億喪貝，躋於九陵，勿逐，七日得。","六三：震蘇蘇，震行無眚。   ","九四：震遂泥。","六五：震往來厲，億無喪，有事。","上六：震索索，視矍矍，征凶。震不於其躬，於其鄰，無咎。婚媾有言。"],["震來虩虩，恐致福也。笑言啞啞，後有則也。","震來厲，乘剛也。","震蘇蘇，位不當也。","震遂泥，未光也。","震往來厲，危行也。其事在中，大無喪也。","震索索，中未得也。雖凶無咎，畏鄰戒也。"]],["艮：艮其背，不獲其身，行其庭，不見其人，無咎。","兼山，艮；君子以思不出其位。",["初六：艮其趾，無咎，利永貞。","六二：艮其腓，不拯其隨，其心不快。","九三：艮其限，列其夤，厲薰心。","六四：艮其身，無咎。","六五：艮其輔，言有序，悔亡。","上九：敦艮，吉。"],["艮其趾，未失正也。","不拯其隨，未退聽也。","艮其限，危薰心也。","艮其身，止諸躬也。","艮其輔，以中正也。","敦艮之吉，以厚終也。"]],["漸：女歸吉，利貞。","山上有木，漸；君子以居賢德，善俗。",["初六：鴻漸於幹，小子厲，有言，無咎。","六二：鴻漸於磐，飲食衎衎，吉。","九三：鴻漸於陸，夫征不復，婦孕不育，凶；利禦寇。","六四：鴻漸於木，或得其桷，無咎。","九五：鴻漸於陵，婦三歲不孕，終莫之勝，吉。","上九：鴻漸於陸，其羽可用為儀，吉。"],["小子之厲，義無咎也。","飲食衎衎，吉，不素飽也。","夫征不復，離群醜也。婦孕不育，失其道也。利用禦寇，順相保也。","或得其桷，順以巽也。","終莫之勝，吉；得所願也。","其羽可用為儀，吉；不可亂也。"]],["歸妹：征凶，無攸利。","澤上有雷，歸妹；君子以永終知敝。",["初九：歸妹以娣，跛能履，征吉。","九二：眇能視，利幽人之貞。","六三：歸妹以須，反歸以娣。","九四：歸妹愆期，遲歸有時。","六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。","上六：女承筐無實，士刲羊無血，無攸利。"],["歸妹以娣，以恒也。跛能履吉，相承也。","利幽人之貞，未變常也。","歸妹以須，未當也。","愆期之誌，有待而行也。","帝乙歸妹，不如其娣之袂良也。其位在中，以貴行也。","上六無實，承虛筐也。"]],["豐：亨，王假之，勿憂，宜日中。","雷電皆至，豐；君子以折獄致刑。",["初九：遇其配主，雖旬無咎，往有尚。","六二：豐其蔀，日中見鬥，往得疑疾，有孚發若，吉。","九三：豐其沛，日中見沫，折其右肱，無咎。","九四：豐其蔀，日中見鬥，遇其夷主，吉。","六五：來章，有慶譽，吉。","上六：豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，凶。"],["雖旬無咎，過旬災也。","有孚發若，信以發誌也。","豐其沛，不可大事也。折其右肱，終不可用也。","豐其蔀，位不當也。日中見鬥，幽不明也。遇其夷主，吉；行也。","六五之吉，有慶也。","豐其屋，天際翔也。闚其戶，闃其無人，自藏也。"]],["旅：小亨，旅貞吉。","山上有火，旅；君子以明慎用刑，而不留獄。",["初六：旅瑣瑣，斯其所取災。","六二：旅即次，懷其資，得童仆貞。","九三：旅焚其次，喪其童仆，貞厲。","九四：旅於處，得其資斧，我心不快。","六五：射雉一矢亡，終以譽命。","上九：鳥焚其巢，旅人先笑後號啕。喪牛於易，凶。"],["旅瑣瑣，誌窮災也。","得童仆貞，終無尤也。","旅焚其次，亦以傷矣。以旅與下，其義喪也。","旅於處，未得位也。得其資斧，心未快也。","終以譽命，上逮也。","以旅在上，其義焚也。喪牛於易，終莫之聞也。"]],["巽：小亨，利攸往，利見大人。","隨風，巽；君子以申命行事。",["初六：進退，利武人之貞。","九二：巽在床下，用史巫紛若，吉，無咎。","九三：頻巽，吝。","六四：悔亡，田獲三品。","九五：貞吉悔亡，無不利。無初有終，先庚三日，後庚三日，吉。","上九：巽在床下，喪其資斧，貞凶。"],["進退，誌疑也。利武人之貞，誌治也。","紛若之吉，得中也。","頻巽之吝，誌窮也。","田獲三品，有功也。","九五之吉，位正中也。","巽在床下，上窮也。喪其資斧，正乎凶也。"]],["兌：亨，利貞。","麗澤，兌；君子以朋友講習。",["初九：和兌，吉。","九二：孚兌，吉，悔亡。","六三：來兌，凶。","九四：商兌，未寧，介疾有喜。","九五：孚於剝，有厲。","上六：引兌。"],["和兌之吉，行未疑也。","孚兌之吉，信誌也。","來兌之凶，位不當也。","九四之喜，有慶也。","孚於剝，位正當也。","上六引兌，未光也。"]],["渙：亨。王假有廟，利涉大川，利貞。","風行水上，渙；先王以享於帝立廟。",["初六：用拯馬壯，吉。","九二：渙奔其機，悔亡。","六三：渙其躬，無悔。","六四：渙其群，元吉。渙有丘，匪夷所思。","九五：渙汗其大號，渙王居，無咎。","上九：渙其血，去逖出，無咎。"],["初六之吉，順也。","渙奔其機，得願也。","渙其躬，誌在外也。","渙其群，元吉；光大也。","王居無咎，正位也。","渙其血，遠害也。"]],["節：亨。苦節，不可貞。","澤上有水，節；君子以制數度，議德行。",["初九：不出戶庭，無咎。","九二：不出門庭，凶。","六三：不節若，則嗟若，無咎。","六四：安節，亨。","九五：甘節，吉；往有尚。","上六：苦節，貞凶，悔亡。"],["不出戶庭，知通塞也。","不出門庭，失時極也。","不節之嗟，又誰咎也。","安節之亨，承上道也。","甘節之吉，居位中也。","苦節貞凶，其道窮也。"]],["中孚：豚魚吉，利涉大川，利貞。","澤上有風，中孚；君子以議獄緩死。",["初九：虞吉，有它不燕。","九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。","六三：得敵，或鼓或罷，或泣或歌。","六四：月幾望，馬匹亡，無咎。","九五：有孚攣如，無咎。","上九：翰音登於天，貞凶。"],["初九虞吉，誌未變也。","其子和之，中心願也。","可鼓或罷，位不當也。","馬匹亡，絕類上也。","有孚攣如，位正當也。","翰音登於天，何可長也。"]],["小過：亨，利貞，可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。","山上有雷，小過；君子以行過乎恭，喪過乎哀，用過乎儉。",["初六：飛鳥以凶。","六二：過其祖，遇其妣；不及其君，遇其臣；無咎。","九三：弗過防之，從或戕之，凶。","九四：無咎，弗過遇之。往厲必戒，勿用永貞。","六五：密雲不雨，自我西郊，公弋取彼在穴。","上六：弗遇過之，飛鳥離之，凶，是謂災眚。"],["飛鳥以凶，不可如何也。","不及其君，臣不可過也。","從或戕之，凶如何也。","弗過遇之，位不當也。往厲必戒，終不可長也。","密雲不雨，已上也。","弗遇過之，已亢也。"]],["既濟：亨，小利貞，初吉終亂。","水在火上，既濟；君子以思患而預防之。",["初九：曳其輪，濡其尾，無咎。","六二：婦喪其茀，勿逐，七日得。","九三：高宗伐鬼方，三年克之，小人勿用。","六四：繻有衣袽，終日戒。","九五：東鄰殺牛，不如西鄰之禴祭，實受其福。","上六：濡其首，厲。"],["曳其輪，義無咎也。","七日得，以中道也。","三年克之，憊也。","終日戒，有所疑也。","東鄰殺牛，不如西鄰之時也；實受其福，吉大來也。","濡其首厲，何可久也。"]],["未濟：亨，小狐汔濟，濡其尾，無攸利。","火在水上，未濟；君子以慎辨物居方。",["初六：濡其尾，吝。","九二：曳其輪，貞吉。","六三：未濟，征凶，利涉大川。","九四：貞吉，悔亡，震用伐鬼方，三年有賞於大國。","六五：貞吉，無悔，君子之光，有孚，吉。","上九：有孚於飲酒，無咎，濡其首，有孚失是。"],["濡其尾，亦不知極也。","九二貞吉，中以行正也。","未濟征凶，位不當也。","貞吉悔亡，誌行也。","君子之光，其暉吉也。","飲酒濡首，亦不知節也。"]]];

function buildAiJudgeText(){

 const qCategorySel=document.getElementById('qCategory');

 if(!qCat){
   alert('請先在上方選擇「問題類型」，若無特定問題也請選擇最接近的類型，或選擇✏️自訂問題');
   return null;
 }
 let typeLabel=qCat,questionText='';
 if(qCat==='自訂問題'){
   questionText=(qCustomInput?qCustomInput.value:'').trim();
 }else{
   const qVal=qQuestionSel?qQuestionSel.value:'';
   if(!qVal){
     alert('請選擇「常見問題」，或選擇✏️自訂問題後輸入內容');

   questionText=qVal==='自訂問題'?(qCustomInput?qCustomInput.value:'').trim():qVal;

 }
 const now=new Date();

 const hourBranch=HOUR_BRANCHES[d.h-1]||'';

   const marker=r.isShi?'⬅️【世】':r.isYing?'⬅️【應】':'';
   return `${r.pos}　${r.branch}${r.element}　（${r.relative||'—'}）${marker}`;
 }).join('\n');
 const changeText=d.change?`變卦：第 ${d.change.hexNo} 卦｜${d.change.hexName}（上卦：${d.change.upper}　下卦：${d.change.lower}）`:'變卦：（無對應資料）';
 return `【問題類型】${typeLabel}
【所問問題】${questionText}
【占卜時間】${timeStr}（${hourBranch}時）

【卦象資料】

上卦：${d.upper}　下卦：${d.lower}
動爻：${d.moveLineName}
${changeText}

【六爻資料】（由上爻至初爻）
${linesText}

【標準判讀規則】
${getAiJudgeRules()}`;
}
function copyAiJudge(){
 const text=buildAiJudgeText();
 if(!text)return;
 const btn=document.getElementById('copyAiJudgeBtn');
 const showDone=()=>{
   if(!btn)return;
   const old=btn.textContent;
   btn.textContent='✅ 已複製！可到 ChatGPT 貼上';
   setTimeout(()=>{btn.textContent=old},1800);
 };
 const fallbackCopy=()=>{
   try{
     const ta=document.createElement('textarea');
     ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
     document.body.appendChild(ta);ta.focus();ta.select();
     document.execCommand('copy');
     document.body.removeChild(ta);
     showDone();
   }catch(e){alert('複製失敗，請手動選取文字複製')}
 };
 if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(text).then(showDone).catch(fallbackCopy);
 }else{
   fallbackCopy();
 }
}

/* ============ 雲端同步（選用） ============
   資料仍然先存在這台裝置（瀏覽器），填入後端網址與同步密碼後：
   - 修改後約 1.5 秒自動上傳到你自己的 Cloudflare 後端
   - 回到頁面、以及每 45 秒，自動檢查雲端有沒有新版本
   - 兩邊同時改過時，不會自動覆蓋，會讓你選
   同步密碼只存在這台裝置的瀏覽器，不會寫進網頁檔案，也不會包含在「匯出備份」裡。 */
const SYNC_KEY='xiaoxiao_magicbook_sync';
const SYNC=syncLoad();
let mediaReady=false;
function syncLoad(){
 const d={url:'',token:'',rev:0,sig:'',dirty:false,last:'',state:'ok',err:'',busy:false,applying:false,pending:null,cloud:null,timer:null,poll:null};
 try{const s=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');d.url=s.url||'';d.token=s.token||'';d.rev=Number(s.rev)||0;d.sig=s.sig||'';d.dirty=!!s.dirty;d.last=s.last||''}catch(e){}
 return d;
}
function syncSave(){try{localStorage.setItem(SYNC_KEY,JSON.stringify({url:SYNC.url,token:SYNC.token,rev:SYNC.rev,sig:SYNC.sig,dirty:SYNC.dirty,last:SYNC.last}))}catch(e){}}
const backendOn=()=>!!(SYNC.url&&SYNC.token);
const sigOf=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return s.length+':'+(h>>>0).toString(36)};
function canon(v){
 if(Array.isArray(v))return v.map(canon);
 if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{o[k]=canon(v[k])});return o}
 return v;
}
const dataSig=d=>sigOf(JSON.stringify(canon(d)));
const storeSig=()=>dataSig(store);
const p2=n=>String(n).padStart(2,'0');
function fmtDT(s){const d=new Date(s);return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`}
function isEmptyStore(s){
 if(!s)return true;
 const n=a=>Array.isArray(a)?a.length:0;
 return n(s.reiki)+n(s.chakras)+n(s.crystals)+n(s.symbols)+n(s.ichingCustomCategories)===0
  && (s.customCategories||[]).every(c=>!(c.items&&c.items.length))
  && !(s.aiJudgeRules&&String(s.aiJudgeRules).trim());
}
function syncToast(msg){
 let t=document.getElementById('syncToast');
 if(!t){t=document.createElement('div');t.id='syncToast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#37352F;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9999;max-width:88vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none';document.body.appendChild(t)}
 t.textContent=msg;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0'},3200);
}

/* ---- 被取代資料的備份（存在瀏覽器的另一個資料庫，不佔用魔法書資料空間）---- */
function openBackupDB(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB)return reject(new Error('no idb'));
  const r=indexedDB.open('xiaoxiao-magicbook-sync-backup',1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('b'))r.result.createObjectStore('b',{keyPath:'ts'})};
  r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
 });
}
async function backupReplaced(data,reason){
 try{
  const db=await openBackupDB();
  const rec={ts:new Date().toISOString(),reason:reason,json:JSON.stringify(data)};
  await new Promise((res,rej)=>{
   const tx=db.transaction('b','readwrite'),os=tx.objectStore('b');
   os.put(rec);
   const ka=os.getAllKeys();
   ka.onsuccess=()=>{const keys=ka.result.sort();while(keys.length>5)os.delete(keys.shift())};
   tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)};
  });
  return true;
 }catch(e){console.error('備份被取代的資料失敗',e);return false}
}
async function downloadLastReplaced(){
 try{
  const db=await openBackupDB();
  const all=await new Promise((res,rej)=>{const r=db.transaction('b','readonly').objectStore('b').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  db.close();
  if(!all.length){alert('目前沒有被取代的備份。');return}
  all.sort((a,b)=>a.ts<b.ts?1:-1);
  const r=all[0];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([r.json],{type:'application/json'}));
  a.download='笑笑的魔法書-被取代前備份-'+r.ts.slice(0,16).replace(/[:T]/g,'-')+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 }catch(e){alert('讀取備份失敗')}
}

/* ---- 和後端通訊 ---- */
async function cloudFetch(path,o){
 o=o||{};
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),o.timeout||30000);
 try{
  const headers={Authorization:'Bearer '+SYNC.token};
  if(o.body)headers['content-type']='application/json';
  const res=await fetch(SYNC.url.replace(/\/+$/,'')+path,{method:o.method||'GET',signal:ctl.signal,headers:headers,body:o.body,cache:'no-store'});
  let j=null;try{j=await res.json()}catch(e){}
  return{ok:res.ok,status:res.status,json:j};
 }catch(e){return{ok:false,status:0,net:true,error:e.name==='AbortError'?'連線逾時':'無法連到雲端後端'}}
 finally{clearTimeout(to)}
}
const cloudErr=r=>r.net?r.error:(r.status===401?'同步密碼不正確':r.status===403?'後端拒絕了這個網頁來源（請檢查後端的 ALLOWED_ORIGINS）':(r.json&&r.json.error&&r.json.error.message)||('後端回應 HTTP '+r.status));

/* ---- 狀態顯示 ---- */
function syncStatusText(){
 if(!backendOn())return '尚未啟用';
 if(!mediaReady)return '正在載入圖片…';
 if(SYNC.state==='busy')return '同步中…';
 if(SYNC.state==='err')return '同步失敗：'+SYNC.err;
 if(SYNC.state==='conflict')return '雲端和這台的資料不一樣，等你選擇要用哪一份（按「立即同步」再選一次）';
 if(SYNC.state==='offline')return '目前連不上雲端，修改先存在這台，連線後會自動補上傳';
 if(SYNC.pending)return '雲端有新資料，離開編輯畫面後會自動套用';
 if(SYNC.dirty)return '有尚未上傳的修改，稍後自動上傳';
 return '已同步'+(SYNC.last?'（最近一次 '+fmtDT(SYNC.last)+'）':'');
}
function syncDotClass(){
 if(!backendOn())return 'hide';
 if(SYNC.state==='err')return 'err';
 if(SYNC.state==='busy')return 'busy';
 if(SYNC.state==='offline'||SYNC.state==='conflict'||SYNC.dirty||SYNC.pending)return 'warn';
 return 'ok';
}
function syncDotHtml(){
 const c=syncDotClass();
 return `<span id="syncdot" class="syncdot ${c}" title="雲端同步：${esc(syncStatusText())}"></span>`;
}
function updateSyncUI(){
 const d=document.getElementById('syncdot');
 if(d){d.className='syncdot '+syncDotClass();d.title='雲端同步：'+syncStatusText()}
 const el=document.getElementById('syncstat');if(el)el.textContent=syncStatusText();
}
function setSyncState(state,err){SYNC.state=state;SYNC.err=err||'';updateSyncUI()}

/* ---- 上傳 ---- */
function syncAfterPersist(){
 if(!backendOn()||SYNC.applying||!mediaReady)return;
 const dirty=storeSig()!==SYNC.sig;
 if(dirty!==SYNC.dirty){SYNC.dirty=dirty;syncSave()}
 updateSyncUI();
 if(dirty&&SYNC.state!=='conflict')schedulePush();
}
function schedulePush(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>{pushNow()},1500)}
async function pushNow(force){
 if(!backendOn()||!mediaReady)return false;
 if(SYNC.busy){return false}
 if(SYNC.state==='conflict'&&!force)return false;
 if(!SYNC.dirty&&!force)return true;
 if(isEmptyStore(store)&&SYNC.rev>0&&!force){setSyncState('err','這台的資料是空的，已暫停上傳，避免蓋掉雲端的資料');return false}
 SYNC.busy=true;setSyncState('busy');
 const mySig=storeSig();
 const body='{"baseRev":'+SYNC.rev+',"data":'+JSON.stringify(store)+'}';
 const r=await cloudFetch('/api/data',{method:'PUT',timeout:90000,body:body});
 SYNC.busy=false;
 if(r.ok&&r.json&&Number.isInteger(r.json.rev)){
  SYNC.rev=r.json.rev;SYNC.sig=mySig;SYNC.last=new Date().toISOString();SYNC.dirty=storeSig()!==SYNC.sig;syncSave();
  setSyncState('ok');
  if(SYNC.dirty)schedulePush();
  return true;
 }
 if(r.status===409){await onConflict();return false}
 if(r.net){setSyncState('offline');return false}
 setSyncState('err',cloudErr(r));return false;
}
async function onConflict(){
 const r=await cloudFetch('/api/data');
 if(!r.ok||!r.json||!r.json.data){setSyncState(r.net?'offline':'err',cloudErr(r));return}
 const cd=normalizeSymbolSteps(normalizeStore(r.json.data));
 // 雲端內容其實和這台一樣（例如上次上傳成功但回應遺失）→ 直接對齊版本，不打擾
 if(dataSig(cd)===storeSig()){SYNC.rev=r.json.rev;SYNC.sig=storeSig();SYNC.dirty=false;SYNC.last=new Date().toISOString();syncSave();setSyncState('ok');return}
 SYNC.cloud={rev:r.json.rev,data:r.json.data,updatedAt:r.json.updatedAt};
 setSyncState('conflict');showConflict();
}

/* ---- 下載 ---- */
async function pullNow(){
 if(!backendOn()||SYNC.busy||!mediaReady)return null;
 const r=await cloudFetch('/api/data?since='+SYNC.rev);
 if(!r.ok||!r.json){if(r.net)setSyncState('offline');else setSyncState('err',cloudErr(r));return r}
 if(SYNC.state==='conflict')return r;
 const cloud=r.json;
 if(cloud.unchanged){if(SYNC.state!=='ok')setSyncState('ok');return r}
 if(cloud.rev===0){ // 雲端是空的：把這台的資料上傳
  setSyncState('ok');
  if(!isEmptyStore(store)){SYNC.rev=0;SYNC.dirty=true;syncSave();await pushNow(true)}
  return r;
 }
 if(cloud.rev>SYNC.rev){
  if(SYNC.dirty){SYNC.cloud={rev:cloud.rev,data:cloud.data,updatedAt:cloud.updatedAt};setSyncState('conflict');showConflict();return r}
  SYNC.pending={rev:cloud.rev,data:cloud.data};
  setSyncState('ok');
  tryApplyPending();
 }
 return r;
}
async function syncTick(){
 if(!backendOn()||!mediaReady)return;
 await pullNow();
 if(SYNC.dirty&&SYNC.state!=='conflict'&&!SYNC.busy)await pushNow();
}

/* ---- 套用雲端資料（不蓋掉正在輸入的內容）---- */
const SYNC_SAFE_PAGES=['home','reikiList','chakras','crystals','symbols','customCategories','ichingMenu','ichingLines','ichingAudit','reikiDetail','knowledgeDetail','customList'];
function canApplyNow(){
 if(document.getElementById('modal').classList.contains('open'))return false;
 if(document.getElementById('syncModal'))return false;
 const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return false;

function viewStillValid(){

 if(page==='knowledgeDetail')return (store[currentType]||[]).some(x=>x.id===currentId);
 if(page==='customList')return (store[customScope]||[]).some(c=>c.id===currentId);
 return true;
}
function tryApplyPending(){
 if(!SYNC.pending||SYNC.busy)return false;
 if(!canApplyNow()){updateSyncUI();return false}
 const p=SYNC.pending;SYNC.pending=null;
 applyCloud(p.data,p.rev,{quiet:true});
 return true;
}
async function applyCloud(data,rev,o){
 o=o||{};
 if(!data||!Array.isArray(data.reiki)||!Array.isArray(data.chakras))return false;
 SYNC.applying=true;
 const before=store;
 try{
  store=normalizeSymbolSteps(normalizeStore(data));
  await save();
 }catch(e){
  console.error(e);store=before;SYNC.applying=false;
  setSyncState('err','雲端資料寫入這台失敗（可能儲存空間不足）');return false;
 }
 SYNC.rev=rev;SYNC.sig=storeSig();SYNC.dirty=false;SYNC.last=new Date().toISOString();SYNC.cloud=null;SYNC.pending=null;syncSave();
 SYNC.applying=false;
 setSyncState('ok');
 if(!SYNC_SAFE_PAGES.includes(page)||!viewStillValid()){draft=null;page='home'}
 render();
 syncToast(o.quiet?'已同步雲端最新資料':'已套用雲端資料');
 return true;
}

/* ---- 第一次連線 ---- */
async function linkSync(){
 const r=await cloudFetch('/api/data');
 if(!r.ok||!r.json)return{ok:false,msg:cloudErr(r)};
 const cloud=r.json,hasLocal=!isEmptyStore(store);
 if(cloud.rev===0||!cloud.data){
  SYNC.rev=0;SYNC.sig='';SYNC.dirty=hasLocal;SYNC.cloud=null;syncSave();
  if(hasLocal){const ok=await pushNow(true);return{ok:ok,msg:ok?'雲端還是空的，已把這台的資料上傳。之後的修改會自動同步。':'上傳沒有成功，請稍後按「立即同步」。'}}
  SYNC.sig=storeSig();syncSave();setSyncState('ok');
  return{ok:true,msg:'雲端和這台都還沒有資料。之後的修改會自動同步。'};
 }
 if(!hasLocal){await applyCloud(cloud.data,cloud.rev,{});return{ok:true,msg:'已從雲端下載資料。'}}
 const cd=normalizeSymbolSteps(normalizeStore(cloud.data));
 if(dataSig(cd)===storeSig()){SYNC.rev=cloud.rev;SYNC.sig=storeSig();SYNC.dirty=false;SYNC.last=new Date().toISOString();SYNC.cloud=null;syncSave();setSyncState('ok');return{ok:true,msg:'雲端和這台的資料相同，已連線。'}}
 SYNC.cloud={rev:cloud.rev,data:cloud.data,updatedAt:cloud.updatedAt,first:true};SYNC.rev=0;SYNC.dirty=true;syncSave();
 setSyncState('conflict');showConflict();
 return{ok:true,pendingChoice:true,msg:'雲端和這台都有資料，請在跳出的視窗選要用哪一份。'};
}

/* ---- 啟動 ---- */
function syncStart(){
 if(!backendOn())return;
 clearInterval(SYNC.poll);
 SYNC.poll=setInterval(()=>{if(document.visibilityState==='visible'){tryApplyPending();syncTick()}},45000);
 syncTick();
}
setInterval(()=>{if(SYNC.pending)tryApplyPending()},3000);
document.addEventListener('visibilitychange',()=>{
 if(!backendOn())return;
 if(document.visibilityState==='visible')syncTick();
 else if(SYNC.dirty&&SYNC.state!=='conflict'&&mediaReady){clearTimeout(SYNC.timer);pushNow()}
});
window.addEventListener('online',()=>{syncTick()});

/* ---- 首頁的設定卡片 ---- */
function syncCardHtml(){
 return `<div class="card" style="margin-top:15px">
  <h3>☁️ 跨裝置自動同步</h3>
  <p class="muted">電腦改的資料，手機打開會自動拿到最新版，不用再手動匯出、匯入。</p>
  <div class="field"><label>後端網址</label><input id="syncUrl" type="url" placeholder="https://reiki-tool-sync.你的帳號.workers.dev" value="${esc(SYNC.url)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label>同步密碼</label><input id="syncToken" type="password" placeholder="${SYNC.token?'（已設定，不顯示；要換再輸入）':'輸入你設定的同步密碼'}" autocomplete="off"></div>
  <div class="row" style="margin-top:8px"><button class="primary" id="syncConnect">保存並連線</button><button class="ghost" id="syncNow">立即同步</button></div>
  <p id="syncstat" class="muted" style="margin:8px 0 0;font-weight:700">${esc(syncStatusText())}</p>
  <p id="syncMsg" class="muted" style="margin:4px 0 0"></p>
  <div class="row" style="margin-top:8px"><button class="ghost" id="syncDl">下載最近一份被取代的資料</button>${backendOn()?'<button class="ghost" id="syncOff">停用同步</button>':''}</div>
 </div>`;
}
function bindSyncUI(){
 const msg=t=>{const e=document.getElementById('syncMsg');if(e)e.textContent=t};
 document.getElementById('syncConnect').onclick=async()=>{
  const url=document.getElementById('syncUrl').value.trim().replace(/\/+$/,'');
  const tk=document.getElementById('syncToken').value.trim();
  if(!/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1))/.test(url)){msg('請輸入以 https:// 開頭的後端網址');return}
  const token=tk||SYNC.token;
  if(!token){msg('請輸入同步密碼');return}
  if(!mediaReady){msg('圖片還在載入，請等幾秒再按一次');return}
  const changed=url!==SYNC.url||token!==SYNC.token;
  SYNC.url=url;SYNC.token=token;
  if(changed){SYNC.rev=0;SYNC.sig='';SYNC.dirty=false;SYNC.cloud=null;SYNC.pending=null}
  syncSave();setSyncState('busy');msg('連線中…');
  const r=await linkSync();
  if(!r.ok){setSyncState('err',r.msg);msg(r.msg);return}
  document.getElementById('syncToken').value='';
  msg(r.msg);syncStart();updateSyncUI();
 };
 document.getElementById('syncNow').onclick=async()=>{
  if(!backendOn()){msg('請先填網址與密碼，按「保存並連線」');return}
  if(SYNC.state==='conflict'&&SYNC.cloud){showConflict();return}
  if(SYNC.state==='conflict'){await onConflict();return}
  msg('同步中…');
  SYNC.state='ok';
  await pullNow();
  if(SYNC.dirty&&SYNC.state!=='conflict')await pushNow();
  tryApplyPending();
  msg(SYNC.state==='ok'?'完成':'');updateSyncUI();
 };
 document.getElementById('syncDl').onclick=downloadLastReplaced;
 const off=document.getElementById('syncOff');
 if(off)off.onclick=()=>{
  if(!confirm('停用後，這台不再自動同步（本機資料和雲端資料都不會被刪除）。確定嗎？'))return;
  clearInterval(SYNC.poll);clearTimeout(SYNC.timer);
  SYNC.url='';SYNC.token='';SYNC.rev=0;SYNC.sig='';SYNC.dirty=false;SYNC.pending=null;SYNC.cloud=null;SYNC.state='ok';syncSave();render();
 };
}

render();
hydrateStoreMedia().then(()=>{mediaReady=true;render();syncStart()}).catch(err=>{console.error('圖片資料載入失敗',err);if(backendOn())setSyncState('err','圖片資料載入失敗，已暫停同步')});
})();
</script>
</body>
